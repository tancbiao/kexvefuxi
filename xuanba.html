<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>校队选拔 · 推理能力评估</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "微软雅黑", "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh; color: #fff; overflow-x: hidden;
}
.container { max-width: 860px; margin: 0 auto; padding: 16px; }
.screen { display: none; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* Card style */
.card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 24px; margin-bottom: 16px;
}

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: rgba(0,0,0,0.3);
  border-radius: 12px; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.topbar .progress-text { font-size: 0.95em; color: rgba(255,255,255,0.7); }
.topbar .progress-text strong { color: #ffd700; }
.topbar .timer { font-size: 1.1em; color: #4ecdc4; font-weight: 700; }
.progress-bar {
  width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 16px;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #ffd700, #4ecdc4);
  border-radius: 2px; transition: width 0.3s;
}
.group-tag {
  display: inline-block; padding: 2px 10px; border-radius: 8px;
  font-size: 0.8em; font-weight: 700; background: rgba(255,255,255,0.1);
}

/* Matrix image */
.matrix-container { text-align: center; margin-bottom: 16px; }
.matrix-container img {
  max-width: 100%; max-height: 360px; border-radius: 8px;
  background: rgba(255,255,255,0.95); padding: 12px;
}

/* Options */
.options-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
}
.option-card {
  background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 8px; cursor: pointer; transition: all 0.2s;
  text-align: center; position: relative;
}
.option-card:hover { border-color: rgba(255,215,0,0.4); background: rgba(255,215,0,0.06); }
.option-card.selected { border-color: #ffd700; background: rgba(255,215,0,0.12); box-shadow: 0 0 16px rgba(255,215,0,0.15); }
.option-card .opt-label {
  position: absolute; top: 4px; left: 8px; font-size: 0.75em; color: rgba(255,255,255,0.4);
  font-weight: 700; z-index: 1;
}
.option-card.selected .opt-label { color: #ffd700; }
.option-card img {
  max-width: 100%; max-height: 80px; border-radius: 4px;
  background: rgba(255,255,255,0.95); padding: 4px;
}

/* Nav buttons */
.nav-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.btn {
  padding: 10px 24px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08); color: #fff; font-size: 0.95em;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn:hover { background: rgba(255,255,255,0.14); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-weight: 700; border: none; }
.btn-primary:hover { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
.btn-submit { background: linear-gradient(135deg, #4ecdc4, #2ecc71); color: #1a1a2e; font-weight: 700; border: none; padding: 14px 36px; font-size: 1.1em; }
.btn-submit:hover { box-shadow: 0 0 20px rgba(78,205,196,0.3); }

/* Intro screen */
.hero-title {
  font-size: 2.2em; font-weight: 900; text-align: center;
  background: linear-gradient(135deg, #ffd700, #ff6b6b, #4ecdc4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.hero-subtitle { text-align: center; font-size: 1em; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
.info-list { list-style: none; padding: 0; }
.info-list li { padding: 8px 0; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 8px; }
.info-list li .icon { font-size: 1.3em; width: 28px; text-align: center; }
.attempt-warning {
  background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3);
  border-radius: 10px; padding: 12px 16px; margin-top: 16px;
  color: #ff6b6b; font-size: 0.9em; display: flex; align-items: center; gap: 8px;
}

/* Result screen */
.result-header { text-align: center; padding: 28px 16px; }
.result-score { font-size: 4.5em; font-weight: 900; color: #ffd700; line-height: 1; }
.result-label { font-size: 1em; color: rgba(255,255,255,0.5); margin-top: 4px; }
.result-level { font-size: 1.3em; font-weight: 700; margin-top: 12px; }
.result-detail { margin-top: 8px; color: rgba(255,255,255,0.5); }
.level-breakdown { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
.level-stat {
  background: rgba(255,255,255,0.06); border-radius: 10px; padding: 12px;
  text-align: center; border: 1px solid rgba(255,255,255,0.08);
}
.level-stat .lvl-name { font-size: 0.8em; color: rgba(255,255,255,0.5); }
.level-stat .lvl-score { font-size: 1.4em; font-weight: 700; color: #ffd700; }
.level-stat .lvl-pct { font-size: 0.75em; color: rgba(255,255,255,0.4); }
.simple-chart { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.simple-chart-fill { height: 100%; background: linear-gradient(90deg, #4ecdc4, #ffd700); border-radius: 3px; transition: width 0.5s; }

/* Review grid */
.review-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; margin: 16px 0; }
.review-dot {
  aspect-ratio: 1; border-radius: 6px; display: flex;
  align-items: center; justify-content: center; font-size: 0.65em; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.review-dot.correct { background: rgba(46,204,113,0.25); border: 1px solid rgba(46,204,113,0.5); color: #2ecc71; }
.review-dot.wrong { background: rgba(255,107,107,0.25); border: 1px solid rgba(255,107,107,0.5); color: #ff6b6b; }
.review-dot.unanswered { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); }
.review-dot:hover { transform: scale(1.2); }

/* Loading */
.loading-spinner {
  text-align: center; padding: 40px; font-size: 1.1em; color: rgba(255,255,255,0.5);
}
.loading-img { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #ffd700; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .options-grid { grid-template-columns: repeat(2, 1fr); }
  .level-breakdown { grid-template-columns: repeat(3, 1fr); }
  .hero-title { font-size: 1.5em; }
  .matrix-container img { max-height: 260px; }
  .review-grid { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>
<body>
<div class="container">

<!-- ====== Loading Screen ====== -->
<div class="screen active" id="screenLoading">
  <div class="card" style="text-align:center;padding:60px 20px;">
    <div class="loading-spinner"><div class="loading-img"></div>正在加载题库...</div>
  </div>
</div>

<!-- ====== Intro Screen ====== -->
<div class="screen" id="screenIntro">
  <div class="hero-title">校队选拔</div>
  <div class="hero-subtitle">图形推理能力评估</div>
  <div class="card">
    <ul class="info-list">
      <li><span class="icon">📝</span> 共 <strong>60</strong> 道图形推理题，A~E 五组难度递增</li>
      <li><span class="icon">⏱</span> 不限时，建议 25-35 分钟完成</li>
      <li><span class="icon">🖱</span> 每题从下方的选项中选出缺失的图形</li>
      <li><span class="icon">🔙</span> 可自由回看和修改答案</li>
      <li><span class="icon">💾</span> 答题进度自动保存</li>
      <li><span class="icon">📊</span> 完成后生成推理能力评估报告</li>
    </ul>
    <div id="attemptWarning" style="display:none;"></div>
    <div style="text-align:center;margin-top:24px;">
      <button class="btn btn-primary" onclick="startTest()" style="font-size:1.2em;padding:14px 48px;">
        开始测试
      </button>
    </div>
  </div>
</div>

<!-- ====== Test Screen ====== -->
<div class="screen" id="screenTest">
  <div class="progress-bar"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <div class="topbar">
    <span class="progress-text">第 <strong id="qCurrent">1</strong>/60 题 · <span class="group-tag" id="qGroup" style="color:#ffd700;border-color:rgba(255,215,0,0.3);">A</span></span>
    <span class="timer">⏱ <span id="timerDisplay">00:00</span></span>
  </div>
  <div class="card">
    <div class="matrix-container" id="matrixContainer"></div>
    <div style="text-align:center;color:rgba(255,255,255,0.35);font-size:0.85em;margin-bottom:12px;">
      请从下方选项中选出最适合填入空缺位置的图形
    </div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>
  <div class="nav-row">
    <button class="btn" id="btnPrev" onclick="prevQuestion()" disabled>← 上一题</button>
    <button class="btn" id="btnNext" onclick="nextQuestion()">下一题 →</button>
  </div>
  <div class="nav-row">
    <button class="btn btn-submit" id="btnSubmit" onclick="showSubmitConfirm()" style="display:none;">✓ 提交答卷</button>
  </div>
  <div style="text-align:center;margin-top:8px;" id="reviewDots"></div>
</div>

<!-- ====== Result Screen ====== -->
<div class="screen" id="screenResult">
  <div class="result-header">
    <div class="result-score" id="resultScore">0</div>
    <div class="result-label">正确数 / 60 题</div>
    <div class="result-level" id="resultLevel" style="color:#ffd700;">-</div>
    <div class="result-detail">
      正确率: <span id="resultPct" style="color:#4ecdc4;font-weight:700;">-</span>
      &nbsp;|&nbsp; ⏱ 用时: <span id="resultTime">-</span>
    </div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:12px;">各组正确率</div>
    <div class="level-breakdown" id="levelBreakdown"></div>
  </div>
  <div class="card" id="reviewCard">
    <div style="font-weight:700;margin-bottom:12px;">逐题回顾（点击可查看详情）</div>
    <div class="review-grid" id="reviewGrid"></div>
  </div>
  <div style="text-align:center;margin-top:16px;">
    <button class="btn btn-primary" onclick="closeTest()">完成</button>
  </div>
</div>

</div>

<script src="data/xuanba-questions-v2.js?v=20260603"></script>
<script>
// ============== State ==============
var questions = [];
var answers = [];
var currentQ = 0;
var timerSeconds = 0;
var timerInterval = null;
var testStarted = false;
var testSubmitted = false;

var studentId = '';
var studentName = '';
var grade = '';

var STORAGE_KEY = 'xuanba2_state_';
var ATTEMPT_KEY = 'xuanba2_attempts_';

// ============== Init ==============
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'init_xuanba') {
    studentId = e.data.studentId || '';
    studentName = e.data.studentName || '';
    grade = e.data.grade || '';
    STORAGE_KEY += studentId;
    ATTEMPT_KEY += studentId;
    initApp();
  }
});

function initApp() {
  if (typeof XUANBA_QUESTIONS !== 'undefined') {
    questions = XUANBA_QUESTIONS;
  } else {
    document.getElementById('screenLoading').innerHTML = 
      '<div class="card" style="text-align:center;padding:60px 20px;"><div style="font-size:3em;">⚠️</div><div style="color:#ff6b6b;">题库加载失败，请刷新页面</div></div>';
    return;
  }

  var saved = loadProgress();
  if (saved && saved.answers && !saved.submitted) {
    for (var i = 0; i < Math.min(saved.answers.length, questions.length); i++) {
      answers[i] = saved.answers[i];
    }
    currentQ = saved.currentQ || 0;
    timerSeconds = saved.timerSeconds || 0;
    if (saved.answers.some(function(a) { return a !== null; })) {
      if (confirm('检测到未完成的测试（已答 ' + saved.answers.filter(function(a){return a!==null;}).length + ' / ' + questions.length + ' 题）。是否继续？')) {
        showScreen('test');
        renderQuestion();
        if (!testStarted) startTimer();
        updateProgress();
        document.getElementById('screenLoading').classList.remove('active');
        return;
      } else {
        answers = []; currentQ = 0; timerSeconds = 0; clearProgress();
      }
    }
  }

  var attempts = getAttempts();
  if (attempts.length >= 2) {
    document.getElementById('attemptWarning').innerHTML = 
      '<div class="attempt-warning">⚠️ 您已完成 ' + attempts.length + ' 次测试（最多2次）。<br>最佳成绩: ' + getBestScore() + ' 分</div>';
    document.getElementById('attemptWarning').style.display = 'block';
    var startBtn = document.querySelector('#screenIntro .btn-primary');
    if (startBtn) { startBtn.disabled = true; startBtn.textContent = '已达测试次数上限'; startBtn.style.opacity = '0.5'; }
  }

  showScreen('intro');
  document.getElementById('screenLoading').classList.remove('active');
}

// ============== Screen Navigation ==============
function showScreen(name) {
  ['loading','intro','test','result'].forEach(function(s) {
    var el = document.getElementById('screen' + s.charAt(0).toUpperCase() + s.slice(1));
    if (el) el.classList.remove('active');
  });
  var el = document.getElementById('screen' + name.charAt(0).toUpperCase() + name.slice(1));
  if (el) el.classList.add('active');
}

// ============== Timer ==============
function startTimer() {
  testStarted = true;
  timerInterval = setInterval(function() {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  var m = Math.floor(timerSeconds / 60);
  var s = timerSeconds % 60;
  document.getElementById('timerDisplay').textContent = 
    (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

// ============== Test Flow ==============
function startTest() {
  var attempts = getAttempts();
  if (attempts.length >= 2) {
    alert('您已完成2次测试。如需再次测试请联系老师。');
    return;
  }
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  timerSeconds = 0;
  testSubmitted = false;
  showScreen('test');
  renderQuestion();
  startTimer();
  saveProgress();
  updateProgress();
}

function renderQuestion() {
  var q = questions[currentQ];
  if (!q) return;

  document.getElementById('qCurrent').textContent = currentQ + 1;
  var g = document.getElementById('qGroup');
  g.textContent = '组 ' + q.group;
  var groupColors = { A: '#4ecdc4', B: '#4ade80', C: '#fbbf24', D: '#ff8c00', E: '#ff6b6b' };
  g.style.color = groupColors[q.group] || '#fff';
  g.style.borderColor = (groupColors[q.group] || '#fff') + '44';

  // Render main question image
  var imgSrc = q.matrix || '';
  document.getElementById('matrixContainer').innerHTML = imgSrc 
    ? '<img src="' + imgSrc + '" alt="题目" crossorigin="anonymous">'
    : '<div style="color:#ff6b6b;padding:40px;">图片加载失败</div>';

  // Render options
  var html = '';
  var opts = q.options || [];
  for (var i = 0; i < opts.length; i++) {
    var selected = (answers[currentQ] === i) ? ' selected' : '';
    var optImg = opts[i] || '';
    html += '<div class="option-card' + selected + '" onclick="selectOption(' + i + ')" title="选项 ' + (i+1) + '">';
    html += '<span class="opt-label">' + (i + 1) + '</span>';
    html += optImg ? '<img src="' + optImg + '" alt="选项' + (i+1) + '" crossorigin="anonymous">' : '<div style="padding:30px;color:#666;">?</div>';
    html += '</div>';
  }
  document.getElementById('optionsGrid').innerHTML = html;

  document.getElementById('btnPrev').disabled = (currentQ === 0);
  document.getElementById('btnNext').style.display = (currentQ < questions.length - 1) ? '' : 'none';
  document.getElementById('btnSubmit').style.display = (currentQ === questions.length - 1) ? '' : 'none';

  renderReviewDots();
  updateProgress();
}

function selectOption(index) {
  answers[currentQ] = index;
  document.querySelectorAll('.option-card').forEach(function(card, i) {
    card.classList.toggle('selected', i === index);
  });
  saveProgress();
  updateProgress();
  renderReviewDots();
  setTimeout(function() {
    if (currentQ < questions.length - 1) nextQuestion();
  }, 250);
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); saveProgress(); }
}

function nextQuestion() {
  if (currentQ < questions.length - 1) { currentQ++; renderQuestion(); saveProgress(); }
}

function showSubmitConfirm() {
  var unanswered = answers.filter(function(a) { return a === null; }).length;
  var msg = '确认提交答卷？';
  if (unanswered > 0) msg += '\n\n⚠️ 还有 ' + unanswered + ' 题未作答，将计为错误。';
  if (confirm(msg)) submitTest();
}

function submitTest() {
  if (testSubmitted) return;
  testSubmitted = true;
  clearInterval(timerInterval);

  var correct = 0;
  var groupStats = { A: { total: 0, correct: 0 }, B: { total: 0, correct: 0 }, C: { total: 0, correct: 0 }, D: { total: 0, correct: 0 }, E: { total: 0, correct: 0 } };
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    groupStats[q.group].total++;
    if (answers[i] !== null && answers[i] === q.correct) {
      correct++;
      groupStats[q.group].correct++;
    }
  }

  var pct = Math.round(correct / 60 * 100);
  
  // Level classification (no IQ terminology)
  var level = '', levelColor = '#ffd700';
  if (pct >= 95) { level = '推理能力 ★★★★★  卓越'; levelColor = '#ff5722'; }
  else if (pct >= 85) { level = '推理能力 ★★★★☆  优秀'; levelColor = '#ffd700'; }
  else if (pct >= 70) { level = '推理能力 ★★★☆☆  良好'; levelColor = '#4ecdc4'; }
  else if (pct >= 55) { level = '推理能力 ★★☆☆☆  中等'; levelColor = '#4ade80'; }
  else if (pct >= 40) { level = '推理能力 ★☆☆☆☆  偏低'; levelColor = '#fbbf24'; }
  else if (pct >= 25) { level = '推理能力 ☆☆☆☆☆  较弱'; levelColor = '#ff6b6b'; }
  else { level = '推理能力 ☆☆☆☆☆  需加强'; levelColor = '#ff4444'; }

  // Display results
  document.getElementById('resultScore').textContent = correct;
  document.getElementById('resultPct').textContent = pct + '%';
  document.getElementById('resultLevel').textContent = level;
  document.getElementById('resultLevel').style.color = levelColor;
  var m = Math.floor(timerSeconds / 60);
  var s = timerSeconds % 60;
  document.getElementById('resultTime').textContent = m + '分' + s + '秒';

  // Group breakdown
  var groups = ['A', 'B', 'C', 'D', 'E'];
  var groupNames = { A: 'A组·辨别', B: 'B组·类比', C: 'C组·推理', D: 'D组·系列', E: 'E组·综合' };
  var breakHtml = '';
  for (var g = 0; g < groups.length; g++) {
    var gs = groupStats[groups[g]];
    var gpct = gs.total > 0 ? Math.round(gs.correct / gs.total * 100) : 0;
    breakHtml += '<div class="level-stat">';
    breakHtml += '<div class="lvl-name">' + groupNames[groups[g]] + '</div>';
    breakHtml += '<div class="lvl-score">' + gs.correct + '/' + gs.total + '</div>';
    breakHtml += '<div class="lvl-pct">' + gpct + '%</div>';
    breakHtml += '<div class="simple-chart"><div class="simple-chart-fill" style="width:' + gpct + '%"></div></div>';
    breakHtml += '</div>';
  }
  document.getElementById('levelBreakdown').innerHTML = breakHtml;

  // Review dots
  var reviewHtml = '';
  for (var i = 0; i < questions.length; i++) {
    var cls = 'unanswered';
    if (answers[i] !== null) {
      cls = (answers[i] === questions[i].correct) ? 'correct' : 'wrong';
    }
    reviewHtml += '<div class="review-dot ' + cls + '" onclick="reviewQuestion(' + i + ')" title="' + questions[i].group + (questions[i].num) + '">' + (i+1) + '</div>';
  }
  document.getElementById('reviewGrid').innerHTML = reviewHtml;

  showScreen('result');
  saveAttempt(correct, pct, groupStats, timerSeconds);
  clearProgress();
  notifyParent(correct, pct);
}

function reviewQuestion(idx) {
  var q = questions[idx];
  var msg = '题目 ' + (idx + 1) + ' (组 ' + q.group + '-' + q.num + ')\n';
  msg += '你的答案: ' + (answers[idx] !== null ? (answers[idx] + 1) + '号选项' : '未作答') + '\n';
  msg += '正确答案: ' + (q.correct + 1) + '号选项\n';
  msg += '结果: ' + (answers[idx] === q.correct ? '✓ 正确' : '✗ 错误');
  alert(msg);
}

// ============== Progress Save/Load ==============
function saveProgress() {
  if (!studentId) return;
  try { 
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers: answers, currentQ: currentQ, timerSeconds: timerSeconds,
      submitted: testSubmitted, timestamp: Date.now()
    }));
  } catch(e) {}
}

function loadProgress() {
  if (!studentId) return null;
  try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}

function clearProgress() {
  if (!studentId) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

// ============== Attempt Tracking ==============
function getAttempts() {
  if (!studentId) return [];
  try { return JSON.parse(localStorage.getItem(ATTEMPT_KEY) || '[]'); } catch(e) { return []; }
}

function saveAttempt(score, pct, groupStats, timeSeconds) {
  if (!studentId) return;
  var attempts = getAttempts();
  attempts.push({ date: new Date().toISOString(), score: score, pct: pct, groupStats: groupStats, timeSeconds: timeSeconds });
  if (attempts.length > 2) attempts = attempts.slice(-2);
  try { localStorage.setItem(ATTEMPT_KEY, JSON.stringify(attempts)); } catch(e) {}
}

function getBestScore() {
  var attempts = getAttempts();
  if (attempts.length === 0) return 0;
  return Math.max.apply(null, attempts.map(function(a) { return a.score; }));
}

// ============== Review Dots ==============
function renderReviewDots() {
  var html = '';
  for (var i = 0; i < questions.length; i++) {
    var style = '';
    if (i === currentQ) style = 'background:rgba(255,215,0,0.3);border:1px solid #ffd700;';
    else if (answers[i] !== null) style = 'background:rgba(78,205,196,0.2);border:1px solid rgba(78,205,196,0.4);';
    else style = 'background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);';
    html += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px;cursor:pointer;' + style + '" onclick="currentQ=' + i + ';renderQuestion();saveProgress();" title="' + questions[i].group + questions[i].num + '"></span>';
  }
  document.getElementById('reviewDots').innerHTML = html;
}

function updateProgress() {
  var answered = answers.filter(function(a) { return a !== null; }).length;
  document.getElementById('progressBar').style.width = Math.round(answered / questions.length * 100) + '%';
}

// ============== Parent Communication ==============
function notifyParent(score, pct) {
  try {
    window.parent.postMessage({
      type: 'xuanba_result', studentId: studentId, score: score, pct: pct, timeSeconds: timerSeconds
    }, '*');
  } catch(e) {}
}

function closeTest() {
  try { window.parent.postMessage({ type: 'xuanba_close' }, '*'); } catch(e) {}
}

// ============== Standalone fallback ==============
window.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    if (typeof XUANBA_QUESTIONS !== 'undefined' && questions.length === 0) {
      questions = XUANBA_QUESTIONS;
      studentId = 'demo';
      STORAGE_KEY += studentId; ATTEMPT_KEY += studentId;
      showScreen('intro');
      document.getElementById('screenLoading').classList.remove('active');
    }
  }, 2000);
});
</script>
