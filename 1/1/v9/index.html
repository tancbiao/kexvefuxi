<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>科学复习 V9 · 暗黑装备 · 爬塔</title>
<style>
:root { --bg:#0a0a1a; --card:rgba(255,255,255,0.06); --gold:#ffd700; --green:#4ecdc4; --red:#ff6b6b; --text:rgba(255,255,255,0.9); --white:#ccc; --magic:#4d8fff; --rare:#ffd700; --legend:#ff8000; --set:#00ff88; --ancient:#ff4040; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,"Microsoft YaHei",sans-serif; min-height:100vh; padding-bottom:20px; }
.screen { display:none; padding:20px; max-width:500px; margin:0 auto; min-height:100vh; }
.screen.active { display:block; }

/* status bar */
.status-bar { display:flex; justify-content:space-around; padding:10px 6px; background:var(--card); border-radius:12px; margin-bottom:14px; font-size:0.85em; flex-wrap:wrap; gap:4px; }
.status-item { cursor:pointer; padding:4px 8px; border-radius:8px; transition:0.2s; white-space:nowrap; }
.status-item:active { background:rgba(255,255,255,0.1); }

/* buttons */
.btn { padding:12px 20px; border:none; border-radius:12px; font-size:1em; cursor:pointer; transition:0.2s; color:#fff; }
.btn:active { transform:scale(0.96); }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); }
.btn-gold { background:linear-gradient(135deg,#f9d423,#ff4e50); color:#1a1a2e; font-weight:700; }
.btn-small { padding:6px 14px; font-size:0.8em; border-radius:8px; }
.btn-danger { background:linear-gradient(135deg,#ff4040,#cc0000); }

/* login */
.login-card { background:var(--card); border-radius:16px; padding:30px 20px; text-align:center; margin-top:40px; }
.login-input { width:100%; padding:14px; border-radius:12px; border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#fff; font-size:1.1em; text-align:center; margin:16px 0; }
.login-input:focus { border-color:var(--gold); outline:none; }

/* course */
.course-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
.course-card { background:var(--card); border-radius:14px; padding:20px 12px; text-align:center; cursor:pointer; transition:0.2s; border:2px solid transparent; }
.course-card:active { border-color:var(--gold); transform:scale(0.97); }
.course-card .icon { font-size:2em; margin-bottom:8px; }
.course-card .grade { font-size:1.1em; font-weight:700; }
.sem-btn { background:rgba(255,255,255,0.08); border:none; color:var(--text); padding:6px 16px; border-radius:8px; cursor:pointer; font-size:0.85em; margin:4px; }
.sem-btn:active { background:var(--gold); color:#1a1a2e; }

/* lesson */
.lesson-grid { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
.lesson-card { background:var(--card); border-radius:12px; padding:14px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.lesson-card:active { background:rgba(255,255,255,0.12); }
.lesson-num { background:linear-gradient(135deg,#667eea,#764ba2); width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8em;flex-shrink:0; }
.lesson-name { font-weight:600; }
.lesson-meta { font-size:0.75em; color:rgba(255,255,255,0.4); }
.lesson-done { color:var(--green); }

/* quiz */
.question-card { background:var(--card); border-radius:16px; padding:22px 18px; margin:14px 0; }
.question-num { font-size:0.8em; color:rgba(255,255,255,0.35); margin-bottom:8px; }
.question-text { font-size:1.05em; line-height:1.7; margin-bottom:18px; }
.option { display:block; width:100%; padding:12px 16px; margin:6px 0; border-radius:10px; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03); color:var(--text); text-align:left; font-size:1em; cursor:pointer; transition:0.2s; }
.option:active { border-color:var(--gold); }
.option.correct { border-color:var(--green); background:rgba(78,205,196,0.15); }
.option.wrong { border-color:var(--red); background:rgba(255,107,107,0.15); }
.option.disabled { pointer-events:none; }
.feedback { text-align:center; padding:12px; min-height:40px; }
.feedback.correct { color:var(--green); }
.feedback.wrong { color:var(--red); }
.progress-bar { height:5px; background:rgba(255,255,255,0.08); border-radius:3px; margin:10px 0; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#667eea,#764ba2); border-radius:3px; transition:width 0.3s; }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.back { background:none; border:none; color:var(--gold); font-size:1.1em; cursor:pointer; padding:4px 10px; }

/* result */
.result-card { background:var(--card); border-radius:16px; padding:30px 20px; text-align:center; }
.result-score { font-size:3em; font-weight:900; color:var(--gold); }
.result-stats { display:flex; justify-content:center; gap:20px; margin:14px 0; font-size:0.9em; }

/* modal */
.modal-overlay { display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal-card { background:#1a1a2e; border-radius:16px; padding:20px; max-width:420px; width:92%; max-height:85vh; overflow-y:auto; }
.modal-close { float:right; background:none; border:none; color:var(--text); font-size:1.5em; cursor:pointer; }

/* === TOWER === */
.tower-floor { background:var(--card); border-radius:14px; padding:20px; text-align:center; margin:12px 0; }
.tower-hp-bar { height:16px; background:rgba(255,255,255,0.1); border-radius:8px; margin:10px 0; overflow:hidden; position:relative; }
.tower-hp-fill { height:100%; background:linear-gradient(90deg,var(--red),var(--gold)); border-radius:8px; transition:width 0.3s; }
.tower-hp-text { position:absolute; top:0; left:50%; transform:translateX(-50%); font-size:0.75em; line-height:16px; }
.tower-monster { font-size:3em; margin:10px 0; }
.tower-loot { background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.2); border-radius:10px; padding:12px; margin:10px 0; animation:fadeIn 0.5s; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* === EQUIPMENT === */
.equip-item { background:var(--card); border-radius:10px; padding:10px 14px; margin:6px 0; display:flex; align-items:center; gap:10px; cursor:pointer; border-left:4px solid transparent; transition:0.2s; }
.equip-item.common { border-left-color:var(--white); }
.equip-item.magic { border-left-color:var(--magic); }
.equip-item.rare { border-left-color:var(--rare); }
.equip-item.legendary { border-left-color:var(--legend); }
.equip-item.set { border-left-color:var(--set); }
.equip-item.ancient { border-left-color:var(--ancient); }
.equip-item.equipped { background:rgba(255,215,0,0.08); }
.equip-icon { width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5em;flex-shrink:0; background:rgba(255,255,255,0.05); }
.equip-info { flex:1; font-size:0.85em; }
.equip-name { font-weight:700; }
.equip-slot { font-size:0.75em; color:rgba(255,255,255,0.4); }
.equip-stats { font-size:0.75em; color:rgba(255,255,255,0.6); margin-top:2px; }
.equip-action { flex-shrink:0; }
.slot-tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.slot-tab { padding:6px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:none; color:var(--text); font-size:0.8em; cursor:pointer; }
.slot-tab.active { background:var(--gold); color:#1a1a2e; border-color:var(--gold); }

/* rairty colors */
.c-common { color:var(--white); }
.c-magic { color:var(--magic); }
.c-rare { color:var(--rare); }
.c-legendary { color:var(--legend); }
.c-set { color:var(--set); }
.c-ancient { color:var(--ancient); }

/* achievements */
.ach-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ach-card { background:var(--card); border-radius:10px; padding:10px; text-align:center; font-size:0.8em; }
.ach-card.locked { opacity:0.35; }
.ach-icon { font-size:1.6em; }

/* danmaku */
.danmaku { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:200; overflow:hidden; }
.danmaku-item { position:absolute; white-space:nowrap; padding:4px 14px; border-radius:20px; font-size:0.85em; animation:dm 8s linear; color:#fff; }
@keyframes dm { from { right:-200px; } to { right:calc(100% + 200px); } }

/* ranking */
.rank-table { width:100%; border-collapse:collapse; font-size:0.85em; }
.rank-table td,.rank-table th { padding:8px 6px; text-align:center; }
.rank-table th { color:rgba(255,255,255,0.35); font-weight:400; border-bottom:1px solid rgba(255,255,255,0.08); }
.rank-me { background:rgba(255,215,0,0.06); }

.notice-item { background:var(--card); border-radius:10px; padding:12px; margin:8px 0; font-size:0.9em; border-left:3px solid var(--gold); }
.top-actions { display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap; }
</style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar" style="display:none" id="statusBar">
  <div class="status-item" onclick="App.showScreen('courseScreen')">📚 课程</div>
  <div class="status-item" onclick="App.showTower()">🗼 爬塔</div>

</div>

<!-- Screens -->
<div id="screens">

<!-- start -->
<div class="screen active" id="startScreen">
  <div class="login-card">
    <div style="font-size:3em;">🔬</div>
    <h2>科学复习系统 V9</h2>
    <p style="color:rgba(255,255,255,0.4);">粤教粤科版 · 暗黑装备 · 爬塔挑战</p>
    <input class="login-input" id="idInput" type="text" maxlength="8" placeholder="输入8位学号">
    <button class="btn btn-gold" onclick="App.login()" style="width:100%;">🚀 开始挑战</button>

  </div>
</div>

</div>

<!-- level -->
<div class="screen" id="levelScreen">

  <div class="progress-bar"><div class="progress-fill" id="levelProgress" style="width:0"></div></div>
  <div class="lesson-grid" id="lessonGrid"></div>
</div>

<!-- quiz -->
<div class="screen" id="quizScreen">

    <button class="back" onclick="App.quitLesson()">←</button>
    <span style="color:rgba(255,255,255,0.4)" id="quizLessonName"></span>

  </div>
  <div class="progress-bar"><div class="progress-fill" id="quizProgress" style="width:0"></div></div>
  <div class="question-card"><div class="question-num" id="qNum"></div><div class="question-text" id="qText"></div><div id="qOptions"></div><div class="feedback" id="qFeedback"></div></div>

  <div class="tower-floor">

</div>

<!-- Backpack Modal -->
<div class="modal-overlay" id="bpModal">
  <div class="modal-card">
    <button class="modal-close" onclick="App.closeModal('bpModal')">✕</button>
    <h3>🎒 背包 <span style="font-size:0.7em;color:rgba(255,255,255,0.4)">(<span id="bpCount">0</span>/48)</span></h3>
    <div class="slot-tabs">
      <button class="slot-tab active" onclick="App.filterBp('all',this)">全部</button>
      <button class="slot-tab" onclick="App.filterBp('weapon',this)">武器</button>
      <button class="slot-tab" onclick="App.filterBp('helmet',this)">头盔</button>

</div></div>

<div class="modal-overlay" id="achievementModal"><div class="modal-card">

</div></div>

<div class="modal-overlay" id="noticesModal"><div class="modal-card">
  <button class="modal-close" onclick="App.closeModal('noticesModal')">✕</button>

  <div id="noticesList"></div>
</div></div>

<div class="danmaku" id="danmaku"></div>

<script>
// ═══════════ DIABLO EQUIPMENT SYSTEM ═══════════
const EQ = {
  rarities: ['common','magic','rare','legendary','set','ancient'],
  rName: { common:'普通', magic:'魔法', rare:'稀有', legendary:'传说', set:'套装', ancient:'远古' },
  rColor: { common:'#ccc', magic:'#4d8fff', rare:'#ffd700', legendary:'#ff8000', set:'#00ff88', ancient:'#ff4040' },
  rIcon: { common:'⬜', magic:'🔷', rare:'🟡', legendary:'🟠', set:'🟢', ancient:'🔴' },
  rWeight: [40,30,18,8,3,1], // drop weights
  
  slots: {
    weapon: { name:'武器', icon:'⚔️', atk:[2,15], def:[0,3] },
    helmet: { name:'头盔', icon:'⛑️', atk:[0,5], def:[2,10] },
    armor: { name:'铠甲', icon:'🛡️', atk:[0,3], def:[3,15] },
    gloves: { name:'手套', icon:'🧤', atk:[1,8], def:[1,5] },
    boots: { name:'靴子', icon:'👢', atk:[1,6], def:[1,5] },
    ring: { name:'戒指', icon:'💍', atk:[1,5], def:[0,3] },
    amulet: { name:'项链', icon:'📿', atk:[1,7], def:[0,3] }
  },
  
  prefixes: ['毁灭','风暴','暗影','圣光','龙鳞','寒冰','烈焰','雷霆','混沌','不朽','幽魂','先祖','深渊','黎明','终末'],
  weaponNames: ['长剑','战斧','法杖','匕首','巨锤','弯刀','长弓','魔杖','巨剑','拳刃'],
  helmNames: ['头冠','面甲','兜帽','战盔','王冠','眼罩','铁盔','骨盔'],
  armorNames: ['战甲','法袍','皮甲','板甲','锁甲','龙铠','暗影衣','圣衣'],
  glovesNames: ['护手','铁拳','法握','利爪','臂铠','灵巧手套'],
  bootsNames: ['战靴','铁鞋','皮靴','飞翼靴','行军靴','暗影步'],
  ringNames: ['指环','印记','封印','符文戒','骷髅戒','龙眼戒'],
  amuletNames: ['护符','吊坠','圣徽','龙牙','月石','血符'],
  
  pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; },
  
  rollRarity(floor) {
    const bonus = Math.min(floor, 50);
    const w = [...this.rWeight];
    for(let i=2;i<6;i++) w[i] += bonus * (i-1);
    const total = w.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<6;i++) { r-=w[i]; if(r<=0) return this.rarities[i]; }
    return 'common';
  },
  
  generate(floor) {
    const rarity = this.rollRarity(floor);
    const slots = Object.keys(this.slots);
    const slot = this.pick(slots);
    const s = this.slots[slot];
    const rarityIdx = this.rarities.indexOf(rarity);
    const power = 1 + rarityIdx * 0.4 + floor * 0.15;
    
    // Pick name
    let baseName = '';
    const nameMap = { weapon: 'weaponNames', helmet: 'helmNames', armor: 'armorNames', gloves: 'glovesNames', boots: 'bootsNames', ring: 'ringNames', amulet: 'amuletNames' };
    baseName = this.pick(this[nameMap[slot]] || this.weaponNames);
    
    // Add prefix for rarity >= rare
    const prefix = rarityIdx >= 2 ? this.pick(this.prefixes) + ' ' : '';
    const fullName = prefix + baseName;
    
    // Generate stats
    const atk = Math.floor((s.atk[0] + Math.random()*(s.atk[1]-s.atk[0])) * power);
    const def = Math.floor((s.def[0] + Math.random()*(s.def[1]-s.def[0])) * power);
    const crit = rarityIdx >= 3 ? Math.floor((1+Math.random()*8) * (1+rarityIdx*0.5)) : 0;
    const hp = Math.floor((5+Math.random()*30) * power);
    
    return {
      id: 'eq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name: fullName, slot, rarity,
      atk, def, crit, hp,
      floor,
      icon: s.icon
    };
  }
};

// ═══════════ APP ═══════════
const App = {
  studentId: null, studentName: '', isGuest: false,
  totalPoints: 0, currentCourse: null, currentLesson: null,
  questions: [], qIndex: 0, correctCount: 0, wrongCount: 0, currentStreak: 0, maxStreak: 0, answered: false,
  wrongQuestions: [], achievements: [], lessonProgress: {},
  questionBank: {},
  
  // Equipment
  equipment: [],
  equipped: {}, // { helmet: itemObj, armor: itemObj, ... }
  bpFilter: 'all',
  
  // Tower
  towerFloor: 1, towerMaxFloor: 1, towerHP: 100, towerMaxHP: 100, towerMonsterHP: 50, towerMonsterMaxHP: 50,
  towerInBattle: false, towerQuestion: null, towerQAnswered: false,
  
  init() {
    this.loadState();
    this.renderCourseGrid();
    this.updateStatusBar();
    const sid = localStorage.getItem('v9_rememberedId');
    document.getElementById('idInput').value = sid || '';
    document.getElementById('towerFloor').textContent = this.towerFloor;

  async loadStudentName() {
    if (this.isGuest || !this.studentId) return;
    try {
      const res = await fetch('https://api.kexvefuxi.cn/api/student/info/'+this.studentId);
      if (res.ok) { const d = await res.json(); if (d.name) { this.studentName=d.name; document.getElementById('stuName').textContent=d.name+' 同学'; } }

  renderCourseGrid() {
    const gs = [{g:'3',i:'🐟',n:'三年级'},{g:'4',i:'🦋',n:'四年级'},{g:'5',i:'🌿',n:'五年级'},{g:'6',i:'🏆',n:'六年级'}];
    document.getElementById('courseGrid').innerHTML = gs.map(g=>`<div class="course-card"><div class="icon">${g.i}</div><div class="grade">${g.n}</div>
      <div><button class="sem-btn" onclick="App.startCourse('${g.g}','1')">上册</button><button class="sem-btn" onclick="App.startCourse('${g.g}','2')">下册</button></div></div>`).join('');
  },
  
  startCourse(grade, sem) {
    this.currentCourse = {grade, sem};
    document.getElementById('levelTitle').textContent = grade+'年级'+(sem==='2'?'下册':'上册');
    this.showScreen('levelScreen'); this.loadQuestionBank(grade, sem);
  },
  
  loadQuestionBank(grade, sem) {
    document.getElementById('lessonGrid').innerHTML = '<div style="text-align:center;padding:40px;">📚 加载题库...</div>';
    const script = document.createElement('script');
    script.src = '../../../data/'+grade+'-'+sem+'-lessons.js?v=20260507';
    script.onload = () => {
      const key = 'QUESTION_BANK_'+grade+'_'+sem+'_LESSONS';
      if (window[key]) Object.assign(this.questionBank, window[key]);
      this.renderLessons();
    };
    script.onerror = () => { document.getElementById('lessonGrid').innerHTML = '<div style="text-align:center;padding:40px;color:#ff6b6b;">题库加载失败</div>'; };
    document.head.appendChild(script);
  },
  
  renderLessons() {
    const c = this.currentCourse;
    const units = Object.keys(this.questionBank).filter(k=>k.startsWith('unit')).sort();
    if (!units.length) { document.getElementById('lessonGrid').innerHTML='<div style="text-align:center;padding:40px;">暂无课程数据</div>'; return; }
    const pk = 'progress_'+c.grade+c.sem+'_'+(this.studentId||'');
    const saved = localStorage.getItem(pk);
    if (saved) { try { Object.assign(this.lessonProgress, JSON.parse(saved)); } catch(e) {} }
    let h='', tl=0, dl=0;
    for (const uk of units) {
      const u = this.questionBank[uk]; if (!u||!u.lessons) continue;
      h+='<div style="color:rgba(255,255,255,0.35);font-size:0.8em;padding:6px 2px 2px">'+(u.icon||'')+' '+u.name+'</div>';
      for (const l of u.lessons) { tl++;
        const p = this.lessonProgress[l.id]||{}; if (p.done) dl++;
        const qc = (l.basic||[]).length+(l.medium||[]).length+(l.hard||[]).length;
        h+='<div class="lesson-card" onclick="App.startLesson(\''+l.id+'\')"><div class="lesson-num">'+(l.id||'').replace(/[^0-9]/g,'').slice(-2)+'</div><div class="lesson-info"><div class="lesson-name">'+(l.name||'')+'</div><div class="lesson-meta">'+qc+' 题 '+(p.done?'<span class="lesson-done">✅</span>':'')+'</div></div></div>';
      }
    }
    document.getElementById('lessonGrid').innerHTML = h;
    document.getElementById('levelProgress').style.width = tl>0?(dl/tl*100)+'%':'0';
  },
  
  startLesson(lid) {
    this.currentLesson = lid; let lesson = null;
    for (const k of Object.keys(this.questionBank)) {
      const u = this.questionBank[k]; if (!u||!u.lessons) continue;
      for (const l of u.lessons) { if (l.id===lid) { lesson=l; break; } } if (lesson) break;
    }
    if (!lesson) { alert('课程未找到'); return; }
    this.questions = (lesson.basic||[]).concat(lesson.medium||[]).concat(lesson.hard||[]);
    this.qIndex=0; this.correctCount=0; this.wrongCount=0; this.currentStreak=0; this.maxStreak=0; this.answered=false;
    document.getElementById('quizLessonName').textContent = lesson.name||'';
    this.showScreen('quizScreen'); this.showQuestion();
  },
  
  showQuestion() {
    if (this.qIndex>=this.questions.length) { this.showResult(); return; }
    const q=this.questions[this.qIndex], t=this.questions.length;
    document.getElementById('qNum').textContent='第 '+(this.qIndex+1)+' 题';
    document.getElementById('qText').textContent=q.question||q.q||'';
    document.getElementById('quizQNum').textContent=(this.qIndex+1)+'/'+t;
    document.getElementById('quizProgress').style.width=(this.qIndex/t*100)+'%';
    document.getElementById('qFeedback').textContent=''; document.getElementById('qFeedback').className='feedback';
    document.getElementById('nextBtn').style.display='none'; this.answered=false;
    const opts=q.options||q.opts||[], labels=['A','B','C','D','E','F'];
    document.getElementById('qOptions').innerHTML=opts.map((o,i)=>`<button class="option" onclick="App.selectAnswer(${i})">${labels[i]}. ${typeof o==='string'?o:(o.text||o.label||'')}</button>`).join('');
  },
  
  selectAnswer(idx) {
    if (this.answered) return; this.answered=true;
    const q=this.questions[this.qIndex], ci=typeof q.answer==='number'?q.answer:(q.correct||0);
    const ok=idx===ci;
    const os=document.querySelectorAll('#qOptions .option');
    os.forEach(o=>o.classList.add('disabled'));
    os[idx].classList.add(ok?'correct':'wrong');
    if (!ok) os[ci].classList.add('correct');
    let points=0;
    if (ok) { this.correctCount++; this.currentStreak++; if(this.currentStreak>this.maxStreak)this.maxStreak=this.currentStreak;
      points=10+Math.min(this.currentStreak-1,10)*2;
      document.getElementById('qFeedback').innerHTML='✅ 正确！+'+points+' 分'+(this.currentStreak>1?' 🔥x'+this.currentStreak:'');
      document.getElementById('qFeedback').className='feedback correct';
      this.showDanmaku('correct','答对了！+'+points+'分');
    } else { this.wrongCount++; this.currentStreak=0;
      document.getElementById('qFeedback').innerHTML='❌ 错误！正确: '+['A','B','C','D','E','F'][ci];
      document.getElementById('qFeedback').className='feedback wrong';
      this.wrongQuestions.push({question:q.question||q.q||'',answer:ci,studentAnswer:idx,lessonName:this.currentLesson,timestamp:Date.now()});
    }
    this.totalPoints+=points; this.updateStatusBar(); this.saveState(); this.pushRanking();
    document.getElementById('nextBtn').style.display='block';
  },
  
  nextQuestion() { this.qIndex++; this.showQuestion(); },
  
  showResult() {
    this.showScreen('resultScreen');
    document.getElementById('resultScore').textContent='+'+this.correctCount*10+' 分';
    document.getElementById('resultCorrect').textContent=this.correctCount;
    document.getElementById('resultWrong').textContent=this.wrongCount;
    document.getElementById('resultStreak').textContent=this.maxStreak;
    // Equipment drop chance
    if (this.correctCount>=5) {
      const item=EQ.generate(1);
      this.equipment.push(item);
      this.saveState();
      const rc=EQ.rColor[item.rarity];
      document.getElementById('resultLoot').innerHTML='<div class="tower-loot"><b>🎁 装备掉落！</b><br><span style="color:'+rc+'">'+EQ.rIcon[item.rarity]+' '+item.name+'</span><br><span style="font-size:0.75em;color:rgba(255,255,255,0.5)">'+EQ.rName[item.rarity]+' '+item.icon+' 攻'+item.atk+' 防'+item.def+(item.crit?' 暴击+'+item.crit:'')+(item.hp?' HP+'+item.hp:'')+'</span></div>';
    }
    if (this.currentLesson&&this.currentCourse) {
      this.lessonProgress[this.currentLesson]={done:true,score:this.correctCount*10,correct:this.correctCount,wrong:this.wrongCount,maxStreak:this.maxStreak};
      const pk='progress_'+this.currentCourse.grade+this.currentCourse.sem+'_'+(this.studentId||'');
      localStorage.setItem(pk,JSON.stringify(this.lessonProgress));
    }
    this.checkAchievements(); this.saveState();
    if (this.correctCount>=this.questions.length*0.8) this.showDanmaku('achievement','🎉 优秀！正确率'+Math.round(this.correctCount/this.questions.length*100)+'%');
  },
  
  goBack() { this.showScreen('courseScreen'); },
  
  quitLesson() { if (this.answered&&this.qIndex<this.questions.length&&!confirm('确定退出？')) return; this.showScreen('levelScreen'); this.renderLessons(); },
  
  // ═══════════ TOWER ═══════════
  initTower() {
    document.getElementById('towerFloor').textContent=this.towerFloor;
    document.getElementById('towerHPFill').style.width=(this.towerHP/this.towerMaxHP*100)+'%';
    document.getElementById('towerHPText').textContent=this.towerHP+'/'+this.towerMaxHP;
    document.getElementById('towerStatus').textContent='准备挑战第 '+this.towerFloor+' 层...';
    document.getElementById('towerQuestion').style.display='none';
    document.getElementById('towerLoot').innerHTML='';
    document.getElementById('towerBtn').style.display='block';
    document.getElementById('towerBtn').textContent='⚔️ 挑战';
    this.towerInBattle=false; this.towerQAnswered=false;
    
    const monsters = ['👹','👾','🐉','🦇','💀','👻','🐺','🦂','🐍','🕷️','🧟','👿','🐲','🦅','🦈'];
    document.getElementById('towerMonster').textContent=monsters[Math.floor(Math.random()*monsters.length)];
    
    this.towerMonsterMaxHP=30+this.towerFloor*20;
    this.towerMonsterHP=this.towerMonsterMaxHP;
  },
  
  towerFight() {
    if (this.towerInBattle) return;
    this.towerInBattle=true;
    document.getElementById('towerBtn').style.display='none';
    document.getElementById('towerQuestion').style.display='block';
    document.getElementById('towerFeedback').textContent=''; document.getElementById('towerFeedback').className='feedback';
    this.towerQAnswered=false;
    // Pick random question from all question banks
    const allQ=[];
    for (const k of Object.keys(this.questionBank)) {
      const u=this.questionBank[k]; if (!u||!u.lessons) continue;
      for (const l of u.lessons) {
        for (const diff of ['basic','medium','hard']) {
          if (l[diff]) for (const q of l[diff]) allQ.push({...q,lessonName:l.name});
        }
      }
    }
    if (!allQ.length) { document.getElementById('towerStatus').textContent='请先加载题库（进入课程）'; this.towerInBattle=false; return; }
    this.towerQuestion=allQ[Math.floor(Math.random()*allQ.length)];
    document.getElementById('towerQText').textContent=this.towerQuestion.question||this.towerQuestion.q||'';
    const opts=this.towerQuestion.options||this.towerQuestion.opts||[];
    const labels=['A','B','C','D','E','F'];
    document.getElementById('towerQOptions').innerHTML=opts.map((o,i)=>`<button class="option" onclick="App.towerAnswer(${i})">${labels[i]}. ${typeof o==='string'?o:(o.text||o.label||'')}</button>`).join('');
  },
  
  towerAnswer(idx) {
    if (this.towerQAnswered) return; this.towerQAnswered=true;
    const q=this.towerQuestion, ci=typeof q.answer==='number'?q.answer:(q.correct||0);
    const ok=idx===ci;
    const os=document.querySelectorAll('#towerQOptions .option');
    os.forEach(o=>o.classList.add('disabled'));
    os[idx].classList.add(ok?'correct':'wrong');
    if (!ok) os[ci].classList.add('correct');
    
    // Calc damage
    let dmg=0;
    if (ok) {
      // Calculate player ATK from equipment
      let totalAtk=5;
      for (const slot of Object.keys(this.equipped)) {
        const item=this.equipped[slot]; if (item) totalAtk+=item.atk||0;
      }
      dmg=totalAtk+Math.floor(Math.random()*10);
      this.towerMonsterHP-=dmg;
      document.getElementById('towerFeedback').innerHTML='✅ 正确！造成 <b>'+dmg+'</b> 伤害';
      document.getElementById('towerFeedback').className='feedback correct';
    } else {
      this.towerHP-=10+Math.floor(Math.random()*15);
      document.getElementById('towerFeedback').innerHTML='❌ 错误！受到伤害';
      document.getElementById('towerFeedback').className='feedback wrong';
    }
    
    // Update HP bars
    document.getElementById('towerHPFill').style.width=(this.towerHP/this.towerMaxHP*100)+'%';
    document.getElementById('towerHPText').textContent=Math.max(0,this.towerHP)+'/'+this.towerMaxHP;
    
    // Check results
    setTimeout(()=>{
      if (this.towerMonsterHP<=0) {
        // Win!
        const loot=EQ.generate(this.towerFloor);
        this.equipment.push(loot);
        const rc=EQ.rColor[loot.rarity];
        document.getElementById('towerLoot').innerHTML='<div class="tower-loot"><b>🎉 胜利！</b><br><span style="color:'+rc+'">'+EQ.rIcon[loot.rarity]+' '+loot.name+'</span><br><span style="font-size:0.75em">'+EQ.rName[loot.rarity]+' '+loot.icon+' 攻'+loot.atk+' 防'+loot.def+(loot.crit?' 暴击+'+loot.crit:'')+'</span></div>';
        const pts=10+this.towerFloor*5;
        this.totalPoints+=pts;
        this.towerFloor++;
        if (this.towerFloor>this.towerMaxFloor) this.towerMaxFloor=this.towerFloor;
        document.getElementById('towerFloor').textContent=this.towerFloor;
        document.getElementById('towerStatus').textContent='击败了第 '+(this.towerFloor-1)+' 层守卫！+'+pts+' ⭐';
        this.showDanmaku('achievement','🗼 爬塔第'+(this.towerFloor-1)+'层通过！');
        this.updateStatusBar(); this.saveState(); this.pushRanking();
        if (this.towerFloor>=5&&!this.achievements.includes('tower5')) { this.achievements.push('tower5'); this.showDanmaku('achievement','🏆 解锁：爬塔5层！'); }
        if (this.towerFloor>=10&&!this.achievements.includes('tower10')) { this.achievements.push('tower10'); this.showDanmaku('achievement','🏆 解锁：爬塔10层！'); }
      } else if (this.towerHP<=0) {
        document.getElementById('towerStatus').textContent='💀 你倒下了... 重新挑战';
        this.towerHP=this.towerMaxHP;
        document.getElementById('towerHPFill').style.width='100%';
        document.getElementById('towerHPText').textContent=this.towerHP+'/'+this.towerMaxHP;
      }
      document.getElementById('towerQuestion').style.display='none';
      document.getElementById('towerBtn').style.display='block';
      document.getElementById('towerBtn').textContent='⚔️ 继续挑战';
      this.towerInBattle=false;
      this.saveState();
    },1500);
  },
  
  showTower() { this.showScreen('towerScreen'); this.initTower(); },
  
  // ═══════════ BACKPACK ═══════════
  showBackpack() {
    document.getElementById('bpModal').classList.add('show');
    this.renderBackpack();
  },
  
  renderBackpack() {
    const list=[];
    for (const item of this.equipment) {
      if (this.bpFilter!=='all'&&item.slot!==this.bpFilter) continue;
      const isEq=this.equipped[item.slot]===item;
      const rc=EQ.rColor[item.rarity];
      list.push('<div class="equip-item '+item.rarity+(isEq?' equipped':'')+'">'+
        '<div class="equip-icon">'+item.icon+'</div>'+
        '<div class="equip-info">'+
          '<div class="equip-name" style="color:'+rc+'">'+EQ.rIcon[item.rarity]+' '+item.name+'</div>'+
          '<div class="equip-slot">'+EQ.slots[item.slot].name+' · '+EQ.rName[item.rarity]+(item.floor?' · 第'+item.floor+'层':'')+'</div>'+
          '<div class="equip-stats">⚔攻'+item.atk+' 🛡防'+item.def+(item.crit?' 💥暴击+'+item.crit:'')+(item.hp?' ❤HP+'+item.hp:'')+'</div>'+
        '</div>'+
        '<div class="equip-action">'+
          (isEq?'<button class="btn btn-small btn-danger" onclick="App.unequipItem(\''+item.id+'\')">卸下</button>':'<button class="btn btn-small btn-gold" onclick="App.equipItem(\''+item.id+'\')">装备</button>')+
        '</div></div>');
    }
    document.getElementById('bpList').innerHTML=list.length?list.join(''):'<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.3)">背包空空如也<br>去爬塔或答题获取装备吧！</div>';
    document.getElementById('bpCount').textContent=this.equipment.length;
  },
  
  equipItem(id) {
    const item=this.equipment.find(e=>e.id===id);
    if (!item) return;
    const existing=this.equipped[item.slot];
    this.equipped[item.slot]=item;
    // Unequip any existing in same slot
    if (existing&&existing!==item) {
      // Already handled by setting equipped[slot] = item
    }
    this.renderBackpack(); this.saveState();
    this.showDanmaku('correct','装备了 '+item.name);
  },
  
  unequipItem(id) {
    const item=this.equipment.find(e=>e.id===id);

  checkAchievements() {
    const u=[];
    if (this.correctCount>0&&!this.achievements.includes('first_answer')) u.push('first_answer');
    if (this.correctCount===this.questions.length&&!this.achievements.includes('perfect')) u.push('perfect');
    if (this.maxStreak>=3&&!this.achievements.includes('streak3')) u.push('streak3');
    if (this.maxStreak>=5&&!this.achievements.includes('streak5')) u.push('streak5');
    if (this.totalPoints>=100&&!this.achievements.includes('score100')) u.push('score100');
    if (this.totalPoints>=500&&!this.achievements.includes('score500')) u.push('score500');
    if (this.equipment.length>=5&&!this.achievements.includes('equip5')) u.push('equip5');
    if (this.equipment.some(e=>e.rarity==='legendary')&&!this.achievements.includes('equipLegend')) u.push('equipLegend');

        try {
          const d=JSON.parse(localStorage.getItem(k));
          rows.push({id:k.replace('v9_user_',''),pts:d.totalPoints||0,tower:d.towerMaxFloor||1});
        } catch(e) {}
      }
    }
    rows.sort((a,b)=>b.pts-a.pts);
    const me=this.studentId;
    document.getElementById('rankBody').innerHTML=rows.map((r,i)=>{
      const ri=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      return '<tr class="'+(r.id===me?'rank-me':'')+'"><td>'+ri+'</td><td>'+r.id+'</td><td>⭐'+r.pts+'</td><td>🗼'+r.tower+'层</td></tr>';
    }).join('')||'<tr><td colspan="4">暂无数据</td></tr>';
  },
  
  showDanmaku(type, msg) {
    const c=document.getElementById('danmaku'), el=document.createElement('div');
    el.className='danmaku-item'; el.style.top=(10+Math.random()*70)+'%';
    el.style.background=type==='achievement'?'rgba(255,215,0,0.85)':'rgba(78,205,196,0.8)';
    el.style.color=type==='achievement'?'#1a1a2e':'#fff'; el.textContent=msg;
    c.appendChild(el); setTimeout(()=>el.remove(),9000);
  },
  
  updateStatusBar() {
    document.getElementById('statPoints').innerHTML='⭐ '+this.totalPoints;
    document.getElementById('statAch').textContent=this.achievements.length;
  },
  
  saveState() {
    if (this.isGuest) return;
    localStorage.setItem('v9_user_'+this.studentId, JSON.stringify({
      totalPoints:this.totalPoints, wrongQuestions:this.wrongQuestions,
      achievements:this.achievements, lessonProgress:this.lessonProgress,
      equipment:this.equipment, equipped:this.equipped,
      towerFloor:this.towerFloor, towerMaxFloor:this.towerMaxFloor,
      towerHP:this.towerHP, lastUpdated:Date.now()
    }));
  },
  
  loadState() {
    if (this.isGuest||!this.studentId) return;
    const s=localStorage.getItem('v9_user_'+this.studentId);
    if (s) try {
      const d=JSON.parse(s);
      this.totalPoints=d.totalPoints||0; this.wrongQuestions=d.wrongQuestions||[];
      this.achievements=d.achievements||[]; this.lessonProgress=d.lessonProgress||{};
      this.equipment=d.equipment||[]; this.equipped=d.equipped||{};
      this.towerFloor=d.towerFloor||1; this.towerMaxFloor=d.towerMaxFloor||1;
      this.towerHP=d.towerHP||100; this.towerMaxHP=100;
    } catch(e) {}
    this.updateStatusBar();
  },
  
  async pushRanking() {
    if (this.isGuest||!this.studentId) return;
    try {
      await fetch('https://api.kexvefuxi.cn/api/students/batch',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({students:[{studentId:this.studentId,name:this.studentName||this.studentId,totalPoints:this.totalPoints,wrongQuestions:this.wrongQuestions.map(w=>w.question).filter(Boolean)}]})
      });
    } catch(e) {}
  },
  
  closeModal(id) { document.getElementById(id).classList.remove('show'); }
};

// Load remembered ID
const savedId = localStorage.getItem('v9_rememberedId');
if (savedId) document.getElementById('idInput').value = savedId;
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
