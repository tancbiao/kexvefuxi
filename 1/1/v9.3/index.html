<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>科学复习 V9.3 · 暗黑装备 · 爬塔 · 云端通知</title>
<style>
:root { --bg:#0a0a1a; --card:rgba(255,255,255,0.06); --gold:#ffd700; --green:#4ecdc4; --red:#ff6b6b; --text:rgba(255,255,255,0.9); --white:#aaa; --uncommon:#4ecdc4; --rare:#4d8fff; --epic:#c77dff; --legend:#ff8000; --mythic:#ff4040; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,"Microsoft YaHei",sans-serif; min-height:100vh; padding-bottom:20px; }
.screen { display:none; padding:20px; max-width:500px; margin:0 auto; min-height:100vh; }
.screen.active { display:block; }

/* status bar */
.status-bar { display:flex; justify-content:space-around; padding:10px 6px; background:var(--card); border-radius:12px; margin-bottom:14px; font-size:0.85em; flex-wrap:wrap; gap:4px; }
.status-item { cursor:pointer; padding:4px 8px; border-radius:8px; transition:0.2s; white-space:nowrap; }
.status-item:active { background:rgba(255,255,255,0.1); }

/* buttons */
.btn { padding:12px 20px; border:none; border-radius:12px; font-size:1em; cursor:pointer; transition:0.2s; color:#fff; }
.btn:active { transform:scale(0.96); }
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); }
.btn-gold { background:linear-gradient(135deg,#f9d423,#ff4e50); color:#1a1a2e; font-weight:700; }
.btn-small { padding:6px 14px; font-size:0.8em; border-radius:8px; }
.btn-danger { background:linear-gradient(135deg,#ff4040,#cc0000); }

/* login */
.login-card { background:var(--card); border-radius:16px; padding:30px 20px; text-align:center; margin-top:40px; }
.login-input { width:100%; padding:14px; border-radius:12px; border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#fff; font-size:1.1em; text-align:center; margin:16px 0; }
.login-input:focus { border-color:var(--gold); outline:none; }

/* course */
.course-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
.course-card { background:var(--card); border-radius:14px; padding:20px 12px; text-align:center; cursor:pointer; transition:0.2s; border:2px solid transparent; }
.course-card:active { border-color:var(--gold); transform:scale(0.97); }
.course-card .icon { font-size:2em; margin-bottom:8px; }
.course-card .grade { font-size:1.1em; font-weight:700; }
.sem-btn { background:rgba(255,255,255,0.08); border:none; color:var(--text); padding:6px 16px; border-radius:8px; cursor:pointer; font-size:0.85em; margin:4px; }
.sem-btn:active { background:var(--gold); color:#1a1a2e; }

/* lesson */
.lesson-grid { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
.lesson-card { background:var(--card); border-radius:12px; padding:14px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.lesson-card:active { background:rgba(255,255,255,0.12); }
.lesson-num { background:linear-gradient(135deg,#667eea,#764ba2); width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8em;flex-shrink:0; }
.lesson-name { font-weight:600; }
.lesson-meta { font-size:0.75em; color:rgba(255,255,255,0.4); }
.lesson-done { color:var(--green); }

/* quiz */
.question-card { background:var(--card); border-radius:16px; padding:22px 18px; margin:14px 0; }
.question-num { font-size:0.8em; color:rgba(255,255,255,0.35); margin-bottom:8px; }
.question-text { font-size:1.05em; line-height:1.7; margin-bottom:18px; }
.option { display:block; width:100%; padding:12px 16px; margin:6px 0; border-radius:10px; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03); color:var(--text); text-align:left; font-size:1em; cursor:pointer; transition:0.2s; }
.option:active { border-color:var(--gold); }
.option.correct { border-color:var(--green); background:rgba(78,205,196,0.15); }
.option.wrong { border-color:var(--red); background:rgba(255,107,107,0.15); }
.option.disabled { pointer-events:none; }
.feedback { text-align:center; padding:12px; min-height:40px; }
.feedback.correct { color:var(--green); }
.feedback.wrong { color:var(--red); }
.progress-bar { height:5px; background:rgba(255,255,255,0.08); border-radius:3px; margin:10px 0; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#667eea,#764ba2); border-radius:3px; transition:width 0.3s; }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.back { background:none; border:none; color:var(--gold); font-size:1.1em; cursor:pointer; padding:4px 10px; }

/* result */
.result-card { background:var(--card); border-radius:16px; padding:30px 20px; text-align:center; }
.result-score { font-size:3em; font-weight:900; color:var(--gold); }
.result-stats { display:flex; justify-content:center; gap:20px; margin:14px 0; font-size:0.9em; }

/* modal */
.modal-overlay { display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal-card { background:#1a1a2e; border-radius:16px; padding:20px; max-width:420px; width:92%; max-height:85vh; overflow-y:auto; }
.modal-close { float:right; background:none; border:none; color:var(--text); font-size:1.5em; cursor:pointer; }

/* === TOWER === */
.tower-floor { background:var(--card); border-radius:14px; padding:20px; text-align:center; margin:12px 0; }
.tower-hp-bar { height:16px; background:rgba(255,255,255,0.1); border-radius:8px; margin:10px 0; overflow:hidden; position:relative; }
.tower-hp-fill { height:100%; background:linear-gradient(90deg,var(--red),var(--gold)); border-radius:8px; transition:width 0.3s; }
.tower-hp-text { position:absolute; top:0; left:50%; transform:translateX(-50%); font-size:0.75em; line-height:16px; }
.tower-monster { font-size:3em; margin:10px 0; }
.tower-loot { background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.2); border-radius:10px; padding:12px; margin:10px 0; animation:fadeIn 0.5s; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* === EQUIPMENT === */
.equip-item { background:var(--card); border-radius:10px; padding:10px 14px; margin:6px 0; display:flex; align-items:center; gap:10px; cursor:pointer; border-left:4px solid transparent; transition:0.2s; }
.equip-item.white { border-left-color:#aaa; }
.equip-item.green { border-left-color:#4ecdc4; }
.equip-item.blue { border-left-color:#4d8fff; }
.equip-item.purple { border-left-color:#c77dff; }
.equip-item.gold { border-left-color:#ff8000; }
.equip-item.red { border-left-color:#ff4040; }
.equip-item.set { border-left-color:#00ff88; box-shadow:0 0 8px rgba(0,255,136,0.15); }
.equip-item.equipped { background:rgba(255,215,0,0.08); }
.equip-icon { width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5em;flex-shrink:0; background:rgba(255,255,255,0.05); }
.equip-info { flex:1; font-size:0.85em; }
.equip-name { font-weight:700; }
.equip-slot { font-size:0.75em; color:rgba(255,255,255,0.4); }
.equip-stats { font-size:0.75em; color:rgba(255,255,255,0.6); margin-top:2px; }
.equip-action { flex-shrink:0; }
.slot-tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.slot-tab { padding:6px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:none; color:var(--text); font-size:0.8em; cursor:pointer; }
.slot-tab.active { background:var(--gold); color:#1a1a2e; border-color:var(--gold); }

/* rairty colors */
.c-white { color:#aaa; }
.c-green { color:#4ecdc4; }
.c-blue { color:#4d8fff; }
.c-purple { color:#c77dff; }
.c-gold { color:#ff8000; }
.c-red { color:#ff4040; }

/* achievements */
.ach-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ach-card { background:var(--card); border-radius:10px; padding:10px; text-align:center; font-size:0.8em; }
.ach-card.locked { opacity:0.35; }
.ach-icon { font-size:1.6em; }

/* danmaku */
.danmaku { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:200; overflow:hidden; }
.danmaku-item { position:absolute; white-space:nowrap; padding:4px 14px; border-radius:20px; font-size:0.85em; animation:dm 8s linear; color:#fff; }
@keyframes dm { from { right:-200px; } to { right:calc(100% + 200px); } }

/* ranking */
.rank-table { width:100%; border-collapse:collapse; font-size:0.85em; }
.rank-table td,.rank-table th { padding:8px 6px; text-align:center; }
.rank-table th { color:rgba(255,255,255,0.35); font-weight:400; border-bottom:1px solid rgba(255,255,255,0.08); }
.rank-me { background:rgba(255,215,0,0.06); }

.notice-item { background:var(--card); border-radius:10px; padding:12px; margin:8px 0; font-size:0.9em; border-left:3px solid var(--gold); }
/* Tower Modal */
.tower-modal { display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; }
.tower-modal.show { display:flex; }
.tower-modal-content { background:#1a1a2e; border-radius:16px; max-width:440px; width:94%; max-height:90vh; display:flex; flex-direction:column; border:1px solid rgba(255,215,0,0.2); }
.tower-modal-header { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,0.08); }
.tower-modal-title { font-size:1.15em; font-weight:700; }
.tower-modal-close { background:none; border:none; color:var(--text); font-size:1.4em; cursor:pointer; padding:4px 10px; }
.tower-modal-content iframe { width:100%; height:75vh; border:none; border-radius:0 0 16px 16px; }
/* Notice Overlay */
.notice-overlay { position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75); z-index:5000; display:none; justify-content:center; align-items:center; }
.notice-card { background:linear-gradient(135deg,#1a1a2e,#16213e); border:1px solid rgba(255,215,0,0.25); border-radius:18px; padding:24px; max-width:400px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.notice-title { font-size:1.2em; font-weight:700; margin-bottom:14px; color:var(--gold); }
.notice-body { color:rgba(255,255,255,0.8); line-height:1.7; font-size:0.95em; }
.notice-body a { color:#667eea; }

.top-actions { display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap; }
</style>
</head>

<!-- Status Bar -->
<div class="status-bar" style="display:none" id="statusBar">

<!-- start -->

<script>
// ═══════════ DIABLO EQUIPMENT SYSTEM ═══════════
const EQ = {
  rarities: ['common','magic','rare','legendary','set','ancient'],
  rName: { common:'普通', magic:'魔法', rare:'稀有', legendary:'传说', set:'套装', ancient:'远古' },
  rColor: { common:'#ccc', magic:'#4d8fff', rare:'#ffd700', legendary:'#ff8000', set:'#00ff88', ancient:'#ff4040' },
  rIcon: { common:'⬜', magic:'🔷', rare:'🟡', legendary:'🟠', set:'🟢', ancient:'🔴' },
  rWeight: [40,30,18,8,3,1], // drop weights
  
  slots: {
    weapon: { name:'武器', icon:'⚔️', atk:[2,15], def:[0,3], critRate:[0,5], critDmg:[0,10] },
    helmet: { name:'头盔', icon:'⛑️', atk:[0,5], def:[2,10], critRate:[0,3], critDmg:[0,5] },
    armor: { name:'铠甲', icon:'🛡️', atk:[0,3], def:[3,15], critRate:[0,2], critDmg:[0,5] },
    gloves: { name:'手套', icon:'🧤', atk:[1,8], def:[1,5], critRate:[0,4], critDmg:[0,8] },
    boots: { name:'靴子', icon:'👢', atk:[1,6], def:[1,5], critRate:[0,2], critDmg:[0,5] },
    ring: { name:'戒指', icon:'💍', atk:[1,5], def:[0,3], critRate:[0,3], critDmg:[0,8] },
    amulet: { name:'项链', icon:'📿', atk:[1,7], def:[0,3], critRate:[0,3], critDmg:[0,6] }
  },
  // Rarity-based stat multipliers for crit rate / crit dmg / drop rate
  // critRate: base from slot + rarity bonus  |  critDmg: 100% + bonus  |  dropRate: extra equipment drop chance
  rarityBonus: {
    common:    { critRate:2,  critDmg:0,   dropRate:0 },
    magic:     { critRate:5,  critDmg:15,  dropRate:1 },

    set:       { critRate:25, critDmg:75,  dropRate:4 },
    ancient:   { critRate:30, critDmg:100, dropRate:5 }
  },
  
  prefixes: ['毁灭','风暴','暗影','圣光','龙鳞','寒冰','烈焰','雷霆','混沌','不朽','幽魂','先祖','深渊','黎明','终末'],
  weaponNames: ['长剑','战斧','法杖','匕首','巨锤','弯刀','长弓','魔杖','巨剑','拳刃'],
  helmNames: ['头冠','面甲','兜帽','战盔','王冠','眼罩','铁盔','骨盔'],
  armorNames: ['战甲','法袍','皮甲','板甲','锁甲','龙铠','暗影衣','圣衣'],
  glovesNames: ['护手','铁拳','法握','利爪','臂铠','灵巧手套'],
  bootsNames: ['战靴','铁鞋','皮靴','飞翼靴','行军靴','暗影步'],
  ringNames: ['指环','印记','封印','符文戒','骷髅戒','龙眼戒'],
  amuletNames: ['护符','吊坠','圣徽','龙牙','月石','血符'],
  
  pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; },
  
  rollRarity(floor) {
    const bonus = Math.min(floor, 50);
    const w = [...this.rWeight];
    for(let i=2;i<6;i++) w[i] += bonus * (i-1);
    const total = w.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<6;i++) { r-=w[i]; if(r<=0) return this.rarities[i]; }
    return 'common';
  },
  
  generate(floor) {
    const rarity = this.rollRarity(floor);
    const slots = Object.keys(this.slots);
    const slot = this.pick(slots);
    const s = this.slots[slot];
    const rarityIdx = this.rarities.indexOf(rarity);
    const power = 1 + rarityIdx * 0.4 + floor * 0.15;
    
    // Pick name
    let baseName = '';
    const nameMap = { weapon: 'weaponNames', helmet: 'helmNames', armor: 'armorNames', gloves: 'glovesNames', boots: 'bootsNames', ring: 'ringNames', amulet: 'amuletNames' };
    baseName = this.pick(this[nameMap[slot]] || this.weaponNames);
    
    // Add prefix for rarity >= rare
    const prefix = rarityIdx >= 2 ? this.pick(this.prefixes) + ' ' : '';
    const fullName = prefix + baseName;
    
    // Generate stats
    const atk = Math.floor((s.atk[0] + Math.random()*(s.atk[1]-s.atk[0])) * power);
    const def = Math.floor((s.def[0] + Math.random()*(s.def[1]-s.def[0])) * power);
    const crit = rarityIdx >= 3 ? Math.floor((1+Math.random()*8) * (1+rarityIdx*0.5)) : 0;
    const hp = Math.floor((5+Math.random()*30) * power);
    
    return {
      id: 'eq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name: fullName, slot, rarity,
      atk, def, crit, hp,
      floor,
      icon: s.icon
    };
  }
};

    this.towerInBattle=false; this.towerQAnswered=false;
    
    const monsters = ['👹','👾','🐉','🦇','💀','👻','🐺','🦂','🐍','🕷️','🧟','👿','🐲','🦅','🦈'];
    document.getElementById('towerMonster').textContent=monsters[Math.floor(Math.random()*monsters.length)];
    
    this.towerMonsterMaxHP=30+this.towerFloor*20;

  towerFight() {
    if (this.towerInBattle) return;
    this.towerInBattle=true;
    document.getElementById('towerBtn').style.display='none';
    document.getElementById('towerQuestion').style.display='block';
    document.getElementById('towerFeedback').textContent=''; document.getElementById('towerFeedback').className='feedback';
    this.towerQAnswered=false;
    // Pick random question from all question banks
    const allQ=[];
    for (const k of Object.keys(this.questionBank)) {
      const u=this.questionBank[k]; if (!u||!u.lessons) continue;
      for (const l of u.lessons) {
        for (const diff of ['basic','medium','hard']) {
          if (l[diff]) for (const q of l[diff]) allQ.push({...q,lessonName:l.name});
        }
      }
    }
    if (!allQ.length) { document.getElementById('towerStatus').textContent='请先加载题库（进入课程）'; this.towerInBattle=false; return; }
    this.towerQuestion=allQ[Math.floor(Math.random()*allQ.length)];
    document.getElementById('towerQText').textContent=this.towerQuestion.question||this.towerQuestion.q||'';
    const opts=this.towerQuestion.options||this.towerQuestion.opts||[];
    const labels=['A','B','C','D','E','F'];
    document.getElementById('towerQOptions').innerHTML=opts.map((o,i)=>`<button class="option" onclick="App.towerAnswer(${i})">${labels[i]}. ${typeof o==='string'?o:(o.text||o.label||'')}</button>`).join('');
  },
  
  towerAnswer(idx) {
    if (this.towerQAnswered) return; this.towerQAnswered=true;
    const q=this.towerQuestion, ci=typeof q.answer==='number'?q.answer:(q.correct||0);
    const ok=idx===ci;
    const os=document.querySelectorAll('#towerQOptions .option');
    os.forEach(o=>o.classList.add('disabled'));
    os[idx].classList.add(ok?'correct':'wrong');
    if (!ok) os[ci].classList.add('correct');
    
    // Calc damage
    let dmg=0;
    if (ok) {
      // Calculate player ATK from equipment
      let totalAtk=5, totalCrit=0, totalCritDmg=0;
      for (const slot of Object.keys(this.equipped)) {
        const item=this.equipped[slot];
        if (item) { totalAtk+=item.atk||0; totalCrit+=(item.critRate||0); totalCritDmg+=(item.critDmg||0); }
      }
      dmg=totalAtk+Math.floor(Math.random()*10);
      // Crit check
      if (Math.random()*100 < totalCrit) {
        dmg = Math.floor(dmg * (1 + totalCritDmg/100));
        document.getElementById('towerFeedback').innerHTML += ' <span style="color:var(--gold)">💥暴击!</span>';
      }
      this.towerMonsterHP-=dmg;
      document.getElementById('towerFeedback').innerHTML='✅ 正确！造成 <b>'+dmg+'</b> 伤害';
      document.getElementById('towerFeedback').className='feedback correct';
    } else {
      this.towerHP-=10+Math.floor(Math.random()*15);
      document.getElementById('towerFeedback').innerHTML='❌ 错误！受到伤害';
      document.getElementById('towerFeedback').className='feedback wrong';
    }
    
    // Update HP bars
    document.getElementById('towerHPFill').style.width=(this.towerHP/this.towerMaxHP*100)+'%';
    document.getElementById('towerHPText').textContent=Math.max(0,this.towerHP)+'/'+this.towerMaxHP;
    
    // Check results
    setTimeout(()=>{
      if (this.towerMonsterHP<=0) {
        // Win!
        const loot=EQ.generate(this.towerFloor);
        this.equipment.push(loot);
        const rc=EQ.rColor[loot.rarity];
        document.getElementById('towerLoot').innerHTML='<div class="tower-loot"><b>🎉 胜利！</b><br><span style="color:'+rc+'">'+EQ.rIcon[loot.rarity]+' '+loot.name+'</span><br><span style="font-size:0.75em">'+EQ.rName[loot.rarity]+' '+loot.icon+(loot.isSet?' 💠套装:'+(loot.setName||''):'')+' 攻'+loot.atk+' 防'+loot.def+(loot.critRate?' 💥暴击+'+loot.critRate+'%':'')+(loot.critDmg?' 💢爆伤+'+loot.critDmg+'%':'')+(loot.dropRate?' 🍀掉率+'+loot.dropRate+'%':'')+'</span></div>';
        const pts=10+this.towerFloor*5;
        this.totalPoints+=pts;
        this.towerFloor++;
        if (this.towerFloor>this.towerMaxFloor) this.towerMaxFloor=this.towerFloor;
        document.getElementById('towerFloor').textContent=this.towerFloor;
        document.getElementById('towerStatus').textContent='击败了第 '+(this.towerFloor-1)+' 层守卫！+'+pts+' ⭐';
        this.showDanmaku('achievement','🗼 爬塔第'+(this.towerFloor-1)+'层通过！');
        this.updateStatusBar(); this.saveState(); this.pushRanking(); this.saveToCloud();
        if (this.towerFloor>=5&&!this.achievements.includes('tower5')) { this.achievements.push('tower5'); this.showDanmaku('achievement','🏆 解锁：爬塔5层！'); }
        if (this.towerFloor>=10&&!this.achievements.includes('tower10')) { this.achievements.push('tower10'); this.showDanmaku('achievement','🏆 解锁：爬塔10层！'); }
      } else if (this.towerHP<=0) {
        document.getElementById('towerStatus').textContent='💀 你倒下了... 重新挑战';
        this.towerHP=this.towerMaxHP;
        document.getElementById('towerHPFill').style.width='100%';
        document.getElementById('towerHPText').textContent=this.towerHP+'/'+this.towerMaxHP;
      }
      document.getElementById('towerQuestion').style.display='none';
      document.getElementById('towerBtn').style.display='block';
      document.getElementById('towerBtn').textContent='⚔️ 继续挑战';
      this.towerInBattle=false;
      this.saveState();
    },1500);

  // V5 data migration
  migrateFromV5() {
    if (this.isGuest||!this.studentId) return false;
    // Check if already migrated
    if (localStorage.getItem('v9_migrated_' + this.studentId)) return false;
    // Check for V5 data
    const v5keys = ['3','4','5','6'], migrated = false;
    let v5Points = 0, v5Ach = [];
    for (const g of v5keys) {
      const key = 'scienceGame' + g + '_user_' + this.studentId;
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const d = JSON.parse(raw);
          v5Points += d.totalPoints || 0;
          if (d.unlockedAchievements) v5Ach = [...new Set([...v5Ach, ...d.unlockedAchievements])];
        }
      } catch(e) {}
    }
    // Also check V5 unified key
    try {
      const v5uni = localStorage.getItem('scienceGame_user_' + this.studentId);
      if (v5uni) {
        const d = JSON.parse(v5uni);
        if (d.totalPoints > v5Points) v5Points = d.totalPoints;
        if (d.wrongQuestions && d.wrongQuestions.length > 0) {
          for (const wq of d.wrongQuestions) {
            if (wq && !this.wrongQuestions.find(x=>x.question===wq.question)) {
              this.wrongQuestions.push(wq);
            }
          }
        }
        if (d.unlockedAchievements) v5Ach = [...new Set([...v5Ach, ...d.unlockedAchievements])];
      }
    } catch(e) {}
    
    if (v5Points > 0) {
      this.totalPoints = Math.max(this.totalPoints, v5Points);
      this.achievements = [...new Set([...this.achievements, ...v5Ach])];
      localStorage.setItem('v9_migrated_' + this.studentId, '1');
      this.showDanmaku('achievement', '🔄 V5数据已迁移！积分：' + v5Points);
      return true;
    }
    return false;
  },

  // Get bonuses from active pet
  getPetBonus() {
    if (this.activePet === null || this.activePet >= this.pets.length) return {atk:0, def:0};
    const p = this.pets[this.activePet];
    return {atk: p.atk || 0, def: p.def || 0};
  },
  
  // ═══════════ Pet System ═══════════
  petFilter: 'all',
  showPet() { document.getElementById('petModal').classList.add('show'); document.getElementById('petFoodCount').textContent=this.petFood; this.renderPets(); },
  
  renderPets() {
    const el = document.getElementById('petCollection'), f = this.petFilter;
    let html = '';
    // Show owned pets
    if (f === 'pieces') {
      // Show piece collection
      const pieces = Object.entries(this.petPieces).filter(([,n])=>n>0);
      if (pieces.length===0) { html='<div style="text-align:center;padding:16px;color:rgba(255,255,255,0.3);">没有碎片<br>去抽卡获得吧！</div>'; }
      else {
        for (const [pid,count] of pieces) {
          const def = PET.pets.find(p=>p.id===pid) || {};
          const needed = PET.piecesNeeded(def.rarity||'white'), rc = EQ.rColor[def.rarity||'white'];
          html += '<div class="equip-item"><div class="equip-icon">'+(def.icon||'🧩')+'</div>'+
            '<div class="equip-info"><div class="equip-name" style="color:'+rc+'">'+(def.name||pid)+' 碎片</div>'+
            '<div class="equip-stats">🧩 '+count+'/'+needed+'</div></div>'+
            (count>=needed?'<button class="btn btn-small btn-gold" onclick="App.summonPet(\''+pid+'\')">召唤!</button>':'')+'</div>';
        }
      }
    } else {
      // Show owned pets filtered by rarity
      if (this.pets.length===0) {
        html='<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.3);">还没有宠物<br>点击抽卡获取你的伙伴！</div>';
      } else {
        for (let i=0;i<this.pets.length;i++) {
          const p=this.pets[i]; if (f!=='all'&&p.rarity!==f) continue;
          const active=this.activePet===i, rc=EQ.rColor[p.rarity];
          html+='<div class="equip-item '+p.rarity+(active?' equipped':'')+'">'+
            '<div class="equip-icon">'+p.icon+'</div>'+
            '<div class="equip-info"><div class="equip-name" style="color:'+rc+'">'+PET.rIcon[p.rarity]+' '+p.name+'</div>'+
            '<div class="equip-slot">'+PET.rName[p.rarity]+' · '+(p.desc||'')+'</div>'+
            '<div class="equip-stats">⚔攻+'+p.atk+' 🛡防+'+p.def+'</div></div>'+
            '<div class="equip-action">'+(active?'<button class="btn btn-small btn-danger" onclick="App.deactivatePet()">放回</button>':'<button class="btn btn-small btn-gold" onclick="App.activatePet('+i+')">出战</button>')+'</div></div>';
        }
      }
    }
    if (!html) html='<div style="text-align:center;padding:16px;color:rgba(255,255,255,0.3);">该筛选下没有宠物</div>';
    el.innerHTML=html;
  },
  
  filterPet(filter, el) {
    this.petFilter=filter;
    document.querySelectorAll('#petModal .slot-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    this.renderPets();
  },
  
  petGacha() {
    if (this.totalPoints<100) { alert('需要100积分！当前：'+this.totalPoints); return; }
    this.totalPoints-=100; this.updateStatusBar();
    const result = PET.gachaRoll();
    const resEl = document.getElementById('petGachaResult');
    if (result.type==='nothing') {
      resEl.innerHTML='<div class="tower-loot" style="text-align:center;">😢 谢谢惠顾！再试一次吧</div>';
    } else if (result.type==='food') {
      this.petFood+=result.amount;
      document.getElementById('petFoodCount').textContent=this.petFood;
      resEl.innerHTML='<div class="tower-loot">🍖 获得 '+result.amount+' 份宠物粮食！(共'+this.petFood+')</div>';
    } else {
      this.petPieces[result.petId]=(this.petPieces[result.petId]||0)+1;
      const rc=EQ.rColor[result.rarity], needed=PET.piecesNeeded(result.rarity);
      resEl.innerHTML='<div class="tower-loot"><b>🧩 获得碎片！</b><br><span style="color:'+rc+'">'+PET.rIcon[result.rarity]+' '+result.petName+'</span><br>进度: '+(this.petPieces[result.petId])+'/'+needed+'</div>';
      // Auto-summon if enough
      if (this.petPieces[result.petId]>=needed) { setTimeout(()=>this.summonPet(result.petId),500); }
    }
    this.saveState(); this.renderPets(); this.saveToCloud();
  },
  
  summonPet(petId) {
    const def = PET.pets.find(p=>p.id===petId);
    if (!def) return;
    const needed = PET.piecesNeeded(def.rarity);
    if ((this.petPieces[petId]||0)<needed) return;
    this.petPieces[petId]-=needed;
    this.pets.push({...def,summonedAt:Date.now()});
    const rc=EQ.rColor[def.rarity];
    document.getElementById('petGachaResult').innerHTML='<div class="tower-loot"><b>🎉 成功召唤！</b><br><span style="color:'+rc+'">'+PET.rIcon[def.rarity]+' '+def.name+'</span></div>';
    this.showDanmaku('achievement','🐾 召唤了 '+def.name+'!');
    this.saveState(); this.renderPets();
  },
  
  activatePet(i) { this.activePet=i; this.renderPets(); this.saveState(); },
  deactivatePet() { this.activePet=null; this.renderPets(); this.saveState(); },
  
  getPetBonus() {
    if (this.activePet===null||this.activePet>=this.pets.length) return {atk:0,def:0};
    const p=this.pets[this.activePet]; return {atk:p.atk||0,def:p.def||0};
  },

  async fetchNoticesOnStart() {
    try {
      const res = await fetch(API_BASE + '/notifications/check');
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.hasNew) {
        // Highlight the notices button
        this.showDanmaku('achievement', '📢 有新通知！点击查看');
      }
    } catch(e) {}
  },
  closeModal(id) { document.getElementById(id).classList.remove('show'); }
};

// Load remembered ID
const savedId = localStorage.getItem('v9_rememberedId');
if (savedId) document.getElementById('idInput').value = savedId;
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
