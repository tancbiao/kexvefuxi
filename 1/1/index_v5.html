async function submitQuestionStat(questionId, isCorrect) {
  if (!questionId || gameState.isGuest || !gameState.studentId) return;
  try {
    const res = await fetch('https://api.kexvefuxi.cn/api/question/stats', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({questionId: questionId, studentId: gameState.studentId, correct: isCorrect})
    });
    if (res.ok) {
      const d = await res.json();
      const el = document.getElementById('questionStats');
      if (el && d.total > 0) {
        el.innerHTML = '<span style="color:#ff6b6b;">👾 被该题击败 ' + (d.wrong || 0) + ' 次</span> | <span style="color:#4ecdc4;">🔥 已击败它 ' + (d.myCorrect || 0) + ' 次</span>';
      }
    }
  } catch(e) {}
}

// 打乱选择题选项
function shuffleQuestionOptions(q) {
  // 题目必须有选项
  const opts = q.options || q.opts;
  if (!opts || opts.length < 2) return q;
  
  // 特殊题直接返回
  if (q.type === 'tf') return q;
  
  const correctIdx = q.answer;
  if (correctIdx === undefined || correctIdx === null) return q;
  const correctText = opts[correctIdx];
  if (!correctText) return q;
  
  // 如果D选项是"以上都"类，固定D位，只打乱A、B、C
  const hasAllOfAbove = (opts[3] && (
    opts[3].includes('以上都') || 
    opts[3].includes('以上各') ||
    opts[3].includes('都不是') ||
    opts[3].includes('都对') ||
    opts[3].includes('都不对')
  ));
  
  let newOpts, newAnswer;
  
  if (hasAllOfAbove) {
    // D位固定，A/B/C随机打乱
    const abc = [opts[0], opts[1], opts[2]];
    const correctInABC = correctIdx < 3;
    const correctOriginalIdx = correctIdx; // 0,1,2
    
    // 打乱ABC
    for (let i = abc.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [abc[i], abc[j]] = [abc[j], abc[i]];
    }
    
    // ABC中正确答案的新位置
    const newCorrectInABC = abc.indexOf(correctText);
    newAnswer = correctInABC ? newCorrectInABC : correctIdx; // ABC中则用新位置，否则保持D位
    newOpts = [...abc, opts[3]]; // ABC在前，D在后
  } else {
    // 普通题：全部打乱
    const indexed = opts.map((text, i) => ({ text, i }));
    for (let i = indexed.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
    }
    newOpts = indexed.map(x => x.text);
    newAnswer = indexed.findIndex(x => x.text === correctText);
  }
  
  // 保存原始数据用于答案比对
  return { 
    ...q, 
    options: newOpts, // 使用 options 字段
    answer: newAnswer, 
    _origAnswer: correctIdx, 
    _origOpts: opts 
  };
}

function startLesson(lesson) {
  gameState.currentLesson = lesson;
  gameState.currentQuestion = 0;
  gameState.correctCount = 0;
  gameState.currentStreak = 0;
  gameState.maxStreak = 0;
  gameState.answered = [];
  gameState.hintsRemaining = 3;
  // 成就提示加成
  const achBonuses = calcAchievementBonuses();
  gameState.hintsRemaining += (achBonuses.totalHintExtra || 0);
  gameState.lessonStartTime = Date.now();
  gameState.hintUsedCount = 0;
  gameState.firstHalfWrong = 0;
  gameState.prevWrongId = null;
  gameState.consecutivePerfectLessons = (gameState.consecutivePerfectLessons || 0);
  // 检查是否重新刷题（已获得过星星）
  const lessonId = lesson.id;
  gameState.isReplay = (gameState.lessonProgress && gameState.lessonProgress[lessonId] && gameState.lessonProgress[lessonId] >= 1);
  
  // ====== 从自定义题库（uploadedQuestions）和内置题库中混编，每课随机10-15题 ======
  const uploaded = getUploadedQuestions(lessonId);
  
  let basicPool = [...lesson.basic];
  let mediumPool = [...lesson.medium];
  let hardPool = [...lesson.hard];
  
  // 如果有自定义题库，覆盖内置题库
  if (uploaded && uploaded.basic && uploaded.basic.length > 0) basicPool = uploaded.basic;
  if (uploaded && uploaded.medium && uploaded.medium.length > 0) mediumPool = uploaded.medium;
  if (uploaded && uploaded.hard && uploaded.hard.length > 0) hardPool = uploaded.hard;
  
  // 随机抽取函数
  function pickRandom(arr, min, max) {
    if (!arr || arr.length === 0) return [];
    const count = Math.min(arr.length, min + Math.floor(Math.random() * (max - min + 1)));
    const shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, count);
  }
  
  const totalTarget = 10 + Math.floor(Math.random() * 6); // 10-15
  const basicCount = Math.min(basicPool.length, Math.max(1, Math.round(totalTarget * 0.5)));
  const mediumCount = Math.min(mediumPool.length, Math.max(1, Math.round(totalTarget * 0.3)));
  const hardCount = Math.min(hardPool.length, Math.max(0, totalTarget - basicCount - mediumCount));
  
  const pickedBasic = pickRandom(basicPool, basicCount, basicCount);
  const pickedMedium = pickRandom(mediumPool, mediumCount, mediumCount);
  const pickedHard = pickRandom(hardPool, hardCount, hardCount);
  
  let allQuestions = [
    ...pickedBasic.map(q => shuffleQuestionOptions({...q, difficulty: 'basic', difficultyName: '基础题'})),
    ...pickedMedium.map(q => shuffleQuestionOptions({...q, difficulty: 'medium', difficultyName: '提升题'})),
    ...pickedHard.map(q => shuffleQuestionOptions({...q, difficulty: 'hard', difficultyName: '挑战题'}))
  ];
  
  for (let i = allQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
  }
  gameState.currentQuestions = allQuestions;

  // ====== 防沉迷：进入课程时立即扣1点体力 ======
  checkAndResetStamina();
  if (gameState.dailyStamina > 0) {
    gameState.dailyStamina = Math.max(0, gameState.dailyStamina - 1);
    updateStaminaDisplay();
    saveUserData();
  }
  // 体力为0时仍可进入课程，但答题不得分（checkAnswer中处理）

  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = gameState.currentQuestions[gameState.currentQuestion];
  const total = gameState.currentQuestions.length;

  gameState.questionStartTime = Date.now();
  
  document.getElementById('quizProgress').textContent = `${gameState.currentQuestion + 1}/${total}`;
  document.getElementById('questionText').textContent = q.q;
  
  const typeEl = document.getElementById('questionType');
  typeEl.textContent = q.difficultyName;
  typeEl.className = `question-type ${q.difficultyName === '基础题' ? 'type-choice' : q.difficultyName === '提升题' ? 'type-choice' : 'type-judge'}`;
  
  const optionsContainer = document.getElementById('optionsContainer');
  optionsContainer.innerHTML = '';
  
  const alreadyAnswered = gameState.answered.includes(gameState.currentQuestion);
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectOption(idx);
    // 恢复已答题目的样式，防止返回上一题重选
    if (alreadyAnswered) {
      btn.classList.add('disabled');
      if (idx === q.answer) btn.classList.add('correct');
      if (q._userAnswer !== undefined && idx === q._userAnswer && q._userAnswer !== q.answer) {
        btn.classList.add('wrong');
      }
    }
    optionsContainer.appendChild(btn);
  });
  
  const hintBtn = document.getElementById('hintBtn');
  document.getElementById('hintBtn').innerHTML = `<img src="../../icons/lightbulb.png" class="icon-24"> 提示 (${gameState.hintsRemaining})`;
  hintBtn.disabled = gameState.hintsRemaining <= 0;
  document.getElementById('hintBox').classList.remove('show');
  document.getElementById('hintBox').textContent = q.hint || '暂无提示';
  
  document.getElementById('prevBtn').style.visibility = gameState.currentQuestion > 0 ? 'visible' : 'hidden';
  document.getElementById('nextBtn').textContent = gameState.currentQuestion >= total - 1 ? '查看结果' : '下一题 →';
}

function selectOption(idx) {
  const q = gameState.currentQuestions[gameState.currentQuestion];
  const options = document.querySelectorAll('.option');
  // 已答过则忽略，防止返回上一题重选时叠加连击和正确数
  if (options[idx].classList.contains('disabled')) return;
  if (gameState.answered.includes(gameState.currentQuestion)) return;

  // 首次答题时才标记已答
  const firstTime = !gameState.answered.includes(gameState.currentQuestion);
  if (firstTime) {
    gameState.answered.push(gameState.currentQuestion);
    // 记录首次答题是否正确（用于保护streak）
    q._firstAnswerCorrect = (idx === q.answer);
  }
  
  // 如果不是首次答题（返回上题重答），直接返回不计算
  if (!firstTime) {
    q._userAnswer = idx;
    options[idx].classList.add('disabled');
    options[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
    if (idx !== q.answer) options[q.answer].classList.add('correct');
    return;
  }

  // 记录用户选择
  q._userAnswer = idx;

  options.forEach(opt => opt.classList.add('disabled'));

  const isCorrect = idx === q.answer;submitQuestionStat((q.id || q.q || ""), isCorrect);
  
  options[idx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) options[q.answer].classList.add('correct');

  const total = gameState.currentQuestions.length;
  const half = Math.floor(total / 2);

  if (isCorrect) {
    gameState.currentStreak++;
    gameState.correctCount++;
    if (gameState.currentStreak > gameState.maxStreak) gameState.maxStreak = gameState.currentStreak;

    // 累计答题数（非重刷）
    if (!gameState.isReplay && !gameState.isWrongQuestionPractice) {
      gameState.totalQuestionsAnswered = (gameState.totalQuestionsAnswered || 0) + 1;
      gameState.totalCorrectAnswers = (gameState.totalCorrectAnswers || 0) + 1;
      checkTotalQuestionsAchievements();
    }

    // 错题重做成功
    if (gameState.isWrongQuestionPractice) {
      gameState.retrySuccessCount = (gameState.retrySuccessCount || 0) + 1;
      if (!gameState.unlockedAchievements.includes('perfect_retry')) unlockAchievement('perfect_retry');
      if (gameState.retrySuccessCount >= 3 && !gameState.unlockedAchievements.includes('retry_3')) unlockAchievement('retry_3');
    }

    // ====== 防沉迷：体力耗尽则不得积分 ======
    if (gameState.dailyStamina <= 0) {
      gameState.currentStreak = 0;
      recordWrongQuestion(q, '');
      showFeedbackNoPoints(q);
      document.getElementById('nextBtn').classList.add('show');
      saveUserData();
      return;
    }

    // 闪电侠：3秒内答对
    if (gameState.questionStartTime && (Date.now() - gameState.questionStartTime) < 3000
        && !gameState.unlockedAchievements.includes('fast_correct')) {
      unlockAchievement('fast_correct');
    }

    let points = 10;
    if (q.difficulty === 'medium') points = 15;
    if (q.difficulty === 'hard') points = 20;
    points = Math.floor(points * (1 + gameState.currentStreak * 0.1));
    // 重新刷题只给50%积分
    if (gameState.isReplay) points = Math.floor(points * 0.1);
    // 成就积分加成
    const achBonus = calcAchievementBonuses();
    if (achBonus.totalPointsMul > 1) points = Math.floor(points * achBonus.totalPointsMul);
    
    // ========== 宠物加成 ==========
    const petBonus = calcPetBattleBonus();
    if (petBonus.totalPets > 0 && petBonus.pointsMul > 1) {
      points = Math.floor(points * petBonus.pointsMul);
    }
    
    gameState.totalPoints += points;
    checkAchievements();
  } else {
    gameState.currentStreak = 0;
    // 累计答题数（错题也计入总数）
    if (!gameState.isReplay && !gameState.isWrongQuestionPractice) {
      gameState.totalQuestionsAnswered = (gameState.totalQuestionsAnswered || 0) + 1;
    }
    // 开门黑：第一题就答错
    if (gameState.currentQuestion === 0 && !gameState.unlockedAchievements.includes('wrong_start')) {
      unlockAchievement('wrong_start');
    }
    // 逆风翻盘追踪：前半错题计数
    if (gameState.currentQuestion < half) gameState.firstHalfWrong = (gameState.firstHalfWrong || 0) + 1;
    // 同一个坑追踪
    const qId = q.q.substring(0, 20);
    if (gameState.prevWrongId === qId && !gameState.unlockedAchievements.includes('wrong_again')) {
      unlockAchievement('wrong_again');
    }
    gameState.prevWrongId = qId;
    // 记录错题（用原始答案文本）
    const origAnswerIdx = q._origAnswer !== undefined ? q._origAnswer : q.answer;
    const correctAnswerText = q._origOpts ? q._origOpts[origAnswerIdx] : (q.opts ? q.opts[origAnswerIdx] : '正确答案');
    recordWrongQuestion(q, correctAnswerText);
  }
  
  updateStatusBar();
  
  setTimeout(() => {
    if (gameState.currentQuestion < gameState.currentQuestions.length - 1) {
      gameState.currentQuestion++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 1500);
}

function showHint() {
  if (gameState.hintsRemaining <= 0) return;
  gameState.hintsRemaining--;
  gameState.hintUsedCount = (gameState.hintUsedCount || 0) + 1;
  // 求知若渴：第一次使用提示
  if (gameState.hintUsedCount === 1 && !gameState.unlockedAchievements.includes('first_hint')) {
    unlockAchievement('first_hint');
  }
  // 提示依赖：一课用3次以上提示
  if (gameState.hintUsedCount >= 3 && !gameState.unlockedAchievements.includes('hint_user')) {
    unlockAchievement('hint_user');
  }
  const hintBox = document.getElementById('hintBox');
  hintBox.classList.add('show');
  document.getElementById('hintBtn').textContent = `<img src="../../icons/lightbulb.png" class="icon-24"> 提示 (${gameState.hintsRemaining})`;
  document.getElementById('hintBtn').disabled = gameState.hintsRemaining <= 0;
}

function finishQuiz() {
  const total = gameState.currentQuestions.length;
  const accuracy = Math.round((gameState.correctCount / total) * 100);
  
  const lessonId = gameState.currentLesson.id;
  if (accuracy >= 60 && (!gameState.lessonProgress[lessonId] || gameState.lessonProgress[lessonId] < 3)) {
    gameState.lessonProgress[lessonId] = Math.min(3, (gameState.lessonProgress[lessonId] || 0) + 1);
  }
  
  // ====== 课时完成：体力扣减已在进入课程时处理，此处无需再扣 ======
  // （原体力扣减逻辑已移至 startLesson，避免刷分漏洞）
  
  checkUnitAchievements();

  // 趣味成就检查
  const isPerfect = accuracy === 100;
  const elapsed = gameState.lessonStartTime ? (Date.now() - gameState.lessonStartTime) / 1000 : 999;
  const hadProgress = gameState.lessonProgress && gameState.lessonProgress[lessonId];

  // 满分答卷：一次通关获得满分
  if (isPerfect && !gameState.unlockedAchievements.includes('perfect')) {
    unlockAchievement('perfect');
  }

  // 天才少年：首次做某课时就满分通关
  if (isPerfect && !hadProgress && !gameState.unlockedAchievements.includes('genius')) {
    unlockAchievement('genius');
  }

  // 极速通关：30秒内满分
  if (isPerfect && elapsed <= 30 && !gameState.unlockedAchievements.includes('quick_perfect')) {
    unlockAchievement('quick_perfect');
  }

  // 逆风翻盘：前半错3题以上但最终满分
  if (isPerfect && (gameState.firstHalfWrong || 0) >= 3 && !gameState.unlockedAchievements.includes('comeback')) {
    unlockAchievement('comeback');
  }

  // 冷面杀手：连续3课零失误
  if (isPerfect) {
    gameState.consecutivePerfectLessons = (gameState.consecutivePerfectLessons || 0) + 1;
    if (gameState.consecutivePerfectLessons >= 3 && !gameState.unlockedAchievements.includes('perfect_3')) unlockAchievement('perfect_3');
    if (gameState.consecutivePerfectLessons >= 3 && !gameState.unlockedAchievements.includes('no_wrong_3')) {
      unlockAchievement('no_wrong_3');
    }
    if (gameState.consecutivePerfectLessons >= 5 && !gameState.unlockedAchievements.includes('no_wrong_5')) {
      unlockAchievement('no_wrong_5');
    }
  } else {
    gameState.consecutivePerfectLessons = 0;
  }

    // 每题答题5%概率获得装备（吃水杯加成）
  const cupBonus2 = (gameState.equipment && (gameState.equipment.filter(Boolean)).some(e => e.id === 'cup_tanTeacherCup')) ? 0.05 : 0;
  const perQChance = 0.05 + cupBonus2;
  if (Math.random() < perQChance) {
    let targetLevel;
    const r = Math.random() * 100;
    if (cupBonus2 > 0) {
      if (r < 38)      targetLevel = 'common';
      else if (r < 71) targetLevel = 'exquisite';
      else if (r < 91) targetLevel = 'good';
      else if (r < 98) targetLevel = 'rare';
      else             targetLevel = 'epic';
    } else {
      if (r < 50)      targetLevel = 'common';
      else if (r < 80) targetLevel = 'exquisite';
      else if (r < 93) targetLevel = 'good';
      else             targetLevel = 'rare';
    }
    dropEquip(targetLevel);
  }

  // 课时完成掉落：每次完成100%掉落，史诗+概率减半（重复刷）
  const difficulty = gameState.currentDifficulty || 'basic';
  const dropKey = `${lessonId}_${difficulty}_dropped`;
  if (!gameState.equipDropped) gameState.equipDropped = {};
  const isFirstDrop = !gameState.equipDropped[dropKey];
  gameState.equipDropped[dropKey] = true;
  tryDropEquip(false, isFirstDrop ? 1 : 0.5);
  checkEquipAchievements();

  saveUserData();
  
  document.getElementById('resultIcon').textContent = accuracy >= 80 ? '🎉' : accuracy >= 60 ? '👍' : '💪';
  document.getElementById('resultTitle').textContent = accuracy >= 80 ? '太棒了！' : accuracy >= 60 ? '不错哦！' : '继续加油！';
  document.getElementById('resultScore').textContent = `${gameState.correctCount}/${total}`;
  document.getElementById('correctCount').textContent = gameState.correctCount;
  document.getElementById('accuracy').textContent = accuracy + '%';
  document.getElementById('maxStreakResult').textContent = gameState.maxStreak;
  
  showScreen('resultScreen');
}

// 装备掉落函数
// streakRatio = maxStreak / totalQuestions（0~1），连击率越高品质越好
// 全对（ratio=1）必爆蓝以上：蓝90% 紫9% 粉0.9% 金0.09% 橙0.01%
function tryDropEquip(isUnitComplete, penalty) {
  penalty = penalty || 1;
  const totalQ = gameState.currentQuestions ? gameState.currentQuestions.length : 10;
  const streak = gameState.maxStreak || 0;
  const ratio = totalQ > 0 ? streak / totalQ : 0; // 0~1

  let targetLevel;

  if (ratio >= 1) {
    // 全对：必爆蓝以上
    // 蓝65% 紫30% 粉4.9% 金0.09% 橙0.01%（每项均高于80~99%档）
    const r = Math.random() * 100;
    if (r < 65)         targetLevel = 'good';
    else if (r < 95)    targetLevel = 'rare';
    else if (r < 99.9)  targetLevel = 'epic';
    else if (r < 99.99) targetLevel = 'legendary';
    else                targetLevel = 'mythic';

  } else if (ratio >= 0.8) {
    // 80%~99% 连击率：白0% 绿20% 蓝50% 紫25.9% 粉4.1%（无金橙）
    const r = Math.random() * 100;
    if (r < 20)      targetLevel = 'exquisite';
    else if (r < 70) targetLevel = 'good';
    else if (r < 95.9) targetLevel = 'rare';
    else             targetLevel = 'epic';

  } else if (ratio >= 0.5) {
    // 50%~79%：正常偏好，蓝色有机会
    // 白15% 绿40% 蓝30% 紫12% 粉3%
    const r = Math.random() * 100;
    if (r < 15)      targetLevel = 'common';
    else if (r < 55) targetLevel = 'exquisite';
    else if (r < 85) targetLevel = 'good';
    else if (r < 97) targetLevel = 'rare';
    else             targetLevel = 'epic';

  } else {
    // 低连击（<50%）：基础概率，白绿为主
    // 白50% 绿35% 蓝12% 紫3%
    const r = Math.random() * 100;
    if (r < 50)      targetLevel = 'common';
    else if (r < 85) targetLevel = 'exquisite';
    else if (r < 97) targetLevel = 'good';
    else             targetLevel = 'rare';
  }

  dropEquip(targetLevel);
}

function dropEquip(levelKey) {
  const typeInfo = ALL_EQUIP_TYPES[Math.floor(Math.random() * ALL_EQUIP_TYPES.length)];
  const rarityNum = LEVEL_TO_RARITY[levelKey] || (typeof levelKey === 'number' ? levelKey : 1);
  const equip = generateEquip(rarityNum, typeInfo.id);

  if (!gameState.equipment) gameState.equipment = new Array(100).fill(null);
  const items = gameState.equipment.filter(Boolean);
  const exists = items.find(e => e.id === equip.id);
  if (!exists) {
    const emptySlot = gameState.equipment.indexOf(null);
    if (emptySlot !== -1) gameState.equipment[emptySlot] = equip;
    showEquipDrop(equip);
  } else {
    gameState.equipDupeCount = (gameState.equipDupeCount || 0) + 1;
    if (!gameState.unlockedAchievements.includes('equip_dupe')) unlockAchievement('equip_dupe');
  }
}


function showEquipDrop(equip) {
  const RARITY_COLORS = ['#9e9e9e','#4caf50','#2196f3','#9c27b0','#e91e63','#ffd700','#ff5722'];
  const rarity = equip.rarity || 1;
  const color = RARITY_COLORS[rarity - 1] || '#9e9e9e';
  const html = typeof genEquipDropHTML === 'function' ? genEquipDropHTML(equip) : `<div class="equip-drop-title">🎁 获得新装备！</div><div class="equip-drop-icon">${equip.icon}</div><div class="equip-drop-name" style="color:${color}">${equip.name}</div><div class="equip-drop-effect">${equip.effect || ''}</div>`;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999;animation:fadeIn 0.3s;';
  overlay.innerHTML = `<div style="background:linear-gradient(135deg,#2a2a4a,#1a1a2e);border-radius:20px;padding:30px 40px;text-align:center;border:3px solid ${color};box-shadow:0 0 30px ${color}55;animation:bounceIn 0.5s;max-width:340px;width:90%;">${html}</div>`;
  document.body.appendChild(overlay);

    const s = document.createElement('style');

    document.head.appendChild(s);
  }
  overlay.addEventListener('click', () => overlay.remove());
  setTimeout(() => overlay.remove(), 5000);
}

function checkEquipAchievements() {
  initInventory62();
  const counts = [0,0,0,0,0,0,0]; // rarity 1-7
  const typeIds = {};
  const typeCount = {};
  const items = (gameState.equipment || []).filter(Boolean);
  items.forEach(e => {
    const r = e.rarity || 1;
    counts[r - 1]++;
    const type = (e.id || '').split('_')[0];
    typeIds[type] = true;
    typeCount[type] = (typeCount[type] || 0) + 1;
  });

  // 初识装备
  if (items.length >= 1 && !gameState.unlockedAchievements.includes('first_equip')) unlockAchievement('first_equip');
  // 收藏家
  if (items.length >= 10 && !gameState.unlockedAchievements.includes('equip_10')) unlockAchievement('equip_10');
  // 蓝天白云：2件普通(1) + 2件良好(3)
  if (counts[0] >= 2 && counts[2] >= 2 && !gameState.unlockedAchievements.includes('equip_blue_white')) unlockAchievement('equip_blue_white');
  // 我的刀盾
  if (typeIds.sword && typeIds.shield && !gameState.unlockedAchievements.includes('equip_sword_shield')) unlockAchievement('equip_sword_shield');
  // 穿搭达人
  if (typeIds.shirt && typeIds.skirt && !gameState.unlockedAchievements.includes('all_shirt_set')) unlockAchievement('all_shirt_set');
  // 法师猎人
  if (typeIds.bow && typeIds.staff && !gameState.unlockedAchievements.includes('equip_bow_staff')) unlockAchievement('equip_bow_staff');
  // 装备专家：同一类型3件
  if (!gameState.unlockedAchievements.includes('equip_3_same_type')) {
    for (const type in typeCount) { if (typeCount[type] >= 3) { unlockAchievement('equip_3_same_type'); break; } }
  }
  // 史诗降临 (rarity 5)
  if (counts[4] > 0 && !gameState.unlockedAchievements.includes('equip_epic')) unlockAchievement('equip_epic');
  // 传说降临 (rarity 6)
  if (counts[5] > 0 && !gameState.unlockedAchievements.includes('equip_legendary')) unlockAchievement('equip_legendary')
    if (!gameState.isGuest) {
      postNotification('equipment-legendary', '\U0001F31F <strong>' + (gameState.studentId || '\u67d0\u540c\u5b66') + '</strong> \u559c\u63d0\u4f20\u8bf4\u88c5\u5907\uff01');
    };
  // 彩虹收集
  if (counts.every(c => c > 0) && !gameState.unlockedAchievements.includes('equip_rainbow')) unlockAchievement('equip_rainbow');
  // 欧皇 (rarity 7)
  if (counts[6] > 0 && !gameState.unlockedAchievements.includes('equip_mythic')) unlockAchievement('equip_mythic')
    if (!gameState.isGuest) {
      postNotification('equipment-mythic', '\U0001F451 <strong>' + (gameState.studentId || '\u67d0\u540c\u5b66') + '</strong> \u8fd0\u6c14\u7206\u68da\uff01\u593a\u5f97\u795e\u8bdd\u88c5\u5907\uff01\u2605\u2605\u2605');
    };

  // 谭老师的愤怒水杯：>=10件装备仍未获得金色传说
  const hasTanCup = items.some(e => e.id === 'cup_tanTeacherCup');
  if (items.length >= 10 && counts[5] === 0 && !hasTanCup) {
    const cup = {
      id: 'cup_tanTeacherCup',
      name: '谭老师的愤怒水杯',
      icon: '<img src="../../icons/pants.png" class="icon-32">',
      rarity: 6,
      effect: '金色传说获得概率+1%，史诗获得概率+5%',
      pointBonus: 0,
      color: '#ffd700',
      desc: '保持安静',
      slot: 'cup',
      type: 'cup',
      level: 'legendary',
      levelName: '金色传说的'
    };
    const emptySlot = gameState.equipment.indexOf(null);
    if (emptySlot !== -1) gameState.equipment[emptySlot] = cup;
    unlockAchievement('equip_tan_cup');
    showEquipDrop(cup);
  }
}

}

function recordWrongQuestion(q, correctAnswer) {
  if (!gameState.currentLesson) return;

  // 获取用户答案（使用打乱后的选项）
  let userAnswer = '';
  if (q.type === 'choice') {
    const selected = document.querySelector('.option-btn.wrong, .option-btn.selected');
    if (selected) {
      const idx = parseInt(selected.dataset.index);
      // 优先用打乱后的 options，其次 opts
      userAnswer = q.options ? q.options[idx] : (q.opts ? q.opts[idx] : '未知');
    } else {
      userAnswer = '未选中';
    }
  } else if (q.type === 'truefalse' || q.type === 'tf') {
    const btns = document.querySelectorAll('.tf-btn');
    btns.forEach((btn, i) => {
      if (btn.classList.contains('wrong')) {
        userAnswer = i === 0 ? '<img src="../../icons/check.png" class="icon-24"> 正确' : '<img src="../../icons/cross.png" class="icon-24"> 错误';
      }
    });
    if (!userAnswer) userAnswer = '未作答';
  }

  // 构建错题记录
  const record = {
    unitId: gameState.currentUnit || 1,
    lessonId: gameState.currentLesson,
    lessonName: getCurrentLessonName(),
    question: q.q || q.question,
    questionType: q.type,
    userAnswer: userAnswer,
    correctAnswer: correctAnswer,
    timestamp: Date.now(),
    count: 1
  };

  // 检查是否已存在相同错题
  const existing = gameState.wrongQuestions.find(w =>
    w.lessonId === record.lessonId &&
    w.question === record.question
  );

  if (existing) {
    existing.count++;
    existing.timestamp = Date.now();
    existing.userAnswer = userAnswer;
  } else {
    gameState.wrongQuestions.push(record);
  }

  saveUserData();
}

function getCurrentLessonName() {
  const bank = questionData;
  if (!bank || !gameState.currentUnit || !gameState.currentLesson) return '未知课程';
  const unit = bank[gameState.currentUnit];
  if (!unit || !unit.lessons) return '未知课程';
  const lesson = unit.lessons[gameState.currentLesson];
  return lesson ? lesson.name : '未知课程';
}

function renderWrongQuestionList() {
  const list = document.getElementById('wrongQuestionList');
  if (!list) return;

  const wrongs = gameState.wrongQuestions || [];

  document.getElementById('wrongTotalCount').textContent = wrongs.length;
  const lessons = [...new Set(wrongs.map(w => w.lessonId))];
  document.getElementById('wrongLessonCount').textContent = lessons.length;

  const unitSelect = document.getElementById('wrongFilterUnit');
  const bank = questionData;

  if (bank && unitSelect.options.length <= 1) {
    for (const unitId in bank) {
      if (unitId !== 'name') {
        const opt = document.createElement('option');
        opt.value = unitId;
        opt.textContent = bank[unitId].name || `单元${unitId}`;
        unitSelect.appendChild(opt);
      }
    }
  }

  const unitFilter = unitSelect.value;
  const lessonFilter = document.getElementById('wrongFilterLesson').value;

  let filtered = wrongs;
  if (unitFilter !== 'all') {
    filtered = filtered.filter(w => w.unitId == unitFilter);
  }
  if (lessonFilter !== 'all') {
    filtered = filtered.filter(w => w.lessonId == lessonFilter);
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="wrong-empty">暂无错题，继续加油！</div>';
    return;
  }

  list.innerHTML = filtered.map((w, idx) => `
    <div class="wrong-item" data-index="${idx}">
      <button class="wrong-item-delete" onclick="deleteWrongQuestion(${idx})">✕</button>
      <div class="wrong-item-header">
        <span class="wrong-item-lesson"><img src="../../icons/book.png" class="icon-24"> ${w.lessonName || '课程' + w.lessonId}</span>
        <span class="wrong-item-count">错 ${w.count} 次</span>
      </div>
      <div class="wrong-item-question">${escapeHtml(w.question)}</div>
      <div class="wrong-item-answer">
        <span class="wrong-item-user"><img src="../../icons/cross.png" class="icon-24"> 你的答案: ${escapeHtml(w.userAnswer)}</span>
        <span class="wrong-item-correct"><img src="../../icons/check.png" class="icon-24"> 正确答案: ${escapeHtml(w.correctAnswer)}</span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function deleteWrongQuestion(index) {
  if (gameState.wrongQuestions && gameState.wrongQuestions.length > index) {
    gameState.wrongQuestions.splice(index, 1);
    saveUserData();
    renderWrongQuestionList();
  }
}

function practiceWrongQuestions() {
  const wrongs = gameState.wrongQuestions || [];
  if (wrongs.length === 0) {
    alert('暂无错题可练习！');
    return;
  }

  const shuffled = [...wrongs].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(10, shuffled.length));

  const questions = selected.map(w => {
    const bank = questionData;
    let originalQ = null;

    if (bank) {
      for (const unitId in bank) {
        if (unitId !== 'name' && bank[unitId].lessons) {
          const lesson = bank[unitId].lessons[w.lessonId];
          if (lesson) {
            for (const diff of ['basic', 'medium', 'hard']) {
              if (lesson[diff]) {
                const found = lesson[diff].find(q => (q.q || q.question) === w.question);
                if (found) {
                  originalQ = found;
                  break;
                }
              }
            }
          }
        }
        if (originalQ) break;
      }
    }

    if (!originalQ) {
      return {
        type: w.questionType,
        q: w.question,
        opts: w.questionType === 'choice' ? [w.correctAnswer, w.userAnswer, '其他A', '其他B'] : undefined,
        answer: 0,
        hint: '这是一道错题'
      };
    }

    return originalQ;
  });

  gameState.isWrongQuestionPractice = true;
  gameState.currentQuestions = questions;
  gameState.currentQuestion = 0;
  gameState.correctCount = 0;
  gameState.answered = [];
  gameState.hintsRemaining = 3;
  gameState.hintsUsed = 0;
  gameState.currentStreak = 0;
  gameState.maxStreak = 0;

  closeWrongQuestions();
  showScreen('quizScreen');
  showQuestion();
}


function mergeUserData(localData, cloudData) {
  if (!cloudData) return localData;
  if (!localData) return cloudData;
  const localTs = localData.lastUpdated || 0;
  const cloudTs = cloudData.lastUpdated || 0;
  if (cloudTs <= localTs) return localData;
  const merged = { ...cloudData };
  if (cloudData.equipment || localData.equipment) {
    const equipMap = {};
    [...(localData.equipment || []), ...(cloudData.equipment || [])].forEach(e => { equipMap[e.id] = e; });
    merged.equipment = Object.values(equipMap);
  }
  if (cloudData.unlockedAchievements || localData.unlockedAchievements) {
    const achSet = new Set([...(localData.unlockedAchievements || []), ...(cloudData.unlockedAchievements || [])]);
    merged.unlockedAchievements = [...achSet];
  }
  if (cloudData.wrongQuestions || localData.wrongQuestions) {
    const wqMap = {};
    [...(localData.wrongQuestions || []), ...(cloudData.wrongQuestions || [])].forEach(wq => { wqMap[wq.question + '|' + wq.correctAnswer] = wq; });
    merged.wrongQuestions = Object.values(wqMap);
  }

  // 课次进度：合并并集（每个key取较大值，进度只增不减）
  const lpLocal = localData.lessonProgress || {};
  const lpCloud = cloudData.lessonProgress || {};
  const allLessonKeys = new Set([...Object.keys(lpLocal), ...Object.keys(lpCloud)]);
  if (allLessonKeys.size > 0) {
    merged.lessonProgress = {};
    allLessonKeys.forEach(key => {
      merged.lessonProgress[key] = Math.max(lpLocal[key] || 0, lpCloud[key] || 0);
    });
  }

  return merged;
}

function loadUserData() {
  if (gameState.isGuest) return;
  const saveKey = 'scienceGame_user_' + gameState.studentId;
  const saved = localStorage.getItem(saveKey);
  const localData = saved ? JSON.parse(saved) : null;
  if (localData) { applyUserData(localData); console.log('使用本地存档'); }

  // 【迁移】从旧版本 per-grade key 迁移所有存档数据
  var migrated = false;
  var oldGrades = ['3', '4', '5', '6'];
  var mergedEquip = [];
  var mergedPoints = 0 // fix: prevent auto-accumulation on each login;
  var mergedAchievements = gameState.unlockedAchievements || [];
  var mergedSlots = {};

  for (var gi = 0; gi < oldGrades.length; gi++) {
    try {
      var oldKey = 'scienceGame' + oldGrades[gi] + '_user_' + gameState.studentId;
      var oldRaw = localStorage.getItem(oldKey);
      if (oldRaw) {
        var oldData = JSON.parse(oldRaw);
        if (oldData) {
          // 合并装备（取装备最多的那个年级）
          if (oldData.equipment) {
            var equipCount = oldData.equipment.filter(Boolean).length;
            if (equipCount > mergedEquip.filter(Boolean).length) {
              mergedEquip = oldData.equipment;
              mergedSlots = oldData.equippedSlots || {};
            }
          }
          // 合并积分（累加）
          mergedPoints += oldData.totalPoints || 0;
          // 合并成就
          if (oldData.unlockedAchievements) {
            oldData.unlockedAchievements.forEach(function(a) {
              if (mergedAchievements.indexOf(a) === -1) mergedAchievements.push(a);
            });
          }
          // 迁移课时进度到 per-course key
          if (oldData.lessonProgress && Object.keys(oldData.lessonProgress).length > 0) {
            var progressKey = 'progress_grade' + oldGrades[gi] + '2_' + gameState.studentId;
            var existingProgress = {};
            try {
              var existingRaw = localStorage.getItem(progressKey);
              if (existingRaw) existingProgress = JSON.parse(existingRaw);
            } catch(e) {}
            // 合并进度（取最大值）
            for (var lid in oldData.lessonProgress) {
              if (oldData.lessonProgress[lid] > (existingProgress[lid] || 0)) {
                existingProgress[lid] = oldData.lessonProgress[lid];
              }
            }
            localStorage.setItem(progressKey, JSON.stringify(existingProgress));
            console.log('✅ 已迁移' + oldGrades[gi] + '年级课时进度');
          }
          // 删除旧 key
          localStorage.removeItem(oldKey);
          migrated = true;
        }
      }
    } catch(e) { /* ignore one grade error */ }
  }

  if (migrated) {
    gameState.equipment = mergedEquip;
    gameState.equippedSlots = mergedSlots;
    gameState.totalPoints = Math.max(gameState.totalPoints, mergedPoints) // keep highest;
    gameState.unlockedAchievements = mergedAchievements;
    localStorage.setItem(saveKey, JSON.stringify({
      totalPoints: gameState.totalPoints,
      equipment: gameState.equipment,
      equippedSlots: gameState.equippedSlots,
      pets: gameState.pets || {},
      petPieces: gameState.petPieces || {},
      unlockedAchievements: gameState.unlockedAchievements
    }));
    console.log('✅ 已迁移旧版本数据 (3/4/5/6年级合并)');
  }

  // 【安全修复】从宠物系统的 localStorage 同步积分
  // petSystemStateV2 是全局键，必须校验 studentId 防串号
  try {
    const petRaw = localStorage.getItem('petSystemStateV2_' + gameState.studentId);
    if (petRaw) {
      const petState = JSON.parse(petRaw);
      // 必须 studentId 匹配，否则会串到别人的积分
      if (petState && petState.studentId === gameState.studentId &&
          petState.points > 0 && petState.points > (gameState.totalPoints || 0)) {
        gameState.totalPoints = petState.points;
        localStorage.setItem(saveKey, JSON.stringify(Object.assign({}, localData || {}, { totalPoints: gameState.totalPoints })));
        console.log('已从宠物系统同步积分:', gameState.totalPoints);
      }
    }
  } catch (e) { /* ignore */ }

  loadFromCloud(gameState.studentId).then(cloudData => {
    if (!cloudData) return;
    const merged = mergeUserData(localData, cloudData);
    if (merged !== localData) {
      applyUserData(merged);
      localStorage.setItem(saveKey, JSON.stringify(merged));
      saveToCloud(gameState.studentId, merged);
      console.log('已同步云端最新存档');
    }
  }).finally(() => {
    // 领取待发放奖励（称号/装备/宠物）
    if (typeof collectPendingRewards === 'function') {
      collectPendingRewards(gameState.studentId, showAchievementUnlock);
    }
  });
}

function applyUserData(data) {
  gameState.totalPoints = data.totalPoints || 0;
  gameState.lessonProgress = data.lessonProgress || {};
  gameState.unlockedAchievements = data.unlockedAchievements || [];
  gameState.equipment = data.equipment || [];
  // 兼容旧存档：转换为100格数组
  if (gameState.equipment.length > 0 && gameState.equipment.length !== 100) {
    const items = gameState.equipment.filter(Boolean);
    const inv = new Array(100).fill(null);
    items.forEach((item, i) => { if (i < 100) inv[i] = item; });
    gameState.equipment = inv;
  }
  if (gameState.equipment.length === 0) {
    gameState.equipment = new Array(100).fill(null);
  }
  gameState.equipDropped = data.equipDropped || {};
  gameState.wrongQuestions = data.wrongQuestions || [];
  // 答题统计
  gameState.totalQuestionsAnswered = data.totalQuestionsAnswered || 0;
  gameState.totalCorrectAnswers = data.totalCorrectAnswers || 0;
  gameState.dailyStamina = (data.dailyStamina !== undefined) ? data.dailyStamina : 20;
  gameState.lastStaminaDate = data.lastStaminaDate || null;
  updateStatusBar();
  updateStaminaDisplay();
  renderAchievementPreview();
  // 恢复装备槽（防止云端存档覆盖内存状态）
  loadEquippedState62();
  saveUserData();
}

const RARITY_NAMES62 = ['普通','精致','良好','稀有','史诗','传说','神话'];
const RARITY_COLORS62 = ['#9e9e9e','#4caf50','#2196f3','#9c27b0','#e91e63','#ffd700','#ff5722'];
// 安全取值器，防止旧装备无 rarity 字段导致 NaN → Undefined
function getRarityColor62(e) { return RARITY_COLORS62[(e && e.rarity ? e.rarity : 1) - 1] || '#9e9e9e'; }
function getRarityName62(e)  { return RARITY_NAMES62[(e && e.rarity ? e.rarity : 1) - 1]  || '普通'; }

// ========== 六年级装备穿戴系统 ==========
const bpEquippedSlots62 = {
  weapon: null, hat: null, top: null, bottom: null,
  glove: null, cape: null, shield: null, shoes: null,
  face: null, eyes: null,
  treasure: [null, null]
};

const SLOT_MAP_62 = {
  weapon:   ['weapon','武器','剑','弓','杖','魔杖','短剑','长矛','矛','刀'],
  hat:      ['hat','帽','冠','盔','头'],
  top:      ['top','衣','服','衫','袍','连衣裙'],
  bottom:   ['bottom','裤','裙','下装'],
  glove:    ['glove','手套','护手','手'],
  cape:     ['cape','披风','斗篷'],
  shield:   ['shield','盾牌','魔法盾','护盾'],
  shoes:    ['shoes','鞋','靴','鞋子'],
  face:     ['face','脸饰','面具'],
  eyes:     ['eyes','眼饰','眼罩','隐形眼镜','眼镜'],
  treasure: ['宝物','科学']
};

function getEquipSlotType62(equip) {
  if (!equip) return null;
  const s = (equip.slot || equip.type || '').toLowerCase();
  for (const [type, keywords] of Object.entries(SLOT_MAP_62)) {
    if (keywords.some(k => s.includes(k))) return type;
  }
  return null;
}

function isDressEquip62(equip) {
  if (!equip) return false;
  const s = (equip.slot || equip.type || '').toLowerCase();
  return s.includes('连衣裙') || (s.includes('衣') && s.includes('裙'));
}

function isEquippedIdx62(idx) {
  if (bpEquippedSlots62.treasure.includes(idx)) return true;
  for (const slot of ['weapon','hat','top','bottom','glove','cape','shield','shoes','face','eyes']) {
    if (bpEquippedSlots62[slot] === idx) return true;
  }
  return false;
}

function loadEquippedState62() {

  const saved = localStorage.getItem('bpEquipped_6_' + userId);
  if (saved) {
    try {
      const state = JSON.parse(saved);
      for (const slot in state) {
        if (slot === 'treasure') {
          // treasure 是数组，验证每个元素
          if (!Array.isArray(state.treasure) || state.treasure.length < 2) {
            state.treasure = [null, null];
          } else {
            state.treasure[0] = (state.treasure[0] !== null && gameState.equipment[state.treasure[0]]) ? state.treasure[0] : null;
            state.treasure[1] = (state.treasure[1] !== null && gameState.equipment[state.treasure[1]]) ? state.treasure[1] : null;
          }
        } else {
          const idx = state[slot];
          if (idx !== null && (!gameState.equipment[idx] || gameState.equipment[idx] === null)) {
            state[slot] = null;
          }
        }
      }
      Object.assign(bpEquippedSlots62, state);
    } catch (e) {}
  }
}

function calcEquippedBonus() {
  const bonus = { str: 0, dex: 0, int: 0, hp: 0, mp: 0, pointMul: 1 };
  for (const slot in bpEquippedSlots62) {
    if (slot === 'treasure') {
      (bpEquippedSlots62.treasure || []).forEach(idx => {
        if (idx !== null && gameState.equipment[idx]) {
          const e = gameState.equipment[idx];
          bonus.str += e.str || 0;
          bonus.dex += e.dex || 0;
          bonus.int += e.int || 0;
          bonus.hp += e.hp || 0;
          bonus.mp += e.mp || 0;
          if (e.pointBonus) bonus.pointMul += (e.pointBonus >= 2 ? e.pointBonus - 1 : e.pointBonus);
        }
      });
    } else {
      const idx = bpEquippedSlots62[slot];
      if (idx !== null && gameState.equipment[idx]) {
        const e = gameState.equipment[idx];
        bonus.str += e.str || 0;
        bonus.dex += e.dex || 0;
        bonus.int += e.int || 0;
        bonus.hp += e.hp || 0;
        bonus.mp += e.mp || 0;
        if (e.pointBonus) bonus.pointMul += (e.pointBonus >= 2 ? e.pointBonus - 1 : e.pointBonus);
      }
    }
  }
  return bonus;
}

function updateTotalBonusBar62() {
  const bar = document.getElementById('bpTotalBonusBar');
  if (!bar) return;
  const bonus = calcEquippedBonus();
  const hasEquip = Object.entries(bpEquippedSlots62).some(([k, v]) => {
    if (k === 'treasure') return Array.isArray(v) && v.some(i => i !== null);
    return v !== null;
  });
  if (!hasEquip) {
    bar.innerHTML = `<div class="bp-total-bonus-title">✨ 已穿戴装备加成</div><div class="bp-total-bonus-empty">尚未穿戴任何装备</div>`;
    return;
  }
  let html = `<div class="bp-total-bonus-title">✨ 已穿戴装备加成</div>`;
  if (bonus.str) html += `<div class="bp-total-bonus-item">💪 力量 <span class="bp-total-bonus-value">+${bonus.str}</span></div>`;
  if (bonus.dex) html += `<div class="bp-total-bonus-item">🏃 敏捷 <span class="bp-total-bonus-value">+${bonus.dex}</span></div>`;
  if (bonus.int) html += `<div class="bp-total-bonus-item">🧠 智力 <span class="bp-total-bonus-value">+${bonus.int}</span></div>`;
  if (bonus.hp) html += `<div class="bp-total-bonus-item">❤️ HP <span class="bp-total-bonus-value">+${bonus.hp}</span></div>`;
  if (bonus.mp) html += `<div class="bp-total-bonus-item">💧 MP <span class="bp-total-bonus-value">+${bonus.mp}</span></div>`;
  if (bonus.pointMul > 1) html += `<div class="bp-total-bonus-item">🎯 积分倍率 <span class="bp-total-bonus-value">×${bonus.pointMul.toFixed(2)}</span></div>`;
  bar.innerHTML = html;
}

const SLOT_LABELS_62 = {
  weapon: '⚔️ 武器', hat: '🎩 帽子', top: '👕 上衣', bottom: '👖 下衣',
  glove: '🧤 手套', cape: '🧣 披风', shield: '🛡️ 盾牌', shoes: '👟 鞋子',
  face: '🎭 脸饰', eyes: '👁️ 眼饰',
  treasure: ['🔬 科学宝物 1', '🔬 科学宝物 2']
};
const SLOT_ORDER_62 = ['weapon','hat','top','bottom','glove','cape','shield','shoes','face','eyes','treasure'];

// 更新装备槽位显示
function updateEquippedSlots62() {
  for (const slot of SLOT_ORDER_62) {
    const box = document.querySelector(`.bp-slot-box[data-slot="${slot}"]`);
    if (!box) continue;
    const iconEl = box.querySelector('.bp-slot-icon');
    const nameEl = box.querySelector('.bp-slot-name');
    if (slot === 'treasure') {
      const subSlots = box.querySelectorAll('.bp-treasure-sub');
      const treasures = bpEquippedSlots62.treasure;
      for (let t = 0; t < 2; t++) {
        const sub = subSlots[t];
        if (!sub) continue;
        const idx = treasures[t];
        if (idx !== null && gameState.equipment[idx]) {
          const e = gameState.equipment[idx];
          sub.textContent = e.icon || '📦';
          sub.style.color = e.rarityColor || '#ffd700';
          sub.title = e.name;
        } else {
          sub.textContent = '空';
          sub.style.color = 'rgba(255,255,255,0.2)';
          sub.title = '';
        }
      }
      const hasAny = treasures[0] !== null || treasures[1] !== null;
      box.classList.toggle('equipped', hasAny);
      const count = treasures.filter(i => i !== null).length;
      nameEl.textContent = count > 0 ? `${count}/2` : '';
      nameEl.style.color = count > 0 ? '#ffd700' : '#aaa';
    } else {
      const idx = bpEquippedSlots62[slot];
      if (idx !== null && gameState.equipment[idx]) {
        const e = gameState.equipment[idx];
        const color = e.rarityColor || '#ffd700';
        box.classList.add('equipped');
        iconEl.innerHTML = `<span style="color:${color}">${e.icon || '📦'}</span>`;
        nameEl.textContent = e.name || '';
        nameEl.style.color = color;
      } else {
        box.classList.remove('equipped');
        iconEl.innerHTML = '<span class="bp-slot-empty">空</span>';
        nameEl.textContent = '';
        nameEl.style.color = '#aaa';
      }
    }
  }
  updateTotalBonusBar62();
}

function openEquipSelector62(slotType) {
  const label = Array.isArray(SLOT_LABELS_62[slotType]) ? SLOT_LABELS_62[slotType][0] : SLOT_LABELS_62[slotType] || slotType;
  const equips = gameState.equipment.map((e, i) => ({ equip: e, idx: i }))
    .filter(item => {
      if (!item.equip) return false;
      const type = getEquipSlotType62(item.equip);
      return type === slotType;
    })
    .sort((a, b) => (b.equip.rarity || 1) - (a.equip.rarity || 1));

  const equippedIdx = bpEquippedSlots62[slotType];
  let html = `<div class="bp-detail-overlay" onclick="closeEquipSelector62(event)">
    <div class="bp-detail-card" style="border-color:#ffd700;max-height:80vh;overflow-y:auto;" onclick="event.stopPropagation()">
      <div class="bp-detail-name" style="color:#ffd700">选择${label}</div>
      <div class="bp-detail-type">点击装备进行穿戴</div>`;

  if (slotType === 'treasure') {
    // 科学宝物：分 2 个子槽显示
    const treasures = bpEquippedSlots62.treasure;
    const equipsAll = gameState.equipment.map((e, i) => ({ equip: e, idx: i }))
      .filter(item => {
        if (!item.equip) return false;
        const type = getEquipSlotType62(item.equip);
        return type === 'treasure';
      })
      .sort((a, b) => (b.equip.rarity || 1) - (a.equip.rarity || 1));
    for (let t = 0; t < 2; t++) {
      const subIdx = treasures[t];
      const subLabel = SLOT_LABELS_62.treasure[t];
      html += `<div style="margin:10px 0;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;">`;
      html += `<div style="font-size:0.8em;color:#666;margin-bottom:6px;">${subLabel}</div>`;
      if (subIdx !== null && gameState.equipment[subIdx]) {
        const e = gameState.equipment[subIdx];
        const color = e.rarityColor || '#ffd700';
        html += `<div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:1.5em;">${e.icon || '📦'}</span>
          <span style="color:${color}">${e.name}</span>
          <button class="bp-detail-btn bp-detail-unequip" style="margin-left:auto;font-size:0.7em;padding:2px 8px;" onclick="unequipTreasureSlot62(${t})">卸下</button>
        </div>`;
      } else {
        html += `<div style="color:#555;padding:4px 0;">空闲</div>`;
      }
      if (equipsAll.length > 0) {
        html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:6px;">`;
        equipsAll.forEach(item => {
          const e = item.equip;
          const color = getRarityColor62(e);
          const isEquippedHere = item.idx === subIdx;
          html += `<div class="inventory-slot ${isEquippedHere ? 'equipped' : ''}"
            style="border-color:${color}40;padding:6px;cursor:pointer;${isEquippedHere ? 'background:rgba(255,215,0,0.15);' : ''}"
            onclick="bpEquipByIdx62(${item.idx});closeEquipSelector62();">
            <div style="font-size:1.5em;">${e.icon || '📦'}</div>
            <div style="font-size:0.6em;color:${color};text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.name}</div>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }
  } else {
    // 普通槽位
    const equips = gameState.equipment.map((e, i) => ({ equip: e, idx: i }))
      .filter(item => {
        if (!item.equip) return false;
        const type = getEquipSlotType62(item.equip);
        return type === slotType;
      })
      .sort((a, b) => (b.equip.rarity || 1) - (a.equip.rarity || 1));

    if (equippedIdx !== null) {
      html += `<button class="bp-detail-btn bp-detail-unequip" style="margin-bottom:12px;" onclick="unequipBySlot62('${slotType}')">卸下当前装备</button>`;
    }
    if (equippedIdx !== null && gameState.equipment[equippedIdx]) {
      const e = gameState.equipment[equippedIdx];
      const color = getRarityColor62(e);
      html += `<div style="border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;margin-bottom:10px;opacity:0.6;">
        <div style="font-size:0.8em;color:#666;">当前穿戴</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:1.5em;">${e.icon || '📦'}</span>
          <span style="color:${color}">${e.name}</span>
        </div>
      </div>`;
    }
    if (equips.length === 0) {
      html += `<div style="text-align:center;color:#666;padding:20px;">背包中没有${label}类装备</div>`;
    } else {
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px;">`;
      equips.forEach(item => {
        const e = item.equip;
        const color = getRarityColor62(e);
        const isEquipped = item.idx === equippedIdx;
        html += `<div class="inventory-slot ${isEquipped ? 'equipped' : ''}"
          style="border-color:${color}40;padding:8px;cursor:pointer;${isEquipped ? 'background:rgba(255,215,0,0.15);' : ''}"
          onclick="bpEquipByIdx62(${item.idx});closeEquipSelector62();">
          <div style="font-size:1.5em;">${e.icon || '📦'}</div>
          <div style="font-size:0.6em;color:${color};text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.name}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }
  html += `<button class="bp-detail-close-btn" onclick="closeEquipSelector62()" style="margin-top:12px;">关闭</button></div></div>`;
  document.getElementById('bpDetailContainer').innerHTML = html;
}

function closeEquipSelector62(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('bpDetailContainer').innerHTML = '';
}

function unequipBySlot62(slotType) {
  if (slotType === 'treasure') return;
  bpEquippedSlots62[slotType] = null;
  saveEquippedState62();
  closeEquipSelector62();
  updateCharPanel62();
  renderInventoryGrid62();
  updateEquippedSlots62();
}

function unequipTreasureSlot62(t) {
  if (!bpEquippedSlots62.treasure) bpEquippedSlots62.treasure = [null, null];
  bpEquippedSlots62.treasure[t] = null;
  saveEquippedState62();
  closeEquipSelector62();
  updateCharPanel62();
  renderInventoryGrid62();
  updateEquippedSlots62();
}

function bpEquipByIdx62(idx) {
  const e = gameState.equipment[idx];
  if (!e) return;
  const slotType = getEquipSlotType62(e);
  if (!slotType) return;
  if (slotType === 'treasure') {
    // 科学宝物：自动放入第一个空闲宝物槽
    if (!bpEquippedSlots62.treasure) bpEquippedSlots62.treasure = [null, null];
    if (bpEquippedSlots62.treasure[0] === null) {
      bpEquippedSlots62.treasure[0] = idx;
    } else if (bpEquippedSlots62.treasure[1] === null) {
      bpEquippedSlots62.treasure[1] = idx;
    } else {
      return;
    }
  } else {
    for (const key in bpEquippedSlots62) {
      if (key === 'treasure') {
        const t = bpEquippedSlots62.treasure.indexOf(idx);
        if (t !== -1) bpEquippedSlots62.treasure[t] = null;
      } else if (bpEquippedSlots62[key] === idx) {
        bpEquippedSlots62[key] = null;
      }
    }
    // 连衣裙冲突
    if (isDressEquip62(e) && slotType === 'top') {
      bpEquippedSlots62.bottom = null;
    } else if (slotType === 'bottom' && bpEquippedSlots62.top !== null && gameState.equipment[bpEquippedSlots62.top]) {
      if (isDressEquip62(gameState.equipment[bpEquippedSlots62.top])) {
        bpEquippedSlots62.top = null;
      }
    }
    bpEquippedSlots62[slotType] = idx;
  }
  saveEquippedState62();
  updateCharPanel62();
  renderInventoryGrid62();
  updateEquippedSlots62();
}

function bpUnequipByIdx62(idx) {
  const e = gameState.equipment[idx];
  if (!e) return;
  const slotType = getEquipSlotType62(e);
  if (!slotType) return;
  if (slotType === 'treasure') {
    if (!bpEquippedSlots62.treasure) bpEquippedSlots62.treasure = [null, null];
    const t = bpEquippedSlots62.treasure.indexOf(idx);
    if (t !== -1) bpEquippedSlots62.treasure[t] = null;
  } else {
    if (bpEquippedSlots62[slotType] === idx) {
      bpEquippedSlots62[slotType] = null;
    }
  }
  saveEquippedState62();
  updateCharPanel62();
  renderInventoryGrid62();
  updateEquippedSlots62();
}

function initInventory62() {
  if (!gameState.equipment) { gameState.equipment = new Array(100).fill(null); return; }
  if (gameState.equipment.length !== 100 || gameState.equipment.length === undefined) {
    const items = gameState.equipment.filter(Boolean);
    const inv = new Array(100).fill(null);
    items.forEach((item, i) => { if (i < 100) inv[i] = item; });
    gameState.equipment = inv;
  }
}

function recalcCharStats62() {
  const stats = { str: 0, dex: 0, int: 0, hp: 0, mp: 0 };
  for (const slot in bpEquippedSlots62) {
    if (slot === 'treasure') {
      (bpEquippedSlots62.treasure || []).forEach(idx => {
        if (idx !== null && gameState.equipment[idx]) {
          const e = gameState.equipment[idx];
          stats.str += e.str || 0; stats.dex += e.dex || 0; stats.int += e.int || 0;
          stats.hp += e.hp || 0; stats.mp += e.mp || 0;
        }
      });
    } else {
      const idx = bpEquippedSlots62[slot];
      if (idx !== null && gameState.equipment[idx]) {
        const e = gameState.equipment[idx];
        stats.str += e.str || 0; stats.dex += e.dex || 0; stats.int += e.int || 0;
        stats.hp += e.hp || 0; stats.mp += e.mp || 0;
      }
    }
  }
  return stats;
}

function updateCharPanel62() {
  const stats = recalcCharStats62();
  const items = (gameState.equipment || []).filter(Boolean);
  const equippedCount = Object.entries(bpEquippedSlots62).reduce((sum, [k, v]) => {
    if (k === 'treasure') return sum + (Array.isArray(v) ? v.filter(i => i !== null).length : 0);
    return sum + (v !== null ? 1 : 0);
  }, 0);
  const level = Math.min(50, 1 + equippedCount);
  document.getElementById('bpCharLevel').textContent = level;
  document.getElementById('bpStrVal').textContent = 10 + stats.str;
  document.getElementById('bpDexVal').textContent = 10 + stats.dex;
  document.getElementById('bpIntVal').textContent = 10 + stats.int;
  document.getElementById('bpHpVal').textContent = 100 + stats.hp;
  document.getElementById('bpMpVal').textContent = 50 + stats.mp;
  document.getElementById('bpStrBar').style.width = Math.min(100, (10 + stats.str) * 2) + '%';
  document.getElementById('bpDexBar').style.width = Math.min(100, (10 + stats.dex) * 2) + '%';
  document.getElementById('bpIntBar').style.width = Math.min(100, (10 + stats.int) * 2) + '%';
  document.getElementById('bpHpBar').style.width = Math.min(100, (100 + stats.hp) / 3) + '%';
  document.getElementById('bpMpBar').style.width = Math.min(100, (50 + stats.mp) * 2) + '%';
  document.getElementById('bpEquipBonus').textContent = '+' + (stats.str + stats.dex + stats.int + stats.hp + stats.mp);
  // 渲染已穿戴装备图标列表
  const equippedList = document.getElementById('bpEquippedList');
  if (equippedList) {
    let html = '';
    function addIcon(idx) {
      if (idx !== null && gameState.equipment[idx]) {
        const e = gameState.equipment[idx];
        const color = getRarityColor62(e);
        html += `<div onclick="showEquipDetail62(${idx})" title="${e.name || '装备'}" style="cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border-radius:6px;border:1px solid ${color}40;font-size:1.1em;">${e.icon || '📦'}</div>`;
      }
    }
    for (const slot of SLOT_ORDER_62) {
      if (slot === 'treasure') {
        (bpEquippedSlots62.treasure || []).forEach(idx => addIcon(idx));
      } else {
        addIcon(bpEquippedSlots62[slot]);
      }
    }
    equippedList.innerHTML = html || '';
  }

  // 更新总加成文字
  updateTotalBonusBar62();
  // 稀有度计数（用安全取值器）
  const counts = [0,0,0,0,0,0,0];
  items.forEach(e => { const r = (e && e.rarity) ? e.rarity : 1; counts[r - 1]++; });
  document.getElementById('bpRarityCounts').innerHTML = RARITY_NAMES62.map((n, i) =>
    `<div class="bp-rarity-row"><span><span class="bp-rarity-dot" style="background:${RARITY_COLORS62[i]}"></span>${n}</span><span style="color:${RARITY_COLORS62[i]}">${counts[i]}</span></div>`
  ).join('');
  document.getElementById('bpEquipCount').textContent = items.length;
  document.getElementById('bpSlotCount').textContent = items.length + '/100';
}

function renderInventoryGrid62() {
  const grid = document.getElementById('backpackGrid');
  if (!gameState.equipment) gameState.equipment = new Array(100).fill(null);
  grid.innerHTML = gameState.equipment.map((e, i) => {
    if (!e) return `<div class="inventory-slot empty" data-slot="${i}"></div>`;
    const r = e.rarity || 1;
    const color = RARITY_COLORS62[r - 1] || '#9e9e9e';
    const mult = e.pointBonus >= 2 ? e.pointBonus : 1 + (e.pointBonus || 0);
    const affixText = e.affixDetails ? e.affixDetails.map(a => a.name).join('、') : '';
    const isEquipped = isEquippedIdx62(i);
    const equippedStyle = isEquipped ? 'background:rgba(255,215,0,0.15);border-color:rgba(255,215,0,0.6) !important;' : '';
    const equipTag = isEquipped ? '<div style="position:absolute;top:2px;right:2px;font-size:0.5em;background:#ffd700;color:#000;padding:1px 3px;border-radius:3px;z-index:1;">装</div>' : '';
    return `<div class="inventory-slot" data-slot="${i}" data-rarity="${r}" style="border-color:${color}40;${equippedStyle}" onclick="showEquipDetail62(${i})">
      ${equipTag}
      ${e.icon}
      <div class="bp-tooltip">
        <div class="bp-tooltip-name" style="color:${color}">${e.name}</div>
        <div class="bp-tooltip-stats">×${mult.toFixed(2)} ${e.effect || ''}</div>
        ${isEquipped ? '<div style="color:#ffd700;">【已穿戴】</div>' : ''}
        ${affixText ? `<div class="bp-tooltip-affix">${affixText}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

  const r = e.rarity || 1;
  const color = RARITY_COLORS62[r - 1] || '#9e9e9e';

  } else {
    buttonsHtml = `
      <button class="bp-detail-btn bp-detail-wear" onclick="bpEquipByIdx62(${slotIdx})" style="background:rgba(76,175,80,0.3);">装备</button>
      <button class="bp-detail-btn bp-detail-unequip" disabled style="opacity:0.5;cursor:not-allowed;">卸下</button>`;
  }
  container.innerHTML = `<div class="bp-detail-overlay" onclick="closeBpDetail62(event)">
    <div class="bp-detail-card" style="border-color:${color};" onclick="event.stopPropagation()">
      <div class="bp-detail-icon">${e.icon}</div>
      <div class="bp-detail-name" style="color:${color}">${e.name}</div>
      <div class="bp-detail-type">${RARITY_NAMES62[r - 1]} · ${e.slot || e.type || '装备'}${isEquipped ? ' <span style="color:#ffd700;">【已穿戴】</span>' : ''}</div>

const RANKING_GRADE_KEY = 'global_ranking';

// 计算并推送当前用户的排名数据到 JSONBin
async function pushRankingData() {
  if (gameState.isGuest || !gameState.studentId) return;
  try {
    const petInfo = (typeof calcPetBattleBonus === 'function') ? calcPetBattleBonus() : { total: 0 };
    const equipInfo = (typeof calcEquippedBonus === 'function') ? calcEquippedBonus() : { pointMul: 1 };
    const totalQ = gameState.totalQuestionsAnswered || 0;
    const totalC = gameState.totalCorrectAnswers || 0;
    const accuracyRate = totalQ >= 200 ? (totalQ > 0 ? (totalC / totalQ * 100).toFixed(1) : 0) : -1;
    const data = {
      studentId: gameState.studentId,
      totalPoints: gameState.totalPoints || 0,
      petPower: (petInfo.totalPets || 0) > 0 ? (petInfo.pointsMul || 1) * 100 : 0,
      equipBonus: equipInfo.pointMul || 1,
      achievementCount: (gameState.unlockedAchievements || []).length,
      lessonCount: Object.values(gameState.lessonProgress || {}).filter(v => v >= 1).length,
      totalStars: Object.values(gameState.lessonProgress || {}).reduce((a, b) => a + (b || 0), 0),
      totalQuestionsAnswered: totalQ,
      totalCorrectAnswers: totalC,
      accuracyRate: accuracyRate,
      towerFloor: gameState.towerFloor || 0,
      lastUpdated: Date.now()
    };
    await updateRanking(RANKING_GRADE_KEY, gameState.studentId, data);
  } catch(e) { console.error('推送排名数据失败:', e); }
}

// 加载并渲染排行榜
async function loadAndRenderRanking(type) {
  const listEl = document.getElementById('rankingList');
  listEl.innerHTML = '<div class="ranking-loading">加载中...</div>';
  
  try {
    const allData = await getRanking(RANKING_GRADE_KEY);
    if (!allData || Object.keys(allData).length === 0) {
      listEl.innerHTML = '<div class="ranking-empty">暂无排行数据，答题后自动同步</div>';
      return;
    }

    let arr = Object.values(allData);
    const myId = gameState.studentId;
    let sortField = 'totalPoints';
    if (type === 'pet') sortField = 'petPower';
    else if (type === 'equip') sortField = 'equipBonus';
    else if (type === 'ach') sortField = 'achievementCount';
    else if (type === 'questions') sortField = 'totalQuestionsAnswered';
    else if (type === 'tower') sortField = 'towerFloor';
    else if (type === 'accuracy') {
      arr = arr.filter(item => item.accuracyRate !== undefined && item.accuracyRate >= 0);
      arr.sort((a, b) => (b.accuracyRate || 0) - (a.accuracyRate || 0));
      renderAccuracyRankList(listEl, arr, myId);
      return;
    }

    arr.sort((a, b) => (b[sortField] || 0) - (a[sortField] || 0));
    renderRankList(listEl, arr, sortField, myId);
  } catch(e) {
    console.error('加载排行失败:', e);
    listEl.innerHTML = '<div class="ranking-empty">加载失败，请稍后重试</div>';
  }
}

// 渲染正确率排行榜
function renderAccuracyRankList(listEl, arr, myId) {
  if (!arr || arr.length === 0) {
    listEl.innerHTML = '<div class="ranking-empty">暂无排行数据（需完成200题以上）</div>';
    return;
  }
  let html = '<div style="text-align:center;font-size:0.85em;color:rgba(255,255,255,0.5);margin-bottom:12px;">🎯 正确率榜 · 需完成200题以上</div>';
  arr.forEach((item, idx) => {
    const rank = idx + 1;
    const posClass = rank <= 3 ? 'ranking-pos-' + rank : 'ranking-pos-n';
    const sid = item.studentId || '';
    let displayName = sid;
    if (sid.length >= 5) displayName = sid.substring(0, 2) + '**' + sid.substring(sid.length - 2);
    const isMe = (item.studentId === myId);
    const accuracy = item.accuracyRate || 0;
    const totalQ = item.totalQuestionsAnswered || 0;
    const totalC = item.totalCorrectAnswers || 0;
    const accColor = accuracy >= 90 ? '#4ade80' : accuracy >= 80 ? '#ffd700' : accuracy >= 70 ? '#ff9800' : '#ff6b6b';
    html += '<div class="ranking-item' + (isMe ? ' me' : '') + '">' +
      '<div class="ranking-pos ' + posClass + '">' + rank + '</div>' +
      '<div class="ranking-name">' + displayName + (isMe ? '（我）' : '') + '</div>' +
      '<div class="ranking-value" style="color:' + accColor + '">' + accuracy + '%</div>' +
      '<div style="font-size:0.75em;color:rgba(255,255,255,0.4);">' + totalC + '/' + totalQ + '题</div>' +
      '</div>';
  });
  listEl.innerHTML = html;
}

// 渲染排名列表
function renderRankList(listEl, arr, sortField, myId) {
  if (!arr || arr.length === 0) {
    listEl.innerHTML = '<div class="ranking-empty">暂无排行数据</div>';
    return;
  }

  let html = '';
  arr.forEach((item, idx) => {
    const rank = idx + 1;
    const posClass = rank <= 3 ? 'ranking-pos-' + rank : 'ranking-pos-n';
    const sid = item.studentId || '';
    let displayName = sid;
    if (sid.length >= 5) {
      displayName = sid.substring(0, 2) + '**' + sid.substring(sid.length - 2);
    }
    const isMe = (item.studentId === myId);
    const val = item[sortField] || 0;
    // Hide scores over 500k with stars
    let valStr;
    if (sortField === 'totalPoints' && val >= 500000) {
      valStr = '⭐⭐⭐⭐⭐';
    } else if (sortField === 'equipBonus') {
      valStr = '×' + val.toFixed(2);
    } else {
      valStr = val.toLocaleString();
    }

    html += '<div class="ranking-item' + (isMe ? ' me' : '') + '">' +
      '<div class="ranking-pos ' + posClass + '">' + rank + '</div>' +
      '<div class="ranking-name">' + displayName + (isMe ? '（我）' : '') + '</div>' +
      '<div class="ranking-value">' + valStr + '</div>' +
      '</div>';
  });
  listEl.innerHTML = html;
}

  return '';

function calcAchievementBonuses() {
  let totalPointsMul = 1;
  let totalDropBonus = 0;
  let totalHintExtra = 0;
  gameState.unlockedAchievements.forEach(id => {
    const a = gameState.allAchievements.find(x => x.id === id);
    if (a && a.bonus) {
      if (a.bonus.pointsMul) totalPointsMul *= a.bonus.pointsMul;
      if (a.bonus.dropBonus) totalDropBonus += a.bonus.dropBonus;
      if (a.bonus.hintExtra) totalHintExtra += a.bonus.hintExtra;
    }
  });
  return { totalPointsMul, totalDropBonus, totalHintExtra };
}

function calcPetBattleBonus() {
  try {
    const petStateStr = localStorage.getItem('petSystemStateV2_' + (gameState.studentId || ''));
    if (!petStateStr) return { pointsMul: 1, critChance: 0, critBonus: 0, totalPets: 0, petNames: [] };
    const petState = JSON.parse(petStateStr);
    const battlePets = petState.battlePets || [];
    let totalPointsMul = 1, totalCritChance = 0, totalCritDmg = 0, totalPets = 0, petNames = [];
    battlePets.forEach(petId => {
      if (!petId) return;
      const petInfo = petState.pets && petState.pets[petId];
      if (!petInfo) return;
      const petData = PETS_DATA.find(p => p.id == petId);
      if (!petData) return;
      const lv = petInfo.level || 1, mult = 1 + (lv - 1) * 0.1, multSp = 1 + (lv - 1) * 0.05;
      const strVal = Math.floor(petData.baseStats.str * mult), intVal = Math.floor(petData.baseStats.int * mult), agiVal = Math.floor(petData.baseStats.agi * mult);
      totalPointsMul += (strVal + intVal + agiVal) / 100;
      totalCritChance += Math.floor(petData.specialStats.critRate * multSp);
      totalCritDmg += Math.floor(petData.specialStats.critDmg * multSp);
      petInfo.talents && petInfo.talents.forEach(t => {
        if (t.stat === 'str' || t.stat === 'int' || t.stat === 'agi') totalPointsMul += t.value / 100;
        if (t.stat === 'critRate') totalCritChance += t.value;
        if (t.stat === 'critDmg') totalCritDmg += t.value;
        if (t.stat === 'all') { totalPointsMul += t.value / 100 * 3; totalCritChance += t.value; }
      });
      totalPets++;
      petNames.push(petData.emoji + petData.name);
    });
    return { pointsMul: totalPointsMul, critChance: totalCritChance, critBonus: totalCritDmg, totalPets, petNames };
  } catch (e) { return { pointsMul: 1, critChance: 0, critBonus: 0, totalPets: 0, petNames: [] }; }
}

function renderAchievementGrid() {
  const grid = document.getElementById('achievementGrid');
  const bonuses = calcAchievementBonuses();
  
  // 更新统计
  document.getElementById('achUnlockedCount').textContent = `${gameState.unlockedAchievements.length}/${gameState.allAchievements.length}`;
  document.getElementById('achPointsBonus').textContent = `×${bonuses.totalPointsMul.toFixed(2)}`;
  document.getElementById('achDropBonus').textContent = `+${Math.round(bonuses.totalDropBonus * 100)}%`;
  
  // 过滤成就
  let achievements = gameState.allAchievements;
  if (achievementFilter === 'unlocked') {
    achievements = achievements.filter(a => gameState.unlockedAchievements.includes(a.id));
  } else if (achievementFilter !== 'all') {
    achievements = achievements.filter(a => a.tier === achievementFilter);
  }
  
  // 按难度排序
  const tierOrder = { '⭐': 0, '⭐⭐': 1, '⭐⭐⭐': 2, '👑': 3, '🏆': 4 };
  achievements.sort((a, b) => (tierOrder[a.tier] || 0) - (tierOrder[b.tier] || 0));
  
  grid.innerHTML = achievements.map(a => {
    const unlocked = gameState.unlockedAchievements.includes(a.id);
    const tierCls = getTierClass(a.tier);
    return `<div class="ach-item ${unlocked ? 'unlocked ' + tierCls : 'locked'}">
      <div class="ach-icon">${unlocked ? a.icon : '🔒'}</div>
      <div class="ach-name">${unlocked ? a.name : '???'}</div>
      <div class="ach-tier">${a.tier}</div>
      <div class="ach-desc">${a.desc}</div>
      ${unlocked ? `<div class="ach-bonus">${getAchievementBonusText(a.bonus)}</div>` : '<div class="ach-locked-text">未解锁</div>'}
    </div>`;
  }).join('');
}

function showDanmaku(type, message) {
  const container = document.getElementById('danmakuContainer');
  if (!container) return;
  const trackNum = Math.floor(Math.random() * 3) + 1;
  const track = document.createElement('div');
  track.className = 'danmaku-track r' + trackNum;
  const item = document.createElement('div');
  item.className = 'danmaku-item ' + (type || '');
  var icon = '🔔';
  if (type === 'achievement') icon = '🏆';
  else if (type === 'equipment-legendary') icon = '🌟';
  else if (type === 'equipment-mythic') icon = '👑';
  item.innerHTML = '<span class="dm-icon">' + icon + '</span>' + message;
  var duration = Math.max(10, Math.min(18, 8 + message.length / 3));
  item.style.animationDuration = duration + 's';
  track.appendChild(item);
  container.appendChild(track);
  setTimeout(function() { if (track.parentNode) track.remove(); }, (duration + 1) * 1000);
}
var _origPost = postNotification;
postNotification = function(type, message) {
  showDanmaku(type, message);
  return _origPost(type, message);
};

// Fetch student name from cloud
async function fetchStudentName(studentId) {
  if (!studentId) return '';
  try {
    const res = await fetch(API_BASE + '/student/info/' + studentId);
    if (!res.ok) return '';
    const data = await res.json();
    return data.name || '';
  } catch(e) { return ''; }
}

async function loadWrongQuestionsFromCloud() {
  if (gameState.isGuest || !gameState.studentId) return;
  try {
    const res = await fetch(API_BASE + '/student/info/' + gameState.studentId);
    if (!res.ok) return;
    const d = await res.json();
    if (d.wrongQuestions && Array.isArray(d.wrongQuestions)) {
      if (!gameState.wrongQuestions) gameState.wrongQuestions = [];
      for (const wq of d.wrongQuestions) {
        if (wq && !gameState.wrongQuestions.find(function(x) { return x.questionId === wq || x.question === wq; })) {
          gameState.wrongQuestions.push({ questionId: wq, question: wq, timestamp: Date.now() });
        }
      }
    }
  } catch(e) { console.error('Failed to load wrong questions:', e); }
}

const NOTIFY_API = API_BASE + '/notifications';

async function fetchNotifications() {
  try {
    const res = await fetch(NOTIFY_API);
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.error('获取公告失败:', e);
    return [];
  }
}

async function postNotification(type, message) {
  if (gameState.isGuest) return;
  try {
    await fetch(NOTIFY_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, message, studentId: gameState.studentId || 'unknown', timestamp: Date.now() })
    });
  } catch (e) {
    console.error('发布公告失败:', e);
  }
}

function renderNotifications(notifications, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (!notifications || notifications.length === 0) {
    container.innerHTML = '<div class="notify-empty">暂无公告</div>';
    return;
  }
  const recent = notifications.slice(0, 10);
  let html = '';
  for (const n of recent) {
    const cls = n.type || '';
    const time = n.timestamp ? new Date(n.timestamp).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    html += '<div class="notify-item ' + cls + '"><div class="notify-msg">' + n.message + '</div><div class="notify-time">' + time + '</div></div>';
  }
  container.innerHTML = html;
}

function updateNotifyBadge(count) {
  const badge = document.getElementById('notifyBadge');
  if (badge) {
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : count;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }
}

let lastNotifyCount = 0;

async function refreshNotifications() {
  const all = await fetchNotifications();
  const unread = all.filter(function(n) { return !n.read; });
  updateNotifyBadge(unread.length);
  renderNotifications(all, 'notifyList');
  if (!gameState.isGuest && document.getElementById('homeNotices')) {
    const hn = document.getElementById('homeNotices');
    if (all.length > 0) {
      hn.style.display = 'block';
      renderNotifications(all.slice(0, 5), 'homeNoticesList');
    }
  }
}

function showNoticeIfActive() {

  var now = new Date();
  var expiry = new Date(2026, 4, 10, 23, 0, 0); // May 10, 23:00

      document.getElementById('noticeOverlay').classList.add('show');

}
function closeNotice() {
  document.getElementById('noticeOverlay').classList.remove('show');

function toggleNotifyPanel() {
  const panel = document.getElementById('notifyPanel');
  const overlay = document.getElementById('notifyOverlay');
  panel.classList.toggle('show');
  overlay.classList.toggle('show');
  if (panel.classList.contains('show')) refreshNotifications();
}
