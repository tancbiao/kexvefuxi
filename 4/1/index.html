<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四年级上学期 · 科学趣味闯关</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "微软雅黑", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 40px;
  }
  .icon { font-size: 80px; margin-bottom: 20px; }
  h1 { font-size: 2em; margin-bottom: 15px; }
  .coming-soon {
    background: rgba(255,255,255,0.1);
    border: 2px dashed rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 40px;
    margin-top: 30px;
    max-width: 500px;
  }
  .badge {
    background: #ff9800;
    color: #000;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.9em;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 15px;
  }
  .back-link {
    margin-top: 30px;
    display: inline-block;
    color: rgba(0,212,255,0.8);
    text-decoration: none;
    font-size: 1em;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">🚧</div>
  <h1>四年级上学期</h1>
  <div class="coming-soon">
    <div class="badge">施工中</div>
    <p>四年级上册科学复习内容正在制作中</p>
    <p style="margin-top:10px;color:rgba(255,255,255,0.5);font-size:0.9em;">预计完成时间：近期上线</p>
  </div>
  <a class="back-link" href="../">← 返回年级选择</a>
</div>
</body>
</html>
