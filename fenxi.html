<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>成绩分析系统 · 已搬迁</title>
<!-- JS 被禁用时，2 秒后仍然自动跳转 -->
<meta http-equiv="refresh" content="2;url=https://xixitime.cn/fenxi/">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F7F8F4;color:#2F3A34;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{width:min(90vw,420px);padding:36px 32px;text-align:center;background:#fff;
       border:1px solid #E7EBE4;border-radius:20px;box-shadow:0 8px 28px rgba(47,58,52,.06)}
  .ic{font-size:44px;line-height:1;margin-bottom:14px}
  h1{font-size:1.15em;margin:0 0 10px;font-weight:600}
  p{font-size:.9em;color:#7A857E;line-height:1.7;margin:0 0 20px}
  a.btn{display:inline-block;padding:11px 26px;border-radius:10px;text-decoration:none;
        background:#3B6D11;color:#fff;font-size:.92em;font-weight:600}
  a.btn:hover{background:#2F580D}
  .old{margin:22px 0 0;padding-top:16px;border-top:1px solid #EEF1EB;font-size:.78em}
  .old a{color:#8A958E}
</style>
<script>
(function(){
  // 保留原地址上的查询参数与锚点，避免旧链接带参时丢失
  var target = 'https://xixitime.cn/fenxi/' + (location.search || '') + (location.hash || '');
  location.replace(target);
})();
</script>
</head>
<body>
  <div class="box">
    <div class="ic">📈</div>
    <h1>成绩分析系统已搬到西习时光</h1>
    <p>新地址境内加速，且一次验证后长期免密。<br>正在为你转过去…</p>
    <a class="btn" href="https://xixitime.cn/fenxi/">没自动跳转？点这里 →</a>
    <p class="old">应急备用：<a href="/fenxi_legacy.html">旧版快照（kexvefuxi.cn 存档）</a></p>
  </div>
</body>
</html>
