<style>

  .opt.answer { border:3px solid #2ecc71; box-shadow:0 0 12px rgba(46,204,113,0.4); }
  .opt.answer .opt-label { color:#2ecc71; }
  .badge { display:inline-block; padding:4px 12px; border-radius:12px; font-size:13px; font-weight:700; background:rgba(46,204,113,0.15); color:#2ecc71; border:1px solid rgba(46,204,113,0.4); margin-bottom:10px; }
