<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学大对战 · 五年级下册</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "微软雅黑", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 50%, #24243e 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }

  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: float 15s infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 100%;
    margin: 0 auto;
    padding: 10px 15px;
  }

  /* ========== 顶部状态栏 ========== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .player-score {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .player-badge {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
  }
  .p1-badge { background: linear-gradient(135deg, #ff6b6b, #ff9f43); }
  .p2-badge { background: linear-gradient(135deg, #4ecdc4, #45b7d1); }

  .score-info { text-align: center; }
  .score-num { font-size: 2em; font-weight: 900; line-height: 1; }
  .p1-score { color: #ff9f43; }
  .p2-score { color: #4ecdc4; }
  .player-name { font-size: 0.85em; color: rgba(255,255,255,0.6); }
  .player-id { font-size: 0.7em; color: rgba(255,255,255,0.35); }

  .vs-center {
    text-align: center;
    flex: 1;
  }
  .vs-logo {
    font-size: 1.5em;
    font-weight: 900;
    background: linear-gradient(90deg, #ff6b6b, #fff, #4ecdc4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .progress-text {
    font-size: 0.8em;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .timer-bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #4ecdc4);
    border-radius: 3px;
    transition: width 0.2s linear;
  }

  .bet-display {
    text-align: center;
    font-size: 0.8em;
    color: #ffd93d;
    margin-top: 4px;
    font-weight: bold;
  }

  /* ========== 主对战区 ========== */
  .battle-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 10px;
  }

  .player-panel {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 15px;
    border: 2px solid rgba(255,255,255,0.1);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .player-panel.p1 {
    border-color: rgba(255,107,107,0.3);
    background: linear-gradient(180deg, rgba(255,107,107,0.08), rgba(255,107,107,0.02));
  }
  .player-panel.p2 {
    border-color: rgba(78,205,196,0.3);
    background: linear-gradient(180deg, rgba(78,205,196,0.08), rgba(78,205,196,0.02));
  }
  .player-panel.winner {
    animation: winnerPulse 0.5s ease;
    border-color: #ffd700;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
  }
  @keyframes winnerPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .panel-title {
    font-size: 1em;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .p1 .panel-title { color: #ff9f43; }
  .p2 .panel-title { color: #4ecdc4; }

  .streak-badge {
    background: rgba(255,215,0,0.2);
    color: #ffd700;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 0.75em;
    font-weight: bold;
  }
  .streak-badge.hidden { visibility: hidden; }

  .q-status { font-size: 0.75em; color: rgba(255,255,255,0.4); margin-bottom: 8px; min-height: 18px; }
  .q-status.correct { color: #4caf50; }
  .q-status.wrong { color: #f44336; }
  .q-status.waiting { color: #ffd93d; }

  /* 选项 */
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .option-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 10px;
    color: #fff;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    min-height: 50px;
  }
  .option-btn:hover:not(.disabled):not(.correct):not(.wrong) {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.4);
  }
  .option-btn:active:not(.disabled) { transform: scale(0.97); }
  .option-btn.correct { background: rgba(76,175,80,0.3); border-color: #4caf50; color: #4caf50; animation: correctPop 0.4s ease; }
  .option-btn.wrong { background: rgba(244,67,54,0.3); border-color: #f44336; color: #f44336; animation: wrongShake 0.4s ease; }
  .option-btn.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* 中心区域 */
  .center-zone { margin-bottom: 10px; }
  .question-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px 25px;
    text-align: center;
    margin-bottom: 12px;
  }
  .unit-label {
    display: inline-block;
    background: rgba(124,58,237,0.3);
    border: 1px solid rgba(124,58,237,0.5);
    color: #a78bfa;
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 0.8em;
    margin-bottom: 10px;
  }
  .question-text { font-size: 1.3em; font-weight: bold; line-height: 1.6; }

  /* 计时 */
  .countdown-overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 12px 25px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .countdown-num {
    font-size: 2.5em;
    font-weight: 900;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.3s;
  }
  .countdown-num.p1-bg { background: rgba(255,107,107,0.3); color: #ff9f43; }
  .countdown-num.p2-bg { background: rgba(78,205,196,0.3); color: #4ecdc4; }
  .countdown-label { font-size: 0.8em; color: rgba(255,255,255,0.5); }
  .countdown-vs { font-size: 1.5em; font-weight: 900; color: rgba(255,255,255,0.3); }

  /* 得分动画 */
  .score-flash {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 1.5em;
    font-weight: 900;
    pointer-events: none;
    animation: scoreFlash 0.6s ease forwards;
  }
  .score-flash.p1 { color: #ff9f43; }
  .score-flash.p2 { color: #4ecdc4; }
  .score-flash.minus { color: #f44336; }
  @keyframes scoreFlash {
    0% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(0.8); }
  }

  /* ========== 开始/结束画面 ========== */
  .screen-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10,10,30,0.95);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow-y: auto;
  }
  .screen-overlay.hidden { display: none; }

  .screen-logo { font-size: 80px; margin-bottom: 15px; }
  .screen-title {
    font-size: 2.5em;
    font-weight: 900;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #4ecdc4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .screen-subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 1.1em;
    margin-bottom: 25px;
    max-width: 500px;
  }

  /* 学号输入区 */
  .id-inputs {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .id-input-group { text-align: center; }
  .id-input-group label {
    display: block;
    font-size: 0.9em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }
  .id-input {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 1.1em;
    font-family: inherit;
    text-align: center;
    width: 160px;
    outline: none;
    transition: border-color 0.3s;
  }
  .p1-input:focus { border-color: #ff9f43; }
  .p2-input:focus { border-color: #4ecdc4; }
  .id-input::placeholder { color: rgba(255,255,255,0.3); }
  .id-hint {
    font-size: 0.75em;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }

  /* ========== 分值选择 ========== */
  .bet-section {
    margin-bottom: 25px;
    width: 100%;
    max-width: 480px;
  }
  .bet-title {
    font-size: 1em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 12px;
    text-align: center;
  }
  .bet-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .bet-btn {
    padding: 12px 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
    font-size: 0.9em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.3;
  }
  .bet-btn:hover:not(.selected) { border-color: rgba(255,255,255,0.35); color: #fff; }
  .bet-btn.selected {
    border-color: #ffd93d;
    background: rgba(255,217,61,0.15);
    color: #ffd93d;
    font-weight: bold;
  }
  .bet-btn .bet-icon { font-size: 1.3em; display: block; margin-bottom: 3px; }
  .bet-btn.selected .bet-icon { filter: drop-shadow(0 0 4px #ffd93d); }

  .bet-label-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 0.85em;
    color: rgba(255,255,255,0.4);
  }
  #betLabel { color: #ffd93d; font-weight: bold; }

  .custom-bet-input {
    display: none;
    margin-top: 10px;
    justify-content: center;
  }
  .custom-bet-input.show { display: flex; }
  .custom-bet-field {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,217,61,0.4);
    border-radius: 12px;
    padding: 10px 16px;
    color: #ffd93d;
    font-size: 1.1em;
    font-family: inherit;
    text-align: center;
    width: 120px;
    outline: none;
  }
  .custom-bet-field:focus { border-color: #ffd93d; }
  .custom-bet-field::placeholder { color: rgba(255,255,255,0.3); }

  /* ========== 范围选择 ========== */
  .scope-section {
    margin-bottom: 25px;
    width: 100%;
    max-width: 480px;
  }
  .scope-title {
    font-size: 1em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 12px;
    text-align: center;
  }
  .scope-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .scope-btn {
    padding: 12px 8px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
    font-size: 0.85em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.3;
  }
  .scope-btn:hover:not(.selected) { border-color: rgba(255,255,255,0.35); color: #fff; }
  .scope-btn.selected {
    border-color: #a78bfa;
    background: rgba(167,139,250,0.15);
    color: #a78bfa;
    font-weight: bold;
  }
  .scope-btn .scope-icon { font-size: 1.4em; display: block; margin-bottom: 3px; }
  .scope-btn.selected .scope-icon { filter: drop-shadow(0 0 4px #a78bfa); }

  .scope-label-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 0.85em;
    color: rgba(255,255,255,0.4);
  }
  #scopeLabel { color: #a78bfa; font-weight: bold; }

  .start-btn {
    background: linear-gradient(135deg, #ff6b6b, #ffd93d);
    border: none;
    color: #000;
    padding: 16px 50px;
    border-radius: 30px;
    font-size: 1.3em;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(255,107,107,0.4);
  }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(255,107,107,0.6); }

  /* 结果画面 */
  .result-scores { display: flex; gap: 40px; margin: 20px 0 20px; justify-content: center; flex-wrap: wrap; }
  .result-player {
    text-align: center;
    padding: 20px 30px;
    border-radius: 20px;
    min-width: 150px;
  }
  .result-player.p1 { background: rgba(255,107,107,0.15); border: 2px solid rgba(255,107,107,0.3); }
  .result-player.p2 { background: rgba(78,205,196,0.15); border: 2px solid rgba(78,205,196,0.3); }
  .result-player.winner-result { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3); }

  .result-icon { font-size: 50px; margin-bottom: 8px; }
  .result-score { font-size: 3em; font-weight: 900; line-height: 1; }
  .p1-result-score { color: #ff9f43; }
  .p2-result-score { color: #4ecdc4; }
  .result-label { font-size: 0.85em; color: rgba(255,255,255,0.5); margin-top: 4px; }
  .result-id { font-size: 0.75em; color: rgba(255,255,255,0.3); }
  .winner-crown { font-size: 2em; margin-top: 5px; }

  .result-bet-info {
    font-size: 0.95em;
    color: #ffd93d;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .result-points-change {
    font-size: 0.9em;
    margin-top: 6px;
  }
  .points-plus { color: #4caf50; }
  .points-minus { color: #f44336; }

  .result-draw .screen-title { background: linear-gradient(90deg, #ffd93d, #fff); -webkit-background-clip: text; background-clip: text; }

  /* 成就弹出 */
  .achievement-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.9);
    border: 2px solid #ffd700;
    border-radius: 20px;
    padding: 30px 40px;
    text-align: center;
    z-index: 300;
    opacity: 0;
    transition: all 0.5s;
    pointer-events: none;
  }
  .achievement-popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .achievement-popup .ach-icon { font-size: 60px; margin-bottom: 10px; }
  .achievement-popup .ach-name { font-size: 1.5em; font-weight: 900; color: #ffd700; margin-bottom: 5px; }
  .achievement-popup .ach-desc { font-size: 1em; color: rgba(255,255,255,0.6); }

  .restart-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 14px 40px;
    border-radius: 30px;
    font-size: 1.1em;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    margin: 5px;
  }
  .restart-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }

  /* 成就面板 */
  .achievements-panel {
    margin-top: 15px;
    padding: 15px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    max-width: 500px;
    width: 100%;
  }
  .achievements-title {
    font-size: 0.9em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
    text-align: center;
  }
  .achievements-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .ach-item {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 0.8em;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ach-item.unlocked {
    border-color: rgba(255,215,0,0.4);
    background: rgba(255,215,0,0.1);
    color: #ffd700;
  }
  .ach-item.locked {
    opacity: 0.35;
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .battle-area { grid-template-columns: 1fr; }
    .question-text { font-size: 1.1em; }
    .top-bar { flex-wrap: wrap; gap: 10px; }
    .vs-center { order: -1; width: 100%; }
    .screen-title { font-size: 2em; }
    .result-scores { gap: 20px; }
    .result-player { min-width: 120px; padding: 15px 20px; }
  }
  @media (max-width: 500px) {
    .scope-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .scope-btn { font-size: 0.75em; padding: 10px 4px; }
    .scope-btn .scope-icon { font-size: 1.2em; }
    .bet-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .bet-btn { font-size: 0.8em; padding: 10px 4px; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<!-- ========== 成就弹出 ========== -->
<div class="achievement-popup" id="achPopup">
  <div class="ach-icon" id="achPopupIcon">🏆</div>
  <div class="ach-name" id="achPopupName">成就解锁！</div>
  <div class="ach-desc" id="achPopupDesc"></div>
</div>

<!-- ========== 开始画面 ========== -->
<div class="screen-overlay" id="startScreen">
  <div class="screen-logo">⚔️</div>
  <div class="screen-title">科学大对战</div>
  <div class="screen-subtitle">五年级下册 · 双人实时对战<br>同一道题，谁先答对谁得分！</div>

  <!-- 学号输入 -->
  <div class="id-inputs">
    <div class="id-input-group">
      <label>🔴 玩家1（红方）</label>
      <input class="id-input p1-input" id="p1IdInput" type="text" placeholder="输入8位学号" maxlength="8" inputmode="numeric">
      <div class="id-hint">留空则显示"玩家1"</div>
    </div>
    <div class="id-input-group">
      <label>🔵 玩家2（蓝方）</label>
      <input class="id-input p2-input" id="p2IdInput" type="text" placeholder="输入8位学号" maxlength="8" inputmode="numeric">
      <div class="id-hint">留空则显示"玩家2"</div>
    </div>
  </div>

  <!-- 对决分值 -->
  <div class="bet-section">
    <div class="bet-title">💰 对决分值</div>
    <div class="bet-label-bar">
      <span>当前下注：</span>

<script src="../../data/5-2.js"></script>
<script>
// ========== 常量 ==========
const TOTAL_QUESTIONS = 12;
const TIME_PER_QUESTION = 12;
const POINTS_CORRECT = 10;
const POINTS_SPEED = 5;
const SPEED_BONUS_THRESHOLD = 6;
const STORAGE_KEY = 'kexvefuxi_5_vs';

// ========== 成就定义 ==========
const ALL_ACHIEVEMENTS = [
  { id: 'first_win', icon: '🏆', name: '初战告捷', desc: '首次赢得对战' },
  { id: 'streak_3', icon: '🔥', name: '三连胜', desc: '单局连续答对3题' },
  { id: 'streak_5', icon: '💥', name: '五连胜', desc: '单局连续答对5题' },
  { id: 'streak_7', icon: '🌟', name: '七星连珠', desc: '单局连续答对7题' },
  { id: 'perfect', icon: '💯', name: '满分答卷', desc: '单局全部答对' },
  { id: 'speed_demon', icon: '⚡', name: '闪电快手', desc: '6秒内答对5题' },
  { id: 'comeback', icon: '🔄', name: '逆转乾坤', desc: '落后20分以上仍获胜' },
  { id: 'veteran', icon: '🎖️', name: '身经百战', desc: '累计对战10局' },
  { id: 'champion', icon: '👑', name: '常胜将军', desc: '累计获胜5局' },
  { id: 'high_roller', icon: '💎', name: '豪赌客', desc: '以100分分值赢下对战' },
  { id: 'unit1_master', icon: '🌉', name: '桥梁专家', desc: '在桥梁单元取得胜利' },
  { id: 'unit2_master', icon: '🔬', name: '微观探索者', desc: '在微观生命世界取得胜利' }
];

// ========== 游戏状态 ==========
let G = {
  p1: { id:'', name:'玩家1', score:0, streak:0, answered:false, correct:false, speedCount:0 },
  p2: { id:'', name:'玩家2', score:0, streak:0, answered:false, correct:false, speedCount:0 },
  qIndex: 0,
  qList: [],
  timer: null,
  timeLeft: TIME_PER_QUESTION,
  done: false,
  scope: 'all',
  bet: 0,           // 对决分值
  maxDeficit: 0     // 最大落后分数（用于逆转成就）
};

// ========== 玩家数据存储 ==========
function loadPlayerData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch(e) { return {}; }
}

function savePlayerData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

function getPlayerRecord(id) {
  const data = loadPlayerData();
  return data[id] || { totalPoints: 0, wins: 0, losses: 0, draws: 0, games: 0, achievements: [] };
}

function savePlayerRecord(id, record) {
  const data = loadPlayerData();
  data[id] = record;
  savePlayerData(data);
}

// ========== 分值选择 ==========
const BET_MAP = {
  0:    { label: '🎮 休闲模式（0分）', icon: '🎮' },
  10:   { label: '🪙 对决 10分', icon: '🪙' },
  50:   { label: '💎 对决 50分', icon: '💎' },
  100:  { label: '👑 对决 100分', icon: '👑' },
  custom: { label: '✏️ 自定义分值', icon: '✏️' }
};

function setBet(val, btn) {
  G.bet = val;
  document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  const customRow = document.getElementById('customBetRow');
  if (val === 'custom') {
    customRow.classList.add('show');
    updateCustomBet();
  } else {
    customRow.classList.remove('show');
    document.getElementById('betLabel').textContent = BET_MAP[val].label;
  }
}

function updateCustomBet() {
  const v = parseInt(document.getElementById('customBetInput').value) || 0;
  if (v > 0) {
    document.getElementById('betLabel').textContent = '✏️ 对决 ' + v + ' 分';
  } else {
    document.getElementById('betLabel').textContent = '✏️ 请输入分值';
  }
}

function getBetValue() {
  if (G.bet === 'custom') {
    return Math.max(0, parseInt(document.getElementById('customBetInput').value) || 0);
  }
  return G.bet;
}

// ========== 范围选择 ==========
const SCOPE_MAP = {
  'all':  { label: '🌟 全册书', color: '#ffd93d' },
  1:      { label: '🌉 身边的桥梁', color: '#4ade80' },
  2:      { label: '🔬 微观生命世界', color: '#c084fc' }
};

function setScope(val, btn) {
  G.scope = val;
  document.querySelectorAll('.scope-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('scopeLabel').textContent = SCOPE_MAP[val].label;
}

// ========== 初始化 ==========
function init() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100+'%';
    p.style.animationDelay = Math.random()*15+'s';
    p.style.animationDuration = (10+Math.random()*10)+'s';
    c.appendChild(p);
  }
}

// ========== 生成题目列表 ==========
function genList() {
  const bank = window.QUESTION_BANK_5_2;
  if (!bank) { alert('题库加载失败，请刷新页面'); return []; }

  const scope = G.scope;
  const q = [];
  const units = scope === 'all' ? [1, 2] : [scope];

  units.forEach(unit => {
    const unitData = bank[unit];
    if (!unitData) return;
    const lessons = unitData.lessons;
    for (const lessonKey in lessons) {
      const lesson = lessons[lessonKey];
      // 合并所有难度
      ['basic', 'advance', 'challenge'].forEach(diff => {
        if (lesson[diff]) {
          lesson[diff].forEach(item => {
            // 只取选择题和判断题，跳过复杂类型
            q.push({
              q: item.q,
              opts: item.options || item.opts,
              answer: item.answer,
              type: item.type || 'choice',
              answer_tf: item.answer_tf,
              hint: item.hint,
              unit: unit,
              lessonName: lesson.name
            });
          });
        }
      });
    }
  });

  // 随机打乱
  return q.sort(() => Math.random() - 0.5).slice(0, TOTAL_QUESTIONS);
}

// ========== 开始游戏 ==========
function startGame() {
  const p1Id = document.getElementById('p1IdInput').value.trim();
  const p2Id = document.getElementById('p2IdInput').value.trim();

  G.p1.id = p1Id;
  G.p1.name = p1Id || '玩家1';
  G.p2.id = p2Id;
  G.p2.name = p2Id || '玩家2';

  G.p1.score = G.p2.score = G.p1.streak = G.p2.streak = G.qIndex = 0;
  G.p1.correct = G.p2.correct = false;
  G.p1.speedCount = G.p2.speedCount = 0;
  G.maxDeficit = 0;
  G.qList = genList();

  if (G.qList.length === 0) {
    alert('没有找到题目，请检查题库');
    return;
  }

  // 更新显示名称
  ['p1Name','p2Name','p1PanelName','p2PanelName'].forEach(id => {
    document.getElementById(id).textContent = id.startsWith('p1') ? G.p1.name : G.p2.name;
  });

  // 显示学号
  document.getElementById('p1IdDisplay').textContent = G.p1.id ? '学号: ' + G.p1.id : '';
  document.getElementById('p2IdDisplay').textContent = G.p2.id ? '学号: ' + G.p2.id : '';

  // 显示分值
  const bv = getBetValue();
  document.getElementById('betDisplay').textContent = bv > 0 ? ('💰 本局分值: ' + bv) : '';

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameContainer').style.display = '';
  startRound();
}

// ========== 单轮逻辑 ==========
function startRound() {
  G.done = false;
  G.p1.answered = G.p1.correct = false;
  G.p2.answered = G.p2.correct = false;
  G.timeLeft = TIME_PER_QUESTION;

  if (G.qIndex >= G.qList.length) {
    clearInterval(G.timer);
    setTimeout(()=>showResult(), 500);
    return;
  }

  const q = G.qList[G.qIndex];
  document.getElementById('progressText').textContent = '第 ' + (G.qIndex+1) + ' / ' + Math.min(TOTAL_QUESTIONS, G.qList.length) + ' 题';

  const unitNames = { 1: '身边的桥梁', 2: '微观生命世界' };
  const scopeEmoji = { 1: '🌉', 2: '🔬' };
  const scopeText = G.scope === 'all'
    ? '📖 全册书'
    : (scopeEmoji[q.unit] + ' ' + unitNames[q.unit]);
  document.getElementById('unitLabel').textContent = scopeText;
  document.getElementById('questionText').textContent = q.q;

  document.getElementById('p1Status').textContent = '等待回答...';
  document.getElementById('p1Status').className = 'q-status waiting';
  document.getElementById('p2Status').textContent = '等待回答...';
  document.getElementById('p2Status').className = 'q-status waiting';
  document.getElementById('p1Streak').classList.add('hidden');
  document.getElementById('p2Streak').classList.add('hidden');
  document.getElementById('p1Panel').classList.remove('winner');
  document.getElementById('p2Panel').classList.remove('winner');

  renderOpts('p1', q);
  renderOpts('p2', q);

  clearInterval(G.timer);
  G.timer = setInterval(() => {
    G.timeLeft -= 0.2;
    const pct = Math.max(0, (G.timeLeft/TIME_PER_QUESTION)*100);
    document.getElementById('timerFill').style.width = pct+'%';
    const t = Math.ceil(Math.max(0,G.timeLeft));
    document.getElementById('p1Timer').textContent = t;
    document.getElementById('p2Timer').textContent = t;
    if (G.timeLeft <= 0) {
      clearInterval(G.timer);
      if (!G.done) roundEnd();
    }
  }, 200);
}

function renderOpts(side, q) {
  const c = document.getElementById(side+'Options');
  const isJudge = q.type === 'truefalse' || q.type === 'tf' || (q.opts && q.opts.length === 2 && (q.opts[0] === '√' || q.opts[0] === '✓'));
  if (isJudge) {
    c.innerHTML = '<div class="tf-buttons">' +
      '<button class="tf-btn" id="'+side+'-0" onclick="ans(\''+side+'\',0)">✅ 正确</button>' +
      '<button class="tf-btn" id="'+side+'-1" onclick="ans(\''+side+'\',1)">❌ 错误</button>' +
      '</div>';
  } else {
    c.innerHTML = '<div class="options-grid">' +
      (q.opts||[]).map((opt,i) => '<button class="option-btn" id="'+side+'-'+i+'" onclick="ans(\''+side+'\','+i+')">'+opt+'</button>').join('') +
      '</div>';
  }
}

// ========== 答题 ==========
function ans(side, idx) {
  if (G.done) return;
  const p = G[side];
  if (p.answered) return;
  const q = G.qList[G.qIndex];
  p.answered = true;

  // 判断正确性
  let ok = false;
  const isJudge = q.type === 'truefalse' || q.type === 'tf' || (q.opts && q.opts.length === 2 && (q.opts[0] === '√' || q.opts[0] === '✓'));
  if (isJudge) {
    // 判断题：answer 可以是 0/1(数字) 或 true/false(布尔)
    let ansVal = q.answer;
    if (typeof ansVal === 'boolean') ansVal = ansVal ? 0 : 1;
    ok = (idx === ansVal);
  } else {
    // 选择题
    ok = idx === q.answer;
  }
  p.correct = ok;

  // 禁用按钮
  const allBtns = document.querySelectorAll('#'+side+'Options .option-btn, #'+side+'Options .tf-btn');
  allBtns.forEach(b => b.classList.add('disabled'));

  const myBtn = document.getElementById(side+'-'+idx);
  if (ok) {
    myBtn.classList.add('correct');
    document.getElementById(side+'Status').textContent = '✅ 正确！';
    document.getElementById(side+'Status').className = 'q-status correct';
    let pts = POINTS_CORRECT + (G.timeLeft > SPEED_BONUS_THRESHOLD ? POINTS_SPEED : 0);
    p.score += pts;
    p.streak++;
    if (G.timeLeft > SPEED_BONUS_THRESHOLD) p.speedCount++;
    showFlash(side, '+'+pts);
    if (p.streak >= 2) {
      const sb = document.getElementById(side+'Streak');
      sb.textContent = '🔥 '+p.streak+'连胜';
      sb.classList.remove('hidden');
    }
    document.getElementById(side+'Score').textContent = p.score;
    document.getElementById(side+'Panel').classList.add('winner');

    // 对手未答则揭示
    const other = side==='p1'?'p2':'p1';
    if (!G[other].answered) {
      setTimeout(()=>revealOther(other), 600);
    }
  } else {
    myBtn.classList.add('wrong');
    document.getElementById(side+'Status').textContent = '❌ 答错了';
    document.getElementById(side+'Status').className = 'q-status wrong';
    p.streak = 0;
    document.getElementById(side+'Streak').classList.add('hidden');
    // 标出正确答案
    const cb = document.getElementById(side+'-'+q.answer);
    if (cb) cb.classList.add('correct');

    const other = side==='p1'?'p2':'p1';
    if (!G[other].answered) {
      document.getElementById(other+'Status').textContent = '轮到你了！';
      document.getElementById(other+'Status').className = 'q-status waiting';
    }
  }

  // 更新最大落后值
  const deficit = Math.abs(G.p1.score - G.p2.score);
  if (deficit > G.maxDeficit) G.maxDeficit = deficit;

  if (G.p1.answered && G.p2.answered) {
    clearInterval(G.timer);
    setTimeout(()=>roundEnd(), 1200);
  }
}

function revealOther(side) {
  if (G[side].answered || G.done) return;
  G[side].answered = true;
  const q = G.qList[G.qIndex];
  const allBtns = document.querySelectorAll('#'+side+'Options .option-btn, #'+side+'Options .tf-btn');
  allBtns.forEach(b=>b.classList.add('disabled'));
  document.getElementById(side+'Status').textContent = '⏰ 超时！';
  document.getElementById(side+'Status').className = 'q-status wrong';
  G[side].streak = 0;
  document.getElementById(side+'Streak').classList.add('hidden');
  const cb = document.getElementById(side+'-'+q.answer);
  if(cb) cb.classList.add('correct');

  const deficit = Math.abs(G.p1.score - G.p2.score);
  if (deficit > G.maxDeficit) G.maxDeficit = deficit;

  if (G.p1.answered && G.p2.answered) {
    clearInterval(G.timer);
    setTimeout(()=>roundEnd(), 1200);
  }
}

function showFlash(side, text) {
  const panel = document.getElementById(side+'Panel');
  const f = document.createElement('div');
  const isMinus = text.startsWith('-');
  f.className = 'score-flash '+(side==='p1'?'p1':'p2')+(isMinus?' minus':'');
  f.textContent = text;
  panel.appendChild(f);
  setTimeout(()=>f.remove(), 600);
}

// ========== 回合结束 ==========
function roundEnd() {
  if (G.done) return;
  G.done = true;
  clearInterval(G.timer);
  G.qIndex++;
  if (G.qIndex >= TOTAL_QUESTIONS || G.qIndex >= G.qList.length) {
    setTimeout(()=>showResult(), 1500);
  } else {
    setTimeout(()=>startRound(), 1500);
  }
}

// ========== 结果画面 ==========
function showResult() {
  document.getElementById('gameContainer').style.display = 'none';
  const r = document.getElementById('resultScreen');
  r.classList.remove('hidden','result-draw');

  const bv = getBetValue();
  document.getElementById('resultBetInfo').textContent = bv > 0 ? '💰 对决分值: ' + bv + ' 分' : '🎮 休闲模式';

  document.getElementById('resultP1Score').textContent = G.p1.score;
  document.getElementById('resultP2Score').textContent = G.p2.score;
  document.getElementById('resultP1Label').textContent = G.p1.name;
  document.getElementById('resultP2Label').textContent = G.p2.name;
  document.getElementById('resultP1Id').textContent = G.p1.id ? '学号: ' + G.p1.id : '';
  document.getElementById('resultP2Id').textContent = G.p2.id ? '学号: ' + G.p2.id : '';
  document.getElementById('resultP1Crown').textContent = '';
  document.getElementById('resultP2Crown').textContent = '';
  document.getElementById('resultP1').classList.remove('winner-result');
  document.getElementById('resultP2').classList.remove('winner-result');
  document.getElementById('resultP1Points').textContent = '';
  document.getElementById('resultP2Points').textContent = '';
  document.getElementById('resultScope').textContent = '📚 ' + SCOPE_MAP[G.scope].label;

  let winner = null;
  let loser = null;

  if (G.p1.score > G.p2.score) {
    winner = G.p1;
    loser = G.p2;
    document.getElementById('resultIcon').textContent = '🏆';
    document.getElementById('resultTitle').textContent = G.p1.name + ' 获胜！';
    document.getElementById('resultSubtitle').textContent = '红方以 ' + G.p1.score + ' : ' + G.p2.score + ' 领先！';
    document.getElementById('resultP1Crown').textContent = '👑';
    document.getElementById('resultP1').classList.add('winner-result');
  } else if (G.p2.score > G.p1.score) {
    winner = G.p2;
    loser = G.p1;
    document.getElementById('resultIcon').textContent = '🏆';
    document.getElementById('resultTitle').textContent = G.p2.name + ' 获胜！';
    document.getElementById('resultSubtitle').textContent = '蓝方以 ' + G.p2.score + ' : ' + G.p1.score + ' 领先！';
    document.getElementById('resultP2Crown').textContent = '👑';
    document.getElementById('resultP2').classList.add('winner-result');
  } else {
    document.getElementById('resultIcon').textContent = '🤝';
    document.getElementById('resultTitle').textContent = '平局！';
    document.getElementById('resultSubtitle').textContent = '双方得分相同，再来一局分出胜负！';
    r.classList.add('result-draw');
  }

  // 积分变动（只有学号登录且下注>0时才有积分变动）
  if (bv > 0) {
    const p1El = document.getElementById('resultP1Points');
    const p2El = document.getElementById('resultP2Points');

    if (winner && loser) {
      if (winner === G.p1) {
        p1El.innerHTML = '<span class="points-plus">+' + bv + ' 积分</span>';
        p2El.innerHTML = '<span class="points-minus">-' + bv + ' 积分</span>';
      } else {
        p1El.innerHTML = '<span class="points-minus">-' + bv + ' 积分</span>';
        p2El.innerHTML = '<span class="points-plus">+' + bv + ' 积分</span>';
      }
    } else {
      p1El.innerHTML = '<span style="color:rgba(255,255,255,0.4)">±0 积分</span>';
      p2El.innerHTML = '<span style="color:rgba(255,255,255,0.4)">±0 积分</span>';
    }

    // 保存积分到 localStorage
    if (G.p1.id) {
      const rec1 = getPlayerRecord(G.p1.id);
      if (winner === G.p1) { rec1.totalPoints += bv; rec1.wins++; }
      else if (!winner) { rec1.draws++; }
      else { rec1.totalPoints = Math.max(0, rec1.totalPoints - bv); rec1.losses++; }
      rec1.games++;
      checkAndUnlockAchievements(rec1, G.p1, winner === G.p1, winner === null);
      savePlayerRecord(G.p1.id, rec1);
    }
    if (G.p2.id) {
      const rec2 = getPlayerRecord(G.p2.id);
      if (winner === G.p2) { rec2.totalPoints += bv; rec2.wins++; }
      else if (!winner) { rec2.draws++; }
      else { rec2.totalPoints = Math.max(0, rec2.totalPoints - bv); rec2.losses++; }
      rec2.games++;
      checkAndUnlockAchievements(rec2, G.p2, winner === G.p2, winner === null);
      savePlayerRecord(G.p2.id, rec2);
    }
  }

  // 显示成就面板（如果有学号登录）
  showAchievementsPanel();
}

// ========== 成就检测 ==========
function checkAndUnlockAchievements(record, player, isWinner, isDraw) {
  const newAch = [];

  function tryUnlock(id) {
    if (!record.achievements.includes(id)) {
      record.achievements.push(id);
      newAch.push(id);
    }
  }

  // 首次获胜
  if (isWinner && record.wins >= 1) tryUnlock('first_win');

  // 三连胜
  if (player.streak >= 3) tryUnlock('streak_3');
  // 五连胜
  if (player.streak >= 5) tryUnlock('streak_5');
  // 七连胜
  if (player.streak >= 7) tryUnlock('streak_7');

  // 满分
  if (player.score === G.qList.length * (POINTS_CORRECT + POINTS_SPEED) && G.qList.length === TOTAL_QUESTIONS) {
    // 近似满分检测
  }
  const maxPossible = G.qList.length * (POINTS_CORRECT + POINTS_SPEED);
  const correctCount = G.qList.filter((_, i) => {
    // 简化：用分数估算
    return true;
  }).length;
  if (player.score >= G.qList.length * POINTS_CORRECT && player.streak >= G.qList.length) {
    tryUnlock('perfect');
  }

  // 闪电快手
  if (player.speedCount >= 5) tryUnlock('speed_demon');

  // 逆转乾坤
  if (isWinner && G.maxDeficit >= 20) tryUnlock('comeback');

  // 身经百战
  if (record.games >= 10) tryUnlock('veteran');

  // 常胜将军
  if (record.wins >= 5) tryUnlock('champion');

  // 豪赌客
  if (isWinner && getBetValue() >= 100) tryUnlock('high_roller');

  // 单元成就
  if (isWinner && G.scope === 1) tryUnlock('unit1_master');
  if (isWinner && G.scope === 2) tryUnlock('unit2_master');

  // 弹出新成就
  if (newAch.length > 0) {
    showAchievementPopup(newAch[0]);
  }
}

function showAchievementPopup(achId) {
  const ach = ALL_ACHIEVEMENTS.find(a => a.id === achId);
  if (!ach) return;
  const popup = document.getElementById('achPopup');
  document.getElementById('achPopupIcon').textContent = ach.icon;
  document.getElementById('achPopupName').textContent = ach.name;
  document.getElementById('achPopupDesc').textContent = ach.desc;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 2500);
}

function showAchievementsPanel() {
  const panel = document.getElementById('achPanel');
  const list = document.getElementById('achList');
  const ids = [];

  if (G.p1.id) {
    const rec1 = getPlayerRecord(G.p1.id);
    rec1.achievements.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  }
  if (G.p2.id) {
    const rec2 = getPlayerRecord(G.p2.id);
    rec2.achievements.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  }

  if (ids.length === 0) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = '';
  list.innerHTML = ALL_ACHIEVEMENTS.map(ach => {
    const unlocked = ids.includes(ach.id);
    return '<div class="ach-item ' + (unlocked ? 'unlocked' : 'locked') + '">' +
      ach.icon + ' ' + ach.name + '</div>';
  }).join('');
}

// ========== 重开/返回 ==========
function restartGame() {
  G.p1.score = G.p2.score = G.p1.streak = G.p2.streak = G.qIndex = 0;
  G.p1.speedCount = G.p2.speedCount = 0;
  G.maxDeficit = 0;
  G.qList = genList();
  document.getElementById('p1Score').textContent = '0';
  document.getElementById('p2Score').textContent = '0';
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('gameContainer').style.display = '';
  startRound();
}

function backToHome() { window.location.href = '../../'; }
