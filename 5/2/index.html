<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 科学探险家 · 五年级科学趣味闯关</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: "微软雅黑", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }

  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: float 15s infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
  }

  .game-container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 12px 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.1em;
  }
  .status-icon { font-size: 1.3em; }
  .status-value { font-weight: 700; color: #ffd700; }
  .streak-fire { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .screen { display: none; animation: fadeIn 0.4s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-section { text-align: center; padding: 40px 20px; }
  .hero-title {
    font-size: 2.8em;
    font-weight: 900;
    background: linear-gradient(135deg, #ffd700, #ff6b6b, #4ecdc4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .hero-subtitle { font-size: 1.2em; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
  .hero-mascot { font-size: 6em; margin: 20px 0; animation: bounce 2s infinite; }
  
  /* ========== 成就预览 ========== */
  .achievements-section {
    margin-top: 30px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
  }
  .achievements-title { font-size: 1.1em; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
  .achievements-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .achievement-badge {
    background: rgba(255,255,255,0.1);
    padding: 10px 15px;
    border-radius: 12px;
    font-size: 0.9em;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.3s;
  }
  .achievement-badge.unlocked { background: linear-gradient(135deg, #ffd700, #ff8c00); border-color: #ffd700; color: #1a1a2e; }
  .achievement-badge.locked { opacity: 0.4; filter: grayscale(1); }
  .achievement-badge:hover { transform: scale(1.05); }
  
  /* ========== 成就解锁动画 ========== */
  .achievement-unlock {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: none; justify-content: center; align-items: center;
    z-index: 9999;
    animation: fadeIn 0.3s;
  }
  .achievement-unlock.show { display: flex; }
  .achievement-unlock .title { font-weight: 900; font-size: 1.2em; margin-bottom: 10px; }
  .achievement-unlock .icon { font-size: 3em; margin: 15px 0; animation: bounce 0.5s; }
  .achievement-unlock .name { font-weight: 700; color: #ffd700; }
  
  /* ========== 背包弹窗 ========== */
  .backpack-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center;
    z-index: 2000;
    animation: fadeIn 0.3s;
  }
  .backpack-overlay.show { display: flex; }
  .backpack-card {
    background: rgba(20,20,40,0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 30px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    animation: popIn 0.4s;
  }
  .backpack-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .backpack-title { font-size: 1.5em; font-weight: 900; }
  .backpack-close {
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 1.2em; transition: all 0.3s;
  }
  .backpack-close:hover { background: rgba(255,255,255,0.2); }
  .backpack-stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .backpack-stat { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
  .backpack-stat-icon { font-size: 1.5em; }
  .backpack-stat-info { text-align: left; }
  .backpack-stat-label { font-size: 0.75em; color: rgba(255,255,255,0.5); }
  .backpack-stat-value { font-size: 1.2em; font-weight: 700; }
  .backpack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .equip-item { background: rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; text-align: center; border: 2px solid transparent; transition: all 0.3s; cursor: pointer; }
  .equip-item:hover { transform: scale(1.05); }
  .equip-item.common { border-color: #9e9e9e; }
  .equip-item.exquisite { border-color: #4caf50; }
  .equip-item.good { border-color: #2196f3; }
  .equip-item.rare { border-color: #9c27b0; }
  .equip-item.epic { border-color: #e91e63; }
  .equip-item.legendary { border-color: #ffd700; }
  .equip-item.mythic { border-color: #ff5722; }
  .equip-icon { font-size: 2.5em; margin-bottom: 8px; }
  .equip-name { font-weight: 700; font-size: 0.95em; margin-bottom: 4px; }
  .equip-level { font-size: 0.75em; padding: 2px 10px; border-radius: 10px; display: inline-block; margin-bottom: 6px; }
  .equip-level.common { background: #9e9e9e; }
  .equip-level.exquisite { background: #4caf50; }
  .equip-level.good { background: #2196f3; }
  .equip-level.rare { background: #9c27b0; }
  .equip-level.epic { background: #e91e63; }
  .equip-level.legendary { background: #ffd700; color: #1a1a2e; }
  .equip-level.mythic { background: #ff5722; }
  .equip-effect { font-size: 0.8em; color: rgba(255,255,255,0.6); }
  .equip-empty { text-align: center; padding: 40px; color: rgba(255,255,255,0.5); }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  .start-btn {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    font-size: 1.4em;
    font-weight: 900;
    padding: 16px 50px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(255,215,0,0.4);
  }
  .start-btn:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(255,215,0,0.6); }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-top: 20px;
  }
  .level-card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .level-card:hover:not(.locked) {
    transform: translateY(-5px);
    border-color: var(--card-color);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .level-card.completed { border-color: #4ecdc4; background: rgba(78,205,196,0.1); }
  .level-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: var(--card-color);
  }
  .level-icon { font-size: 3em; margin-bottom: 10px; }
  .level-name { font-size: 1.1em; font-weight: 700; margin-bottom: 6px; }
  .level-stars { font-size: 1.4em; margin: 8px 0; }
  .level-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 700;
  }
  .badge-easy { background: #4caf50; color: white; }
  .badge-locked { background: #666; color: #ccc; }

  .unit-title {
    grid-column: 1 / -1;
    font-size: 1.4em;
    font-weight: 900;
    text-align: left;
    padding: 15px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    margin-top: 10px;
  }
  .unit-title span { margin-right: 10px; }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .back-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); }
  .quiz-progress { font-size: 1.1em; color: rgba(255,255,255,0.8); }

  .question-card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .question-type {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85em;
    margin-bottom: 15px;
  }
  .type-choice { background: #2196f3; }
  .type-judge { background: #ff9800; }
  .question-text { font-size: 1.3em; line-height: 1.6; margin-bottom: 25px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 15px 20px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 1.1em;
    text-align: left;
  }
  .option:hover:not(.selected):not(.correct):not(.wrong) {
    background: rgba(255,255,255,0.15);
    border-color: #ffd700;
  }
  .option.correct { border-color: #4caf50; background: rgba(76,175,80,0.3); }
  .option.wrong { border-color: #f44336; background: rgba(244,67,54,0.3); }
  .option.disabled { pointer-events: none; opacity: 0.7; }

  .btn-group { display: flex; gap: 12px; margin-top: 20px; }
  .btn {
    flex: 1;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
  }
  .btn-primary:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(255,215,0,0.4); }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }

  .result-card {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    margin-top: 20px;
  }
  .result-icon { font-size: 5em; margin-bottom: 20px; }
  .result-title { font-size: 2em; font-weight: 900; margin-bottom: 15px; }
  .result-score { font-size: 3em; font-weight: 900; color: #ffd700; margin: 20px 0; }
  .result-stats { display: flex; justify-content: center; gap: 30px; margin: 25px 0; font-size: 1.1em; }
  .stat-item { display: flex; flex-direction: column; gap: 5px; }
  .stat-value { font-size: 1.5em; font-weight: 700; color: #ffd700; }
  .stat-label { color: rgba(255,255,255,0.7); }

  .hint-btn {
    background: linear-gradient(135deg, #9c27b0, #e91e63);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.95em;
    margin-top: 15px;
  }
  .hint-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint-box {
    background: rgba(156,39,176,0.2);
    border: 1px solid #9c27b0;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    font-size: 0.95em;
    display: none;
  }
  .hint-box.show { display: block; }

  .achievement-popup {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    padding: 20px 30px;
    border-radius: 15px;
    font-weight: 700;
    font-size: 1.1em;
    z-index: 200;
    animation: slideIn 0.5s ease;
    box-shadow: 0 10px 40px rgba(255,215,0,0.4);
  }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @media (max-width: 600px) {
    .level-grid { grid-template-columns: 1fr; }
    .hero-title { font-size: 2em; }
    .status-bar { flex-wrap: wrap; gap: 10px; }
    .result-stats { flex-wrap: wrap; }
  }

  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 300;
    justify-content: center;
    align-items: center;
  }
  .overlay.show { display: flex; }
  .login-box {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    border: 2px solid rgba(255,255,255,0.1);
  }
  .login-title { font-size: 1.5em; font-weight: 900; margin-bottom: 25px; }
  .login-input {
    width: 100%;
    padding: 14px 20px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 1.1em;
    text-align: center;
    margin-bottom: 15px;
  }
  .login-input::placeholder { color: rgba(255,255,255,0.5); }
  .login-input:focus { outline: none; border-color: #ffd700; }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    transition: all 0.3s;
  }
  .login-btn:hover { transform: scale(1.02); }
  .guest-btn {
    width: 100%;
    padding: 14px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .guest-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="game-container">
  <div class="status-bar">
    <div class="status-item">
      <span class="status-icon">👤</span>
      <span id="userBadge">游客</span>
    </div>
    <div class="status-item">
      <span class="status-icon">⭐</span>
      <span>积分: <span class="status-value" id="totalPoints">0</span></span>
    </div>
    <div class="status-item">
      <span class="status-icon streak-fire" id="streakIcon">🔥</span>
      <span>连击: <span class="status-value" id="currentStreak">0</span></span>
    </div>
    <div class="status-item">
      <span class="status-icon">🏆</span>
      <span>成就: <span class="status-value" id="achievementCount">0</span></span>
    </div>
    <div class="status-item" id="backpackBtn" style="cursor:pointer;" onclick="showBackpack()">
      <span class="status-icon">🎒</span>
      <span>背包</span>
    </div>
  </div>

  <div class="screen active" id="startScreen">
    <div class="hero-section">
      <div class="hero-mascot">🔬</div>
      <h1 class="hero-title">科学探险家</h1>
      <p class="hero-subtitle">五年级下册 · 趣味闯关</p>
      <p style="color: rgba(255,255,255,0.6); margin: 15px 0; font-size: 0.95em;">
        粤教粤科版 · 两单元 · 趣味答题 · 成就解锁
      </p>
      <button class="start-btn" onclick="showLoginScreen()">🚀 开始挑战</button>
    </div>
    
    <!-- 成就预览 -->
    <div class="achievements-section">
      <div class="achievements-title">🏅 成就预览（点击查看）</div>
      <div class="achievements-grid" id="achievementPreview"></div>
    </div>
  </div>

  <div class="screen" id="levelScreen">
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <div class="screen" id="quizScreen">
    <div class="quiz-header">
      <button class="back-btn" onclick="showLevelSelect()">← 返回</button>
      <span class="quiz-progress" id="quizProgress">1/10</span>
    </div>
    <div class="question-card" id="questionCard">
      <span class="question-type type-choice" id="questionType">单选题</span>
      <p class="question-text" id="questionText">题目加载中...</p>
      <div class="options" id="optionsContainer"></div>
      <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 提示 (3)</button>
      <div class="hint-box" id="hintBox"></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <div class="screen" id="resultScreen">
    <div class="result-card">
      <div class="result-icon" id="resultIcon">🎉</div>
      <h2 class="result-title" id="resultTitle">恭喜完成！</h2>
      <div class="result-score" id="resultScore">0分</div>
      <div class="result-stats">
        <div class="stat-item">
          <span class="stat-value" id="correctCount">0</span>
          <span class="stat-label">正确</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="accuracy">0%</span>
          <span class="stat-label">正确率</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="maxStreakResult">0</span>
          <span class="stat-label">最高连胜</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="showLevelSelect()">返回关卡</button>
        <button class="btn btn-primary" onclick="restartQuiz()">再玩一次</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="loginOverlay">
  <div class="login-box">
    <h2 class="login-title">🔐 输入学号登录</h2>
    <input type="text" class="login-input" id="studentIdInput" placeholder="请输入8位学号" maxlength="8" onkeypress="if(event.key==='Enter')loginWithId()">
    <button class="login-btn" id="loginBtn" onclick="loginWithId()">登录存档</button>
    <button class="guest-btn" id="guestBtn" onclick="loginAsGuest()">游客试玩</button>
  </div>
</div>

<script>
const questionData = {
  unit1: {
    name: '第一单元 身边的桥梁',
    icon: '🌉',
    lessons: [
      { id: 'u1l1', name: '第1课 平直的梁桥', icon: '🏗️',
        basic: [
          { q: '桥梁的主要作用是（    ）。', options: ['美观装饰', '方便行人和车辆通行', '拦截水流', '发电'], answer: 1, hint: '桥梁是为了方便人们跨越障碍而建造的。' },
          { q: '桥梁必须具备一定的（    ）能力，才能让行人、车辆安全通行。', options: ['美观', '承重', '抗风', '防水'], answer: 1, hint: '想一想，桥上要承受车辆和行人的重量。' },

    { id: 'staff', name: '魔法杖', icon: '🪄' },
    { id: 'shield', name: '盾牌', icon: '🛡️' }
  ],
  
  // 效果类型
  effectTypes: [
    { id: 'bonus', name: '积分加成' },
    { id: 'skip', name: '跳过题目' },
    { id: 'shield', name: '护盾' },
    { id: 'combo', name: '连击保护' }
  ],
  
  // 根据等级和类型生成装备
  generateEquip(levelKey, typeId) {
    const level = this.levels[levelKey];
    const typeInfo = this.equipTypes.find(t => t.id === typeId);
    const prefix = level.name;
    
    const effects = {
      common: { value: '+1%积分', pointBonus: 0.01 },
      exquisite: { value: '+2%积分', pointBonus: 0.02 },
      good: { value: '+3%积分', pointBonus: 0.03 },
      rare: { value: '+5%积分', pointBonus: 0.05 },
      epic: { value: '+8%积分', pointBonus: 0.08 },
      legendary: { value: '积分×2', pointBonus: 2 },
      mythic: { value: '积分×3', pointBonus: 3 }
    };
    
    return {
      id: `${typeId}_${levelKey}`,
      name: `${prefix}${typeInfo.name}`,
      icon: typeInfo.icon,
      level: levelKey,
      levelName: level.name,
      effect: effects[levelKey].value,
      pointBonus: effects[levelKey].pointBonus,
      color: level.color
    };
  },
  
  // 生成完整的装备池
  getEquipmentPool() {
    const pool = [];
    for (const typeInfo of this.equipTypes) {
      for (const levelKey of Object.keys(this.levels)) {
        pool.push(this.generateEquip(levelKey, typeInfo.id));
      }
    }
    return pool;
  },
  
  totalDropRate: 0.01
};

function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.animationDuration = (10 + Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function showLoginScreen() { document.getElementById('loginOverlay').classList.add('show'); }
function hideLoginScreen() { document.getElementById('loginOverlay').classList.remove('show'); }

function loginWithId() {
  const id = document.getElementById('studentIdInput').value.trim();
  if (id.length !== 8 || !/^\d+$/.test(id)) { alert('请输入正确的8位数字学号！'); return; }
  gameState.studentId = id;
  gameState.isGuest = false;
  hideLoginScreen();
  loadUserData();
  showLevelSelect();
}

function loginAsGuest() {
  gameState.studentId = null;
  gameState.isGuest = true;
  hideLoginScreen();
  showLevelSelect();
}

function showLevelSelect() {
  renderLevelGrid();
  showScreen('levelScreen');
}

  grid.innerHTML = '';
  
  for (const [unitKey, unit] of Object.entries(questionData)) {
    const title = document.createElement('div');
    title.className = 'unit-title';
    title.innerHTML = `<span>${unit.icon}</span>${unit.name}`;
    grid.appendChild(title);
    
    for (const lesson of unit.lessons) {
      const progress = gameState.lessonProgress[lesson.id] || 0;
      const stars = '⭐'.repeat(progress) + '☆'.repeat(3 - progress);
      const completed = progress >= 1;
      
      const card = document.createElement('div');
      card.className = `level-card ${completed ? 'completed' : ''}`;
      card.style.setProperty('--card-color', unitKey === 'unit1' ? '#4caf50' : '#9c27b0');
      card.onclick = () => startLesson(lesson);
      card.innerHTML = `
        <div class="level-icon">${lesson.icon}</div>
        <div class="level-name">${lesson.name}</div>
        <div class="level-stars">${stars}</div>
        <span class="level-badge ${completed ? 'badge-easy' : 'badge-locked'}">${completed ? '已完成' : '未完成'}</span>
      `;
      grid.appendChild(card);
    }
  }
  updateStatusBar();
}

function updateStatusBar() {
  document.getElementById('totalPoints').textContent = gameState.totalPoints;
  document.getElementById('currentStreak').textContent = gameState.currentStreak;
  document.getElementById('streakIcon').style.display = gameState.currentStreak >= 2 ? 'inline' : 'none';
  document.getElementById('userBadge').textContent = gameState.isGuest ? '🚶 游客' : `👤 ${gameState.studentId}`;
}

function startLesson(lesson) {
  gameState.currentLesson = lesson;
  gameState.currentQuestion = 0;
  gameState.correctCount = 0;
  gameState.currentStreak = 0;
  gameState.maxStreak = 0;
  gameState.hintsRemaining = 3;
  
  const allQuestions = [
    ...lesson.basic.map(q => ({...q, difficulty: 'basic', difficultyName: '基础题'})),
    ...lesson.medium.map(q => ({...q, difficulty: 'medium', difficultyName: '提升题'})),
    ...lesson.hard.map(q => ({...q, difficulty: 'hard', difficultyName: '挑战题'}))
  ];
  
  for (let i = allQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
  }
  gameState.currentQuestions = allQuestions;
  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = gameState.currentQuestions[gameState.currentQuestion];
  const total = gameState.currentQuestions.length;
  
  document.getElementById('quizProgress').textContent = `${gameState.currentQuestion + 1}/${total}`;
  document.getElementById('questionText').textContent = q.q;
  
  const typeEl = document.getElementById('questionType');
  typeEl.textContent = q.difficultyName;
  typeEl.className = `question-type ${q.difficultyName === '基础题' ? 'type-choice' : q.difficultyName === '提升题' ? 'type-choice' : 'type-judge'}`;
  
  const optionsContainer = document.getElementById('optionsContainer');
  optionsContainer.innerHTML = '';
  
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectOption(idx);
    optionsContainer.appendChild(btn);
  });
  
  const hintBtn = document.getElementById('hintBtn');
  hintBtn.textContent = `💡 提示 (${gameState.hintsRemaining})`;
  hintBtn.disabled = gameState.hintsRemaining <= 0;
  document.getElementById('hintBox').classList.remove('show');
  document.getElementById('hintBox').textContent = q.hint || '暂无提示';
  
  document.getElementById('prevBtn').style.visibility = gameState.currentQuestion > 0 ? 'visible' : 'hidden';
  document.getElementById('nextBtn').textContent = gameState.currentQuestion >= total - 1 ? '查看结果' : '下一题 →';
}

function selectOption(idx) {
  const q = gameState.currentQuestions[gameState.currentQuestion];
  const options = document.querySelectorAll('.option');
  if (options[idx].classList.contains('disabled')) return;
  
  options.forEach(opt => opt.classList.add('disabled'));
  
  const isCorrect = idx === q.answer;
  options[idx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) options[q.answer].classList.add('correct');
  
  if (isCorrect) {
    gameState.currentStreak++;
    gameState.correctCount++;
    if (gameState.currentStreak > gameState.maxStreak) gameState.maxStreak = gameState.currentStreak;
    
    let points = 10;
    if (q.difficulty === 'medium') points = 15;
    if (q.difficulty === 'hard') points = 20;
    points = Math.floor(points * (1 + gameState.currentStreak * 0.1));
    gameState.totalPoints += points;
    checkAchievements();
  } else {
    gameState.currentStreak = 0;
  }
  
  updateStatusBar();
  
  setTimeout(() => {
    if (gameState.currentQuestion < gameState.currentQuestions.length - 1) {
      gameState.currentQuestion++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 1500);
}

function showHint() {
  if (gameState.hintsRemaining <= 0) return;
  gameState.hintsRemaining--;
  const hintBox = document.getElementById('hintBox');
  hintBox.classList.add('show');
  document.getElementById('hintBtn').textContent = `💡 提示 (${gameState.hintsRemaining})`;
  document.getElementById('hintBtn').disabled = gameState.hintsRemaining <= 0;
}

function finishQuiz() {
  const total = gameState.currentQuestions.length;
  const accuracy = Math.round((gameState.correctCount / total) * 100);
  
  const lessonId = gameState.currentLesson.id;
  if (accuracy >= 60 && (!gameState.lessonProgress[lessonId] || gameState.lessonProgress[lessonId] < 3)) {
    gameState.lessonProgress[lessonId] = Math.min(3, (gameState.lessonProgress[lessonId] || 0) + 1);
  }
  
  checkUnitAchievements();
  
  // 装备掉落：每完成一课100%掉落
  if (accuracy >= 60) {
    tryDropEquip(false); // 普通掉落（单课）
  }
  
  saveUserData();
  
  document.getElementById('resultIcon').textContent = accuracy >= 80 ? '🎉' : accuracy >= 60 ? '👍' : '💪';
  document.getElementById('resultTitle').textContent = accuracy >= 80 ? '太棒了！' : accuracy >= 60 ? '不错哦！' : '继续加油！';
  document.getElementById('resultScore').textContent = `${gameState.correctCount}/${total}`;
  document.getElementById('correctCount').textContent = gameState.correctCount;
  document.getElementById('accuracy').textContent = accuracy + '%';
  document.getElementById('maxStreakResult').textContent = gameState.maxStreak;
  
  showScreen('resultScreen');
}

// 装备掉落函数
function tryDropEquip(isUnitComplete) {
  // 单课掉落：大概率绿白，不可能红金橙
  // 单元完成掉落：有机会获得红金橙
  
  const levelKeys = Object.keys(equipmentSystem.levels);
  
  if (isUnitComplete) {
    // 单元完成：所有等级都有可能，但概率递减
    const rand = Math.random();
    let cumulative = 0;
    let targetLevel = 'common';
    
    for (const level of levelKeys) {
      cumulative += equipmentSystem.levels[level].dropRate;
      if (rand < cumulative) {
        targetLevel = level;
        break;
      }
    }
    
    dropEquip(targetLevel);
  } else {
    // 单课掉落：只可能是 common, exquisite, good, rare
    const commonLevels = ['common', 'exquisite', 'good', 'rare'];
    const weights = [0.50, 0.35, 0.12, 0.03]; // 白50%, 绿35%, 蓝12%, 紫3%
    
    const rand = Math.random();
    let cumulative = 0;
    let targetLevel = 'common';
    
    for (let i = 0; i < commonLevels.length; i++) {
      cumulative += weights[i];
      if (rand < cumulative) {
        targetLevel = commonLevels[i];
        break;
      }
    }
    
    dropEquip(targetLevel);
  }
}

function dropEquip(levelKey) {
  const typeInfo = equipmentSystem.equipTypes[Math.floor(Math.random() * equipmentSystem.equipTypes.length)];
  const equip = equipmentSystem.generateEquip(levelKey, typeInfo.id);
  
  // 添加到背包
  if (!gameState.equipment) gameState.equipment = [];
  
  // 检查是否已拥有同样装备
  const exists = gameState.equipment.find(e => e.id === equip.id);
  if (!exists) {
    gameState.equipment.push(equip);
    
    // 显示掉落动画
    showEquipDrop(equip);
  }
}

function showEquipDrop(equip) {
  const overlay = document.createElement('div');
  overlay.className = 'equip-drop-overlay';
  overlay.innerHTML = `
    <div class="equip-drop-card">
      <div class="equip-drop-title">🎁 获得新装备！</div>
      <div class="equip-drop-icon">${equip.icon}</div>
      <div class="equip-drop-name" style="color: ${equip.color}">${equip.name}</div>
      <div class="equip-drop-effect">${equip.effect}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  // 添加样式
  if (!document.getElementById('equipDropStyle')) {
    const style = document.createElement('style');
    style.id = 'equipDropStyle';
    style.textContent = `
      .equip-drop-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
        z-index: 9999; animation: fadeIn 0.3s;
      }
      .equip-drop-card {
        background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
        border-radius: 20px; padding: 40px; text-align: center;
        border: 3px solid gold; animation: bounceIn 0.5s;
      }
      .equip-drop-title { font-size: 1.5em; margin-bottom: 20px; }
      .equip-drop-icon { font-size: 4em; margin: 20px 0; }
      .equip-drop-name { font-size: 1.5em; font-weight: bold; margin: 10px 0; }
      .equip-drop-effect { color: #aaa; margin-top: 10px; }
      @keyframes bounceIn {
        0% { transform: scale(0); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
    `;
    document.head.appendChild(style);
  }
  
  // 点击关闭
  overlay.addEventListener('click', () => overlay.remove());
  setTimeout(() => overlay.remove(), 5000);
}

function restartQuiz() { startLesson(gameState.currentLesson); }
function prevQuestion() { if (gameState.currentQuestion > 0) { gameState.currentQuestion--; renderQuestion(); } }
function nextQuestion() { if (gameState.currentQuestion < gameState.currentQuestions.length - 1) { gameState.currentQuestion++; renderQuestion(); } else { finishQuiz(); } }

function checkAchievements() {
  const streaks = [{ id: 'streak_2', min: 2 }, { id: 'streak_3', min: 3 }, { id: 'streak_5', min: 5 }, { id: 'streak_7', min: 7 }, { id: 'streak_10', min: 10 }];
  for (const s of streaks) {
    if (gameState.maxStreak >= s.min && !gameState.unlockedAchievements.includes(s.id)) unlockAchievement(s.id);
  }
  if (gameState.correctCount >= 1 && !gameState.unlockedAchievements.includes('first_blood')) unlockAchievement('first_blood');
}

function checkUnitAchievements() {
  const unit1Complete = questionData.unit1.lessons.every(l => (gameState.lessonProgress[l.id] || 0) >= 1);
  const unit2Complete = questionData.unit2.lessons.every(l => (gameState.lessonProgress[l.id] || 0) >= 1);
  if (unit1Complete && !gameState.unlockedAchievements.includes('unit1_master')) unlockAchievement('unit1_master');
  if (unit2Complete && !gameState.unlockedAchievements.includes('unit2_master')) unlockAchievement('unit2_master');
  if (unit1Complete && unit2Complete && !gameState.unlockedAchievements.includes('all_complete')) unlockAchievement('all_complete');
}


function unlockAchievement(id) {
  if (gameState.unlockedAchievements.includes(id)) return;
  gameState.unlockedAchievements.push(id);
  const a = gameState.allAchievements.find(x => x.id === id);
  showAchievementUnlock(a);
  updateStatusBar();
  renderAchievementPreview();
  saveUserData();
}

function saveUserData() {
  if (gameState.isGuest) return;
  localStorage.setItem('scienceGame5_user_' + gameState.studentId, JSON.stringify({
    totalPoints: gameState.totalPoints,
    lessonProgress: gameState.lessonProgress,
    unlockedAchievements: gameState.unlockedAchievements,
    equipment: gameState.equipment
  }));
}

function loadUserData() {
  if (gameState.isGuest) return;
  const saved = localStorage.getItem('scienceGame5_user_' + gameState.studentId);
  if (saved) {
    const d = JSON.parse(saved);
    gameState.totalPoints = d.totalPoints || 0;
    gameState.lessonProgress = d.lessonProgress || {};
    gameState.unlockedAchievements = d.unlockedAchievements || [];
    gameState.equipment = d.equipment || [];
  }
}

document.getElementById('loginBtn').addEventListener('click', loginWithId);
document.getElementById('guestBtn').addEventListener('click', loginAsGuest);
document.getElementById('studentIdInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') loginWithId(); });
createParticles();

// ========== 成就解锁动画 ==========
function showAchievementUnlock(achievement) {
  const el = document.getElementById('achievementUnlock');
  document.getElementById('unlockIcon').textContent = achievement.icon;
  document.getElementById('unlockName').textContent = achievement.name;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ========== 背包系统 ==========
function showBackpack() {
  const overlay = document.getElementById('backpackOverlay');
  const grid = document.getElementById('backpackGrid');
  
  // 更新统计
  document.getElementById('equipCount').textContent = gameState.equipment ? gameState.equipment.length : 0;
  
  // 统计各等级装备
  const counts = { common: 0, exquisite: 0, good: 0, rare: 0, epic: 0, legendary: 0, mythic: 0 };
  if (gameState.equipment) {
    gameState.equipment.forEach(e => counts[e.level]++);
  }
  document.getElementById('count-common').textContent = counts.common;
  document.getElementById('count-exquisite').textContent = counts.exquisite;
  document.getElementById('count-good').textContent = counts.good;
  document.getElementById('count-rare').textContent = counts.rare;
  document.getElementById('count-epic').textContent = counts.epic;
  document.getElementById('count-legendary').textContent = counts.legendary;
  document.getElementById('count-mythic').textContent = counts.mythic;
  
  // 渲染装备列表
  if (!gameState.equipment || gameState.equipment.length === 0) {
    grid.innerHTML = '<div class="equip-empty">🎒 背包空空如也<br>完成练习即可获得装备</div>';
  } else {
    grid.innerHTML = gameState.equipment.map(equip => `
      <div class="equip-item ${equip.level}">
        <div class="equip-icon">${equip.icon}</div>
        <div class="equip-name">${equip.name}</div>
        <span class="equip-level ${equip.level}">${equip.levelName}</span>
        <div class="equip-effect">${equip.effect}</div>
      </div>
    `).join('');
  }
  
  overlay.classList.add('show');
}

function closeBackpack() {
  document.getElementById('backpackOverlay').classList.remove('show');
}

// 点击遮罩关闭
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('backpack-overlay')) closeBackpack();
});

// ========== 成就预览 ==========
function renderAchievementPreview() {
  const container = document.getElementById('achievementPreview');
  if (!container) return;
  
  container.innerHTML = gameState.allAchievements.map(a => {
    const unlocked = gameState.unlockedAchievements.includes(a.id);
    return `<div class="achievement-badge ${unlocked ? 'unlocked' : 'locked'}" title="${a.desc}">
      ${a.icon} ${a.name}
    </div>`;
  }).join('');
  
  document.getElementById('achievementCount').textContent = gameState.unlockedAchievements.length;
}

// 初始化时渲染成就预览
setTimeout(renderAchievementPreview, 100);
